      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Os nomes que já usou, do mais frequente para o menos. São eles que alimentam as sugestões ao escrever uma transação.<br>'+

        corpo+

  function integrityModal(){
    var m=state.ui.month;
    var dv=integrityDelta(m), iss=integrityIssues(m);
    var caixa=budgetCashUpto(m), orc=budgetedTotal(m);

    var GRUPOS = [
      ["semCat",       "Movimentos sem categoria",
                       "Mexeram no saldo da conta mas não passaram por nenhuma categoria, por isso o orçamento não deu por eles."],
      ["orfa",         "Categoria apagada entretanto",
                       "A categoria destes movimentos já não existe, e o dinheiro deles ficou sem destino no orçamento."],
      ["paraFora",     "Transferências que entram ou saem do orçamento",
                       "Movem dinheiro entre uma conta de orçamento e uma de acompanhamento. Dê-lhes categoria para o orçamento acompanhar."],
      ["rendFora",     "Rendimento fora das contas de orçamento",
                       "Foram marcados como «Rendimento» numa conta que não entra no orçamento, por isso aumentaram o Pronto a atribuir sem haver dinheiro que lhe corresponda."],
      ["categFora",    "Categoria numa conta fora do orçamento",
                       "Contas de acompanhamento estão fora do orçamento. Dar-lhes categoria mexe no «Disponível» dessa categoria sem haver dinheiro do orçamento por trás."],
      ["transfCat",    "Transferências com categoria a mais",
                       "Só devem ter categoria as transferências que atravessam a fronteira do orçamento. Estas têm-na sem a atravessar, e por isso contam o movimento duas vezes."],
      ["transfCartao", "Transferências entre cartão e conta de acompanhamento",
                       "Mexem na reserva para a fatura do cartão sem que saia dinheiro do orçamento. Registe o pagamento do cartão a partir de uma conta de orçamento."],
      ["meia",         "Transferências a que falta a outra metade",
                       "Só existe um dos dois lados — normalmente de dados importados de um ficheiro alterado à mão."]
    ];

    function linha(x){
      var accao = (x.motivo==="paraFora" || x.motivo==="transfCat")
        ? '<button class="btn sm" data-action="fix-transfer" data-id="'+x.t.id+'">Categorizar</button>'
        : '<button class="btn sm" data-action="edit-tx" data-id="'+x.t.id+'">Corrigir</button>';
      var onde = x.outra ? ("para "+esc(x.outra.name)) : esc(x.acc.name);
      return '<div class="int-row"><span class="who"><b>'+esc(x.t.payee||"(sem beneficiário)")+'</b>'+
        '<span class="tag">'+fmtDate(x.t.date)+' · '+esc(x.acc.name)+(x.outra?(' → '+esc(x.outra.name)):'')+'</span></span>'+
        '<span class="amt '+(x.delta<0?"tx-amt out":"tx-amt in")+'">'+fmt(x.delta)+'</span>'+
        accao+'</div>';
    }

    var corpo =
      '<div class="field" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;">'+
        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Dinheiro nas contas de orçamento</span><b style="font-variant-numeric:tabular-nums;">'+fmt(caixa)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Pronto a atribuir + Disponível das categorias</span><b style="font-variant-numeric:tabular-nums;">'+fmt(orc)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:7px 0 0;margin-top:5px;border-top:1px solid var(--border);font-weight:700;">'+
          '<span>Diferença</span><b class="'+(dv<0?"tx-amt out":"tx-amt in")+'" style="font-variant-numeric:tabular-nums;">'+fmt(dv)+'</b></div>'+
      '</div>';

    if (!iss.itens.length && Math.abs(dv) < 0.005) {
      corpo += '<div class="muted" style="text-align:center;padding:18px 0;">✅ Está tudo certo — cada euro nas contas de orçamento tem uma função.</div>';
    } else {
      GRUPOS.forEach(function(g){
        var lista = iss.itens.filter(function(x){ return x.motivo===g[0]; });
        if(!lista.length) return;
        var soma=0; lista.forEach(function(x){ soma+=x.delta; });
        corpo += '<div class="field"><label>'+g[1]+' ('+lista.length+' · '+fmt(round2(soma))+')</label>'+
          '<div class="hint" style="margin:-2px 0 8px;">'+g[2]+'</div>'+
          '<div style="max-height:210px;overflow:auto;">'+lista.map(linha).join("")+'</div></div>';
      });
      var explicado=0; iss.itens.forEach(function(x){ explicado+=x.delta; });
      var resto=round2(dv-explicado);
      if (Math.abs(resto) >= 0.005) {
        corpo += '<div class="hint" style="color:var(--negative);font-weight:600;">Faltam '+fmt(resto)+
          ' que os movimentos acima não explicam. Exporte uma cópia de segurança antes de mexer.</div>';
      }
    }

    if (iss.cartaoSemCat > 0) {
      corpo += '<div class="hint" style="border-top:1px solid var(--border);padding-top:10px;">ℹ️ Há <b>'+iss.cartaoSemCat+
        '</b> movimento(s) no cartão de crédito <b>sem categoria</b>, criado(s) antes de a categoria passar a ser obrigatória. '+
        'Numa <b>compra</b>, é a categoria que faz o orçamento guardar o dinheiro para pagar o cartão; numa <b>devolução</b>, é ela que devolve o dinheiro à categoria onde tinha gasto. '+
        'Abra a conta do cartão e escolha a categoria de cada um.</div>';
    }

    openModal(
      '<div class="modal-head"><h2>🔍 Orçamento vs. contas — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Num orçamento base-zero, o dinheiro nas contas de orçamento tem de ser exatamente igual ao que está por atribuir mais o disponível de todas as categorias. Quando não bate, é porque houve movimentos que o orçamento não conseguiu acompanhar.</p>'+
        corpo+
      '</div>'+
      '<div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>');
  }

        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Por entrar</span><b class="tx-amt in" style="font-variant-numeric:tabular-nums;">'+fmt(up.entra)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:7px 0 0;margin-top:5px;border-top:1px solid var(--border);font-weight:700;"><span>Pronto a atribuir depois de tudo lançado</span>'+
          '<b style="font-variant-numeric:tabular-nums;">'+fmt(round2(rta + up.entra))+'</b></div>'+
        '<div class="hint" style="margin-top:6px;">As saídas já lançadas descontam na categoria respetiva, não no «Pronto a atribuir». As entradas de «Rendimento» é que vão aumentá-lo.</div>'+
      '</div>';
    }
    openModal(
      '<div class="modal-head"><h2>📅 Ainda por lançar — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Regras recorrentes ativas que ainda vão ser lançadas automaticamente até ao fim do mês. Serve para saber o que já está comprometido antes de atribuir dinheiro.</p>'+
        resumo+
        '<div style="max-height:260px;overflow:auto;">'+linhas+'</div>'+
      '</div>'+
      '<div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>');

    var oa=outra?lkAcc(outra.accountId):null;

      '<div class="modal-head"><h2>Categorizar transferência</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">'+(saida
          ? ('Saíram <b>'+fmt(t.outflow)+'</b> do orçamento para «'+esc(oa?oa.name:"outra conta")+'». Escolha de que categoria deve sair esse dinheiro.')
          : ('Entraram <b>'+fmt(t.inflow)+'</b> no orçamento vindos de «'+esc(oa?oa.name:"outra conta")+'». Escolha «Rendimento» para ficarem prontos a atribuir.'))+'</p>'+

      '<div class="modal-foot"><span></span><span><button class="btn" data-action="close">Cancelar</button> '+

  function helpModal() {
    function sec(t){ return '<div style="font-weight:700;color:var(--text);margin:16px 0 6px;font-size:13px;">'+t+'</div>'; }
    openModal(
      '<div class="modal-head"><h2>❓ Como funciona</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body"><div class="help-list">'+

      sec("O essencial")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li><b>Dê uma função a cada euro.</b> O <b>Pronto a atribuir</b> é o dinheiro por distribuir — o objetivo é chegar a 0 €.</li>'+
        '<li>Os <b>rendimentos</b> entram como transações de <b>Entrada</b> com a categoria «Rendimento».</li>'+
        '<li>O que atribui fica em <b>Disponível</b> e transita de mês para mês.</li>'+
        '<li><b>Excesso</b> (a vermelho): gastou mais do que tinha atribuído. Atribua mais para o cobrir, ou use o <b>🩹</b> na linha da categoria para ir buscar o dinheiro a outra.</li>'+
        '<li><b>O excesso transita com a categoria.</b> Se acabar o mês a vermelho, a categoria <b>começa o mês seguinte com esse valor negativo</b> — e continua vermelha até o cobrir. O dinheiro que atribuir em primeiro lugar tapa o buraco: só depois de chegar a zero é que fica disponível para gastar. Assim a dívida fica onde foi criada, à vista, em vez de desaparecer para uma conta geral.</li>'+
      '</ul>'+

      sec("Alvos")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li>Definem-se no <b>✎</b> de cada categoria: mensal, semanal, trimestral, semestral, anual, ou até uma data.</li>'+
        '<li>No mensal, «<b>Repor até X</b>» acrescenta só o que falta para ter X disponível; «<b>Reservar X</b>» acrescenta sempre X, mesmo que já o tenha.</li>'+
        '<li>Trimestral, <b>semestral</b> e anual <b>param de pedir</b> quando já tiver o total. Indicando o mês da despesa, repartem o que falta até lá.</li>'+
        '<li><b>😴 Adiar este mês:</b> num alvo que ainda pede dinheiro, o <b>😴</b> na linha da categoria diz para <b>não chatear só este mês</b> — deixa de aparecer a amarelo e sai do «Financiar alvos». No mês seguinte volta ao normal, ou reative antes com o <b>☀️</b>. Para ver de uma vez tudo o que adiou, use o filtro <b>😴 Adiadas</b> na barra do orçamento — adiadas não são nem «abaixo do alvo» nem «cumpridas», por isso não aparecem nesses.</li>'+
      '</ul>'+

      sec("Distribuir o dinheiro")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li><b>🎯 Financiar alvos</b> — <i>Pronto a atribuir → categorias.</i> Está sempre disponível. Dá a cada categoria o que lhe falta para cumprir o alvo do mês. Pode <b>financiar tudo</b>, ou <b>repartir só o que está por atribuir</b> — esta nunca o deixa negativo, e reparte de três maneiras: <b>por prioridade</b> (serve as Altas primeiro), <b>proporcional</b> (todas ficam igualmente perto do alvo — quem precisa de mais leva mais) ou <b>pela ordem da lista</b> (completa de cima para baixo até acabar).</li>'+
        '<li><b>↩ Repor a zero</b> — <i>categorias → Pronto a atribuir.</i> Aparece quando atribuiu mais do que tinha e o «Pronto a atribuir» ficou <b>negativo</b>. Retira às categorias com dinheiro parado até voltar a zero, com as mesmas três maneiras de repartir — mas ao contrário: <b>por prioridade</b> tira primeiro das <b>Baixas</b>, para proteger as Altas. Nenhuma categoria fica negativa.</li>'+
        '<li><b>🧹 Libertar excedente</b> — <i>categorias → Pronto a atribuir.</i> Aparece quando alguma categoria tem <b>mais do que o alvo dela pede</b> — por exemplo «repor até 200 €» com 500 € lá dentro. No <b>cartão de crédito</b>, o teto é o que falta liquidar: se atribuiu 500 € e só deve 200 €, liberta os 300 € de folga. Estar <b>adiantado</b> num objetivo com data não conta como excedente: se quer 3.000 € e já juntou 2.000 €, o dinheiro é seu e fica onde está — esticar o prazo apenas <b>baixa a mensalidade</b>. As de «reservar todos os meses» nunca entram, porque aí o dinheiro é mesmo para acumular.</li>'+
        '<li><b>🩹 Cobrir</b> — <i>outras categorias → uma categoria.</i> Aparece na linha de uma categoria que ficou <b>negativa</b>, por ter gasto nela mais do que lá tinha. O objetivo é <b>trazê-la a zero</b>. Mostra o que falta e quem tem dinheiro parado, cada um com um cursor. Escolha de onde tirar: <b>primeiro das prioridades mais baixas</b> (sai de onde é menos importante), <b>primeiro de quem tem mais folga</b> (mexe em menos categorias), <b>primeiro de quem precisa do dinheiro mais tarde</b> (dá mais tempo para repor — tira antes das férias do próximo verão do que do seguro que vence para o mês), ou <b>manual</b>. O que ainda não está atribuído é sempre gasto primeiro. Ao cartão de crédito só se tira a folga, nunca o que é preciso para o liquidar.</li>'+
        '<li><b>🎯 na linha de uma categoria</b> — <i>Pronto a atribuir → essa categoria.</i> Faz num toque o que a janela acima faz para todas: junta-lhe de uma vez o que falta para o <b>alvo do mês</b>. Se o «Pronto a atribuir» não chegar, <b>avisa antes</b> de o deixar negativo.</li>'+
        '<li><b>🩹 e 🎯 são coisas diferentes</b> — e podem aparecer os dois na mesma categoria. O <b>🩹 traz a zero</b> (tapa o que gastou a mais) e vai buscar o dinheiro a <b>outras categorias</b>; o <b>🎯 leva ao alvo</b> (o que planeou ter) e vai buscá-lo ao <b>Pronto a atribuir</b>. Por isso o 🩹 fica à esquerda: primeiro tapa-se o buraco, depois volta-se ao plano.</li>'+
        '<li><b>🧽 Limpar atribuições</b> — <i>categorias → Pronto a atribuir.</i> Devolve <b>tudo</b> o que atribuiu neste mês, para recomeçar do zero. Só mexe no mês que está a ver: o que transitou de meses anteriores fica onde está, e as transações não são tocadas. Se já gastou numa categoria mais do que o que transitou, ela fica negativa — a janela avisa quantas, antes de confirmar.</li>'+
                '<li>As cinco <b>mostram o que ia acontecer antes de mexer em alguma coisa</b>, nenhuma tira dinheiro das contas — só muda a função que ele tem — e todas se desfazem com o <b>↩ Anular</b> que fica no topo.</li>'+
        '<li><b>Prioridade</b> ▲ ● ▼ à frente de cada categoria, muda com um clique. É ela que comanda o «por prioridade» das operações acima; entre iguais, manda a <b>ordem da lista</b>.</li>'+
        '<li><b>↔ Mover</b> passa dinheiro <b>do orçamento</b> entre categorias (ou de/para o «Pronto a atribuir»), sem tocar no rendimento — é diferente do <b>↔ Transferir</b> das contas, que move dinheiro <b>real</b> de uma conta para outra.</li>'+
      '</ul>'+

      sec("No ecrã e no teclado")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li><b>O pontinho ao lado de cada conta:</b> <b>verde</b> quer dizer que não há nada por confirmar — a conta está a par do banco. <b>Âmbar</b> quer dizer que há lançamentos que o banco ainda não processou; é o estado normal de quem regista as despesas no próprio dia, não um aviso. No computador, o rato por cima diz quantas são e quanto valem.</li>'+
        '<li><b>O ✓ e o «Por confirmar»:</b> o ✓ marca que o banco já processou a transação. Mexe no <b>Confirmado</b>, não no <b>Saldo</b> — um café pago ontem está pago, tenha o banco lançado ou não, e o orçamento tem de contar com isso. A diferença entre os dois é o <b>Por confirmar</b>, que aparece no cabeçalho da conta e no ecrã das transações: quando chega a zero, a app bate certo com o extrato.</li>'+
        '<li><b>Total do mês:</b> por cima das colunas, a soma do <b>Atribuído</b>, da <b>Atividade</b> e do <b>Disponível</b>. As categorias de <b>pagamento de cartão</b> ficam de fora das três: a atividade delas é o espelho positivo do que se gastou — 50 € de mercearia no cartão dão −50 na Mercearia e +50 no cartão — e somá-las daria zero, como se não se tivesse gasto nada. Os valores do cartão continuam na linha do grupo dele.</li>'+
        '<li><b>Vários orçamentos</b> (na barra lateral, ou no botão com o nome do orçamento no cabeçalho, no telemóvel): pode ter um <b>Pessoal</b> e um <b>Família</b>, por exemplo. Cada um é <b>completamente separado</b> — contas, categorias e transações próprias — e troca-se com um toque. Se sincroniza, vão <b>todos no mesmo gist</b>; só há uma coisa a saber: se editar orçamentos <b>diferentes</b> em aparelhos diferentes antes de sincronizar, a aplicação pergunta qual manter, como faria com qualquer conflito.</li>'+
        '<li><b>A barra de filtros do Orçamento encolhe com a janela.</b> À medida que o espaço aperta, os nomes dos botões vão desaparecendo pela ordem em que fazem menos falta — fica o símbolo, e o rato por cima diz sempre o que é. Se estreitar mesmo muito, a aplicação passa à vista de telemóvel, com o menu em baixo. É de propósito: assim a barra nunca se parte em duas linhas.</li>'+
        '<li><b>O cabeçalho das listas fica à vista:</b> ao descer uma lista de transações, os nomes das colunas — Data, Beneficiário, Categoria… — ficam colados ao topo, para saber sempre o que está a ler. No telemóvel, como a tabela é mais larga do que o ecrã, é a <b>lista</b> que corre dentro da sua própria área em vez da página inteira.</li>'+
        '<li><b>Contas nos campos de dinheiro:</b> em qualquer campo de valor pode escrever a conta em vez do total — <b>23,45+11,90+7,15</b>. O resultado aparece por baixo enquanto escreve e substitui a conta assim que sai do campo. No <b>telemóvel</b> aparece um <b>teclado próprio</b> com <b>+</b> e <b>−</b>, sem letras nem risco de enganos. Num par <b>Saída/Entrada</b>, um <b>−</b> escrito no princípio do campo continua a passar o valor para o outro lado; depois de números, é uma subtração.</li>'+
        '<li><b>Datas e teclado:</b> as datas escrevem-se sempre em <b>dd/mm/aaaa</b>, mesmo que tenha o browser noutro idioma — pode escrever só os números, que as barras aparecem sozinhas, ou usar o 📅 para as escolher no calendário. Dentro de qualquer janela, o <b>Enter</b> vale por carregar no botão principal.</li>'+
        '<li><b>Cor da aplicação:</b> oito à escolha, em <b>Dados e cópias → Definições</b> — basta tocar numa bolinha. Vão do petróleo ao rosa pelo lado do roxo, mais um cinzento e um castanho, e nenhuma é verde nem laranja de propósito: uma cor de marca nessas zonas confunde-se, a um relance, com as barras que dizem se há dinheiro. No computador, o círculo no canto superior direito percorre-as uma a uma. A cor <b>é de cada orçamento</b>, e não do aparelho: fica guardada com ele e vai na sincronização, como as outras definições. Dê uma cor a cada um — verde-azulado ao <b>Pessoal</b>, framboesa ao <b>Família</b>, por exemplo — e passa a saber num relance qual está aberto, no telemóvel e no computador, sem ler o nome. Os verdes e vermelhos dos valores nunca mudam — são eles que dizem se há ou não dinheiro.</li>'+

  var _covSel = null, _covAlvo = null, _covFalta = 0, _covFontes = null;

  function textoPrazo(meses){
    if (meses >= PRAZO_LONGO) return "sem prazo";
    if (meses <= 0) return "precisa este mês";
    return "precisa daqui a "+meses+(meses===1?" mês":" meses");
  }
  function coverModal(alvoId, keepSel) {
    var m = state.ui.month, cat = categoryById(alvoId);
    if (!cat) return;
    var falta = round2(-availableFor(alvoId, m));
    if (falta <= 0.005) { toast("Esta categoria já não está negativa."); return; }
    var modo = state.ui.coverMode || "prio";
    var fontes = coverSources(alvoId, m);
    _covAlvo = alvoId; _covFalta = falta; _covFontes = fontes;
    if (!(keepSel && _covSel)) _covSel = coverAuto(fontes, falta, modo);

    if (!fontes.length) {
      openModal(
        '<div class="modal-head"><h2>🩹 Cobrir «'+esc(cat.name)+'» — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
        '<div class="modal-body">'+
        opIntro('Gastou <b>'+fmt(falta)+'</b> a mais nesta categoria, mas <b>nenhuma outra tem dinheiro parado</b> nem há nada por atribuir.',
          "Nenhuma origem", "«"+esc(cat.name)+"»")+
        '<p class="muted" style="margin:0;">Só há duas saídas: registar mais rendimento, ou aceitar o excesso e deixá-lo passar para o mês seguinte.</p></div>'+
        '<div class="modal-foot"><span></span><button class="btn" data-action="close">Fechar</button></div>');
      return;
    }

    var linhas = coverOrder(fontes, modo).map(function(f){
      var v = _covSel[f.id] || 0;
      return '<div class="cov-row">'+
        // A etiqueta mostra o critério POR QUE se está a ordenar — senão a ordem parecia
        // arbitrária e não havia como conferir a sugestão.
        '<div class="cov-nome">'+(f.rta ? '💵 ' : '<span class="prio-dot p-'+f.prio+'">'+PRIO_ICON[f.prio]+'</span> ')+esc(f.name)+
          '<span class="tag">tem '+fmt(f.max)+(f.rta ? '' :
            (modo==="prazo" ? ' · '+textoPrazo(f.meses) : ' · prioridade '+PRIO_LABEL[f.prio].toLowerCase()))+'</span></div>'+
        '<input type="range" class="cov-slider" data-cov="'+f.id+'" min="0" max="'+f.max+'" step="0.01" value="'+v+'">'+
        '<b class="cov-val" id="cv_'+f.id+'">'+fmt(v)+'</b></div>';
    }).join("");

    openModal(
      '<div class="modal-head"><h2>🩹 Cobrir «'+esc(cat.name)+'» — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        opIntro('Gastou <b>'+fmt(falta)+'</b> a mais nesta categoria — o objetivo é <b>trazê-la a zero</b>. Escolha de onde tirar esse valor.',
          "Outras categorias", "«"+esc(cat.name)+"»")+
        '<div class="field"><label>De onde tirar</label><select id="covModo">'+
          '<option value="prio"'+(modo==="prio"?" selected":"")+'>Primeiro das prioridades mais baixas</option>'+
          '<option value="folga"'+(modo==="folga"?" selected":"")+'>Primeiro de quem tem mais folga</option>'+
          '<option value="prazo"'+(modo==="prazo"?" selected":"")+'>Primeiro de quem precisa do dinheiro mais tarde</option>'+
          '<option value="manual"'+(modo==="manual"?" selected":"")+'>Manual — escolho eu</option>'+
        '</select></div>'+
        '<div id="covKpis">'+opKpis("Em falta", fmt(-falta), "neg", "cobrir", fmt(coverTotal(_covSel)), fmt(round2(coverTotal(_covSel)-falta)), "")+'</div>'+
        '<div class="cov-sum"><span id="covFal"></span></div>'+
        '<div class="cov-list">'+linhas+'</div>'+
      '</div>'+
      '<div class="modal-foot"><span></span><span><button class="btn" data-action="close">Cancelar</button> '+
        '<button class="btn primary" id="covOk" data-action="preview-cover">Cobrir '+fmt(coverTotal(_covSel))+'</button></span></div>');

    function pinta(){
      var tot = coverTotal(_covSel), resta = round2(_covFalta - tot), fica = round2(tot - _covFalta);
      el("covKpis").innerHTML = opKpis("Em falta", fmt(-_covFalta), "neg", "cobrir", fmt(tot), fmt(fica), fica < -0.005 ? "neg" : "pos");
      el("covFal").textContent = resta > 0.005 ? ("Ainda faltam "+fmt(resta)+" — puxe mais algum cursor.") : "✅ Buraco tapado.";
      el("covFal").className = resta > 0.005 ? "muted" : "pos";
      el("covOk").disabled = tot <= 0.005;
      el("covOk").textContent = "Cobrir "+fmt(tot);
    }
    var sliders = document.querySelectorAll("[data-cov]");
    for (var i=0;i<sliders.length;i++) {
      sliders[i].addEventListener("input", function(ev){
        var id = ev.target.getAttribute("data-cov"), pedido = round2(parseFloat(ev.target.value)||0);
        // Nunca deixar juntar mais do que o buraco: o que sobrar é devolvido ao cursor.
        var outros = 0;
        for (var k in _covSel) if (_covSel.hasOwnProperty(k) && k !== id) outros += _covSel[k]||0;
        var tecto = round2(_covFalta - outros);
        if (pedido > tecto) { pedido = Math.max(0, tecto); ev.target.value = pedido; }
        _covSel[id] = pedido;
        el("cv_"+id).textContent = fmt(pedido);
        pinta();
      });
    }
    el("covModo").addEventListener("change", function(ev){
      state.ui.coverMode = ev.target.value; save(); coverModal(alvoId);
    });
    pinta();
  }

  function recurringModal(r){
    if(!state.accounts.length){ toast("Crie primeiro uma conta."); accountModal(); return; }
    // r definido = abrir de novo (nova regra se for null); r indefinido = redesenhar o que está.
    if (r !== undefined) {
      _rec = r ? JSON.parse(JSON.stringify(r))
               : { nextDate:todayISO(), freq:"monthly", accountId:(state.accounts[0]||{}).id, payee:"",
                   categoryId:"", memo:"", outflow:0, inflow:0, active:true };
      _rec._id = r ? r.id : null;
      _rec.tipo = (r && r.toAccountId) ? "transf" : "normal";
    }
    var s = _rec, editing = !!s._id, ehTransf = s.tipo==="transf";
    if (ehTransf && state.accounts.length<2){ toast("Precisa de pelo menos duas contas para transferir."); s.tipo="normal"; ehTransf=false; }
    function opts(sel){ return state.accounts.filter(function(a){return !a.hidden || a.id===sel;}).map(function(a){ return '<option value="'+a.id+'"'+(sel===a.id?" selected":"")+'>'+esc(a.name)+'</option>'; }).join(""); }
    if (ehTransf && !s.toAccountId) { for(var j=0;j<state.accounts.length;j++){ if(state.accounts[j].id!==s.accountId){ s.toAccountId=state.accounts[j].id; break; } } }
    function fo(v,l){ return '<option value="'+v+'"'+(s.freq===v?" selected":"")+'>'+l+'</option>'; }
    var valorTransf = round2((s.outflow||0) || (s.inflow||0));
    openModal(
      '<div class="modal-head"><h2>'+(editing?"Editar recorrente":"Nova regra recorrente")+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+

  // ---------- Ações ----------
  // Aceita vírgula OU ponto como separador de cêntimos (sem separador de milhares).
  // Uma conta escrita à mão no campo ("120+35-10") vale o seu resultado. Exige dígitos dos DOIS
  // lados de cada sinal — é o que impede a colisão com as convenções de sinal dos extratos:
  // "-45,90", "45,90-" (sinal à direita, como alguns bancos escrevem) e "(45,90)" continuam a
  // ser lidos como valores negativos, e não como contas por acabar.
  function avaliaExpr(s){
    s = String(s==null?"":s).replace(/\s+/g, "");
    if (!/^[0-9.,]+(?:[+\-][0-9.,]+)+$/.test(s)) return null;
    var partes = s.match(/[+\-]?[0-9.,]+/g);
    if (!partes) return null;
    var total = 0;
    for (var i=0;i<partes.length;i++){
      var v = parseAmount(partes[i]);          // reaproveita a leitura pt-PT de cada parcela
      if (isNaN(v)) return null;
      total += v;
    }
    if (!isFinite(total) || Math.abs(total) > MAX_VALOR) return null;
    return round2(total);
  }
  function parseAmount(s){
    if (typeof s === "number") return s;
    s = String(s==null?"":s).trim();
    if (!s) return NaN;
    var exp = avaliaExpr(s);                   // "120+35" vale 155 em qualquer campo de dinheiro
    if (exp !== null) return exp;
    // Negativo pode vir como "-45,90", "45,90-" (alguns bancos põem o sinal à direita) ou entre
    // parênteses, "(45,90)" — a convenção contabilística que o Excel e vários extratos usam. Sem
    // reconhecer os parênteses, uma despesa era importada como ENTRADA de dinheiro.
    var neg = s.indexOf("-") >= 0 || (/\(\s*[0-9][0-9.,\s]*\)/.test(s));
    s = s.replace(/[^0-9.,]/g, "");
    if (!s) return NaN;
    var di = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var intp, frac;
    if (di === -1) { intp = s; frac = ""; }
    else { intp = s.slice(0, di).replace(/[.,]/g, ""); frac = s.slice(di+1).replace(/[.,]/g, ""); }
    var v = parseFloat((intp || "0") + (frac ? ("." + frac) : ""));
    if (isNaN(v)) return NaN;
    // Fora de escala conta como inválido. Este é o único sítio por onde passam TODOS os
    // valores (formulários e importação de CSV) — sem isto, um número absurdo vindo de um
    // ficheiro tornava-se Infinity e envenenava todas as somas do orçamento.
    if (!isFinite(v) || v > MAX_VALOR) return NaN;
    return neg ? -v : v;
  }
  function amtStr(n){ if (n===""||n===null||n===undefined||n===0) return ""; return String(n).replace(".", ","); }

  // ---------- Limites do que pode entrar ----------
  // Tudo o que se escreve vai parar ao armazenamento do navegador (~5 MB), ao ficheiro de
  // cópia e ao gist. Sem tecto, um texto colado por engano ou um ficheiro enorme enchem tudo.
  var LIM_NOME = 60, LIM_PAYEE = 100, LIM_NOTA = 300, LIM_TOKEN = 255;
  var MAX_VALOR = 1e12;                    // chega para qualquer orçamento pessoal
  var MAX_FICH_JSON = 20*1024*1024;        // 20 MB
  var MAX_FICH_CSV  = 10*1024*1024;        // 10 MB
  var MAX_LINHAS_CSV = 20000;
  function corta(s, n){ s=String(s==null?"":s).trim(); return s.length>n ? s.slice(0,n) : s; }

  // ---------- Campos de valor ----------
  // Deixa passar apenas dígitos e UM separador decimal, com 9 inteiros e 2 decimais no máximo.
  // Havendo vários separadores, o último é o decimal e os anteriores eram de milhares — assim
  // colar «1.234,56» do banco dá 1234,56 em vez de estragar o número.
  var LIM_INT = 9, LIM_DEC = 2;
  function limpaValor(txt, permiteNegativo){
    var s = String(txt==null?"":txt);
    var neg = permiteNegativo && s.indexOf("-") >= 0;
    s = s.replace(/[^0-9.,]/g, "");
    var ult = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var intp, frac = null, sep = ",";
    if (ult < 0) { intp = s; }
    else { sep = s.charAt(ult); intp = s.slice(0, ult).replace(/[.,]/g, ""); frac = s.slice(ult+1).replace(/[.,]/g, ""); }
    intp = intp.slice(0, LIM_INT);
    if (frac !== null) frac = frac.slice(0, LIM_DEC);
    return (neg?"-":"") + intp + (frac===null ? "" : sep+frac);
  }
  // Como limpaValor, mas deixa passar os sinais + e − para se poder escrever a conta no campo.
  // Cada parcela é limitada como um valor normal; sinais repetidos ficam reduzidos a um só.
  function limpaExpr(txt, permiteNegativo){
    var s = String(txt==null?"":txt).replace(/[^0-9.,+\-]/g, "");
    // Sinais seguidos: vale o ÚLTIMO, que é o que a pessoa acabou de escrever ao corrigir-se.
    // "5++3" -> "5+3"; "5+-3" -> "5-3" (trocou a soma por subtração).
    s = s.replace(/[+\-]{2,}/g, function(m){ return m.charAt(m.length-1); });
    s = permiteNegativo ? s.replace(/^\+/, "") : s.replace(/^[+\-]+/, "");
    var toks = s.split(/([+\-])/), out = "";
    for (var i=0;i<toks.length;i++) out += (toks[i]==="+"||toks[i]==="-") ? toks[i] : limpaValor(toks[i], false);
    return out;
  }

  function num(id) {

  // Tudo o que fica pendurado numa categoria quando ela desaparece. Vive aqui, e nao dentro
  // do "delete-category", porque eliminar um GRUPO elimina as categorias dele — e fazia-o sem
  // limpar nada: as atribuições ficavam órfãs e continuavam a descontar do «Pronto a
  // atribuir» para sempre, sem nenhuma categoria à vista que o explicasse.
  function limparRestosDaCategoria(id){
    for (var t=0;t<state.transactions.length;t++) if(state.transactions[t].categoryId===id) state.transactions[t].categoryId=null;
    for (var k in state.assignments) if(state.assignments.hasOwnProperty(k) && k.split("|")[0]===id) delete state.assignments[k];
    for (var sk in state.snooze) if(state.snooze.hasOwnProperty(sk) && sk.split("|")[0]===id) delete state.snooze[sk];
    // As regras recorrentes também apontavam para a categoria apagada: continuavam ativas e
    // passavam a lançar, TODOS os meses, transações com uma categoria que já não existe — que
    // depois apareciam como "órfãs" no aviso de integridade. Desativam-se para o utilizador
    // decidir o que fazer, em vez de desaparecerem em silêncio.
    var n=0;
    for (var r=0;r<(state.recurring||[]).length;r++){
      if(state.recurring[r].categoryId===id){ state.recurring[r].categoryId=null; state.recurring[r].active=false; n++; }
    }
    return n;
  }

  }

    pushUndo("Conta reordenada.");

    else desfazerPushUndo(redoAntes, pendAntes);
  }

    "delete-account": function(id){
      var a = accountById(id); if(!a) return;
      // Uma transferência tem uma metade em cada conta. Apagar só a metade desta conta
      // deixaria a outra órfã; apagar as duas mudaria o saldo de uma conta que fica.
      // A saída certa é a outra metade sobreviver como movimento normal.
      var paresTocados = {}, nOutras = 0, i, t;
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && t.accountId===id) paresTocados[t.transfer]=true; }
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && paresTocados[t.transfer] && t.accountId!==id) nOutras++; }
      var aviso = "Eliminar a conta «"+a.name+"» e todas as suas transações?";
      if (nOutras) aviso += "\n\n"+nOutras+" transferência"+(nOutras===1?"":"s")+" ligava"+(nOutras===1?"":"m")+
        " esta conta a outras. A outra metade fica onde está, como movimento normal — o saldo dessas contas não muda, mas pode precisar de lhe dar categoria.";
      if (!confirm(aviso)) return;
      pushUndo("Conta «"+a.name+"» eliminada.");
      if (a.paymentCatId) removePaymentCategory(a);
      state.accounts = state.accounts.filter(function(x){return x.id!==id;});
      // Um cartão podia ter esta conta como "conta de pagamento predefinida". Sem limpar, ficava
      // uma referência morta e o "💳 Pagar" pré-selecionava uma conta que já não existe.
      for (var pf=0; pf<state.accounts.length; pf++) if(state.accounts[pf].payFrom===id) state.accounts[pf].payFrom=null;
      state.transactions = state.transactions.filter(function(x){return x.accountId!==id;});
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && paresTocados[t.transfer]) delete t.transfer; }
      // regras recorrentes que usavam esta conta como origem OU como destino
      state.recurring = (state.recurring||[]).filter(function(r){ return r.accountId!==id && r.toAccountId!==id; });
      // A conta desapareceu: se a lista estava filtrada por ela, ficava a mostrar o vazio.
      if (state.ui.txFilter && state.ui.txFilter.account===id) state.ui.txFilter=null;
      closeModal(); save(); render(); showUndo();
    },

    "archive-category": function(id){

      // ser alcançável, porque as ferramentas de reequilibrar só olham para as visíveis. Em vez
      // de o deixar preso em silêncio, avisa-se e oferece-se devolvê-lo.
      var sobra = round2(availableFor(id, state.ui.month));
      if (sobra > 0.005) {
        if (!confirm("«"+c.name+"» tem "+fmt(sobra)+" disponível.\n\n"+
                     "Se arquivar assim, esse dinheiro continua a contar mas deixa de estar à vista nem de poder ser movido.\n\n"+
                     "Devolver "+fmt(sobra)+" ao «Pronto a atribuir» e arquivar?")) return;
        var ch = id+"|"+state.ui.month;
        pushUndo("Categoria arquivada.");
        state.assignments[ch] = round2((state.assignments[ch]||0) - sobra);
        if (Math.abs(state.assignments[ch]) < 0.005) delete state.assignments[ch];
        logMove("🗄 Arquivou «"+c.name+"» — devolveu o que sobrava", -sobra);
      } else {
        pushUndo("Categoria arquivada.");
      }
      c.hidden=true; closeModal(); save(); render();
      toast("Categoria arquivada — reponha em Dados e cópias → Arquivados.");
    },

    "duplicate-tx": function(id){
      var t=txById(id); if(!t) return;
      // Duplicar copia tudo tal e qual — incluindo a falta de categoria. Seria a porta das traseiras
      // para criar movimentos sem categoria depois de esta passar a ser obrigatória: pede-se antes
      // para corrigir o original (uma correção, em vez de dois problemas).
      if(faltaCategoria(t)){ toast("Escolha primeiro a categoria desta transação — só depois a pode duplicar."); return; }
      // O duplicado fica com a data de hoje (por confirmar) — copia tudo o resto tal e qual.
      function copyOf(src, extra){ var c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.cleared=false; c.date=todayISO(); if(extra) for(var k in extra) c[k]=extra[k]; return c; }
      pushUndo("Transação duplicada.");
      var msg="Transação duplicada (por confirmar).";
      if (t.transfer) {
        var np=uid(), halves=state.transactions.filter(function(x){return x.transfer===t.transfer;});
        halves.forEach(function(h){ state.transactions.push(copyOf(h,{transfer:np})); });
        msg="Transferência duplicada (por confirmar).";
        logMove("⧉ Duplicou transferência", null);
      } else if (t.split) {
        var ns=uid(), parts=state.transactions.filter(function(x){return x.split===t.split;});
        parts.forEach(function(p){ state.transactions.push(copyOf(p,{split:ns})); });
        msg="Transação dividida duplicada ("+parts.length+" partes, por confirmar).";
        logMove("⧉ Duplicou transação dividida ("+parts.length+" partes)", null);
      } else {
        state.transactions.push(copyOf(t));
        logMove("⧉ Duplicou: "+(t.payee||t.memo||"transação"), round2((t.inflow||0)-(t.outflow||0)));

      save(); render(); toast(msg); showUndo();
    },

      // e sem isto eram apagadas em silêncio — sem confirmação e sem limpeza — levando o
      // dinheiro que tinham atribuído para um limbo que ninguém conseguia ver nem recuperar.
      var doGrupo=state.categories.filter(function(c){return c.groupId===id;});
      var arquivadas=doGrupo.filter(function(c){return c.hidden;}).length;
      // Uma categoria de pagamento de cartão não se apaga à mão (é do cartão, não do utilizador):
      // se o grupo tiver uma, o cartão teria de ser eliminado primeiro.
      for (var q=0;q<doGrupo.length;q++) if(doGrupo[q].cardId){
        toast("Este grupo tem a categoria de pagamento de um cartão. Elimine primeiro o cartão, em Contas."); return;
      }
      if (doGrupo.length && !confirm("O grupo tem "+doGrupo.length+" categoria"+(doGrupo.length===1?"":"s")+
          (arquivadas?" ("+arquivadas+" arquivada"+(arquivadas===1?"":"s")+")":"")+
          ". Eliminar o grupo e essas categorias? As transações delas ficam sem categoria e o dinheiro atribuído volta ao «Pronto a atribuir».")) return;
      pushUndo("Grupo eliminado.");
      state.groups=state.groups.filter(function(g){return g.id!==id;});
      state.categories=state.categories.filter(function(c){return c.groupId!==id;});
      // A MESMA limpeza da eliminação de uma categoria, para cada uma das que iam dentro.
      var recG=0;
      for (var w=0;w<doGrupo.length;w++) recG += limparRestosDaCategoria(doGrupo[w].id);
      state.ui.lastFunding=null;
      avisoRecorrentes(recG);
      closeModal(); save(); render(); showUndo();
    },

    "save-category": function(id){
      var name=valLim("catName", LIM_NOME); if(!name){ toast("Indique um nome."); return; }
      var groupId=el("catGroup").value;
      var tType=el("catTType").value, tv=num("catTarget");
      var target=null;
      if (tType!=="none" && tv>0) {
        target={ type:tType, amount:tv };
        if (tType==="byDate") {
          target.date = el("catTargetDate").value || shiftMonth(state.ui.month,6);
          target.fund = el("catFund").value;
          if (target.fund==="setAside") {
            // Congela a mensalidade AGORA e pede-a fixa até à data, gaste-se o que se gastar.
            // Reabrir e guardar volta a congelar a partir do ponto onde estiver.
            var availAg = id ? availableFor(id, state.ui.month) : 0;
            var assignAg = id ? assignedFor(id, state.ui.month) : 0;
            target.slice = sliceAteData(tv, availAg, assignAg, state.ui.month, target.date);
          }
        }
        if (tType==="weekly") target.weekday = parseInt(el("catWeekday").value,10);
        if (tType==="monthly") target.fund = el("catFund").value;
        if (tType==="quarterly" || tType==="semiannual" || tType==="yearly") {
          target.fund = el("catFund").value;
          // No modo Reservar o valor é fixo (total ÷ período), por isso o mês da despesa não
          // entra na conta — não o guardamos para não deixar dados que baralham.
          if (target.fund!=="setAside") { var dd=el("catTargetDue").value; if(dd) target.due=dd; }
        }
      }
      var note=valLim("catNote", LIM_NOTA);
      var prio=el("catPrio")?el("catPrio").value:"normal";
      pushUndo(id ? "Categoria alterada." : "Categoria criada.");
      // Nota vazia é nota nenhuma: apaga-se o campo em vez de o guardar a "". Ter duas
      // representações da mesma coisa dava diferenças de assinatura na sincronização — e na
      // importação da configuração — sem nada ter mudado de facto.
      if (id){ var c=categoryById(id); c.name=name; c.groupId=groupId; c.target=target; c.priority=prio;
               if(note) c.note=note; else delete c.note; }
      else { var nc={id:uid(), name:name, groupId:groupId, target:target, priority:prio};
             if(note) nc.note=note; state.categories.push(nc); }
      closeModal(); save(); render(); toast("Categoria guardada.");
    },

    "preview-cover": function(){

      var cat=categoryById(alvo)||{name:""};

      var linhas="";
      for(var id in sel){ if(!sel.hasOwnProperty(id)) continue; var v=sel[id]; if(v<=0.005) continue;
        var f=byId[id]||{name:id, rta:(id===RTA_ID)};
        linhas += '<div style="display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid rgba(128,128,128,.22);">'+
          '<span>'+(f.rta?'💵 ':'')+esc(f.name)+'</span><b>− '+fmt(v)+'</b></div>';
      }
      var resta=round2(_covFalta - tot), fica=round2(tot - _covFalta);

        ? '<p class="muted" style="margin:.5rem 0 0;">Cobre '+fmt(tot)+' dos '+fmt(_covFalta)+' em falta — ainda ficam '+fmt(resta)+' por tapar.</p>'
        : '<p class="pos" style="margin:.5rem 0 0;">✅ Tapa o excesso por completo'+(fica>0.005?(' (sobram '+fmt(fica)+' na categoria)'):'')+'.</p>';
      openModal(
        '<div class="modal-head"><h2>Confirmar — cobrir «'+esc(cat.name)+'»</h2><button class="x" data-action="close">×</button></div>'+
        '<div class="modal-body">'+
          '<p class="muted" style="margin:0 0 .3rem;">Vai tirar <b>'+fmt(tot)+'</b> destas origens para «'+esc(cat.name)+'»:</p>'+
          '<div>'+linhas+'</div>'+ nota +
        '</div>'+
        '<div class="modal-foot"><span></span><span><button class="btn" data-action="back-cover">‹ Voltar</button> '+
          '<button class="btn primary" data-action="apply-cover">Confirmar — cobrir '+fmt(tot)+'</button></span></div>');

    "back-cover": function(){ if(_covAlvo) coverModal(_covAlvo, true); },
    "apply-cover": function(){
      var m=state.ui.month, alvo=_covAlvo, sel=_covSel;
      if(!alvo||!sel){ return; }
      var tot=coverTotal(sel);
      if(tot<=0.005){ toast("Escolha de onde tirar o dinheiro."); return; }
      pushUndo("Excesso coberto.");
      var snap=[], nFontes=0;
      function guarda(key){ snap.push({key:key, prev: state.assignments.hasOwnProperty(key)?state.assignments[key]:null}); }
      for(var id in sel){
        if(!sel.hasOwnProperty(id)) continue;
        var t=sel[id]; if(t<=0.005) continue;
        nFontes++;
        // Do «Pronto a atribuir» não há nada a descontar: é dinheiro ainda sem função.
        if(id!==RTA_ID){ var kf=id+"|"+m; guarda(kf); state.assignments[kf]=round2((state.assignments[kf]||0)-t); }
      }
      var ka=alvo+"|"+m; guarda(ka); state.assignments[ka]=round2((state.assignments[ka]||0)+tot);
      state.ui.lastFunding={month:m, entries:snap};
      var nome=(categoryById(alvo)||{}).name||"";
      logMove("🩹 Cobriu «"+nome+"»", tot);
      _covSel=null; _covAlvo=null; _covFontes=null;
      closeModal(); save(); render();
      toast("Coberto "+fmt(tot)+" em «"+nome+"» — pode anular no topo.");
    },
    "fund-one": function(id){
      var m=state.ui.month; var c=categoryById(id); if(!c) return;
      var ti=targetInfo(c,m); if(!ti||!(ti.need>0)){ toast("Alvo já cumprido."); return; }
      // O 🎯 tira sempre do «Pronto a atribuir». Se não chegar, avisa ANTES — o mesmo cuidado que a
      // janela de financiar em lote já tinha. Sem isto, um toque podia pôr o mês a vermelho sem dar
      // por isso. (Deixa passar se o utilizador confirmar: às vezes é mesmo o que se quer.)
      var rtaDepois = round2(readyToAssign(m) - ti.need);
      if (rtaDepois < -0.005 && !confirm(
            "Financiar «"+c.name+"» precisa de "+fmt(ti.need)+", mas só tem "+fmt(readyToAssign(m))+" por atribuir.\n\n"+
            "O «Pronto a atribuir» ficaria negativo em "+fmt(-rtaDepois)+".\n\n"+
            "Financiar mesmo assim?")) return;
      pushUndo("Alvo financiado.");
      var key=id+"|"+m;
      state.ui.lastFunding={month:m, entries:[{key:key, prev: state.assignments.hasOwnProperty(key)?state.assignments[key]:null}]};
      state.assignments[key]=round2((state.assignments[key]||0)+ti.need);
      logMove("🎯 Financiou «"+c.name+"»", ti.need);
      save(); render();
      toast(rtaDepois < -0.005
        ? ("Alvo financiado — o «Pronto a atribuir» ficou negativo em "+fmt(-rtaDepois)+".")
        : "Alvo financiado — pode anular no topo.");
    },

    "do-move": function(){

      var from=el("mvFrom").value, to=el("mvTo").value, amt=num("mvAmt");
      if(from===to){ toast("Escolha uma origem e um destino diferentes."); return; }
      if(amt<=0){ toast("Indique um valor a mover."); return; }
      pushUndo("Dinheiro movido.");
      var snap=[];
      function adj(catId, delta){ var key=catId+"|"+m; snap.push({key:key, prev: state.assignments.hasOwnProperty(key)?state.assignments[key]:null}); var nv=round2((state.assignments[key]||0)+delta); if(Math.abs(nv)<0.005) delete state.assignments[key]; else state.assignments[key]=nv; }
      if(from!==RTA_ID) adj(from, -amt);
      if(to!==RTA_ID) adj(to, amt);
      state.ui.lastFunding={month:m, entries:snap};
      var nmFrom = from===RTA_ID ? "Pronto a atribuir" : (categoryById(from)||{name:"?"}).name;
      var nmTo   = to===RTA_ID   ? "Pronto a atribuir" : (categoryById(to)||{name:"?"}).name;

    "rec-tipo": function(id){ readRec(); _rec.tipo = (id==="transf"?"transf":"normal"); recurringModal(); },
    "save-recurring": function(id){
      readRec();
      var d = _rec;
      if(!d.accountId){ toast("Selecione uma conta."); return; }
      var dados;
      if (d.tipo==="transf") {
        if(!d.toAccountId){ toast("Selecione a conta de destino."); return; }
        if(d.toAccountId===d.accountId){ toast("Escolha contas diferentes."); return; }
        var valor = round2((d.outflow||0) || (d.inflow||0));
        if(valor<=0){ toast("Indique um valor."); return; }
        var fa=accountById(d.accountId), ta=accountById(d.toAccountId);
        var cruza = !!(fa && ta && crossesBudget(fa,ta));
        if(cruza && !d.categoryId){ toast("Escolha a categoria — este movimento entra ou sai do orçamento."); return; }
        dados = { nextDate:d.nextDate||todayISO(), freq:d.freq, accountId:d.accountId, toAccountId:d.toAccountId,
                  payee:"", categoryId: cruza ? d.categoryId : null, memo:d.memo||"",
                  outflow:valor, inflow:0, active:!!d.active };
      } else {
        if((d.outflow||0)===0 && (d.inflow||0)===0){ toast("Indique um valor de saída ou entrada."); return; }
        if((d.outflow||0)>0 && (d.inflow||0)>0){ toast("Preencha só a Saída OU a Entrada, não as duas."); return; }
        var accR=accountById(d.accountId);
        // Mesma regra da transação avulsa (precisaCategoria): senão a regra passaria a lançar
        // TODOS os meses movimentos que o orçamento não acompanha — o pior sítio para os deixar.
        if(!d.categoryId && precisaCategoria(accR)){
          toast(accR.type==="credit" ? "Escolha a categoria — no cartão de crédito é obrigatória."
                                     : "Escolha a categoria — sem ela o movimento fica de fora do orçamento.");
          return;
        }
        dados = { nextDate:d.nextDate||todayISO(), freq:d.freq, accountId:d.accountId, toAccountId:null,
                  payee:d.payee||"", categoryId:(accR && accR.type==="tracking") ? null : (d.categoryId||null), memo:d.memo||"",
                  outflow:d.outflow||0, inflow:d.inflow||0, active:!!d.active };
      }
      // Dia pretendido da regra: fixa-se aqui, a partir da data escolhida. É o que permite a uma
      // regra do dia 31 voltar ao 31 depois de passar por fevereiro (ver advanceDate).
      dados.dia = +String(dados.nextDate).slice(8,10) || null;
      pushUndo(d._id ? "Recorrente alterada." : "Recorrente criada.");
      if(d._id){ var r=recById(d._id); for(var k in dados) r[k]=dados[k]; }
      else { dados.id=uid(); state.recurring.push(dados); }
      _rec=null; closeModal(); save();
      var posted=processRecurring(); render();
      toast(posted>0?("Regra guardada — lançadas "+posted+" já em atraso."):"Regra recorrente guardada.");
    },

  function txById(id){ for(var i=0;i<state.transactions.length;i++) if(state.transactions[i].id===id) return state.transactions[i]; return null; }

  // ---------- Importar / Exportar ----------
  // ---------- Estado da cópia de segurança em ficheiro ----------
  // Assinatura do CONTEÚDO — hash FNV-1a de 32 bits sobre os dados que interessam.
  //
  // A versão anterior era barata (contagens + somas) mas cega a tudo o que não mexesse
  // num total: recategorizar uma transação, mover dinheiro de uma categoria para outra,
  // mudar uma data, confirmar no banco ou corrigir um beneficiário passavam despercebidos.
  // Como só se envia à nuvem quando a assinatura muda, essas edições nunca subiam — e se
  // outro aparelho publicasse entretanto, eram apagadas em silêncio ao receber. Mover
  // dinheiro entre categorias é a operação mais frequente do método, por isso a cegueira
  // acertava justamente onde mais dói.
  //
  // 'ui', 'collapsed' e 'backup' ficam de fora DE PROPÓSITO: mudar de mês ou de separador
  // também chama save(), e isso não é dado novo para levar à rede.
  function hash32(s){
    var h = 0x811c9dc5;                                   // FNV-1a, base
    for (var i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = (h + ((h<<1) + (h<<4) + (h<<7) + (h<<8) + (h<<24))) >>> 0;   // × 16777619
    }
    return h.toString(36);
  }
  function sigOf(st){
    try {
      var s = JSON.stringify([st.settings, st.accounts, st.groups, st.categories,
                              st.assignments, st.snooze||{}, st.transactions, st.recurring||[]]);
      return hash32(s) + "/" + s.length;                  // o comprimento afasta colisões
    } catch(e){
      return "x/" + ((st && st.transactions) ? st.transactions.length : 0);
    }
  }
  // A assinatura só muda quando os dados mudam, e isso só acontece num save() com conteúdo
  // novo — que é onde a cache é deitada abaixo. Antes era recalculada a cada desenho da barra
  // lateral, o que obrigava a percorrer o estado inteiro, caractere a caractere, por toque.
  function backupSig(){ if(_sigCache===null) _sigCache = sigOf(state); return _sigCache; }
  // Assinatura de TODOS os orçamentos, para a sincronização perceber que algum mudou.
  function allSig(){
    var partes = [_bindex.active];
    for (var i=0;i<_bindex.list.length;i++){
      var b=_bindex.list[i], st = (b.id===_bindex.active) ? state : loadBudgetRaw(b.id);
      partes.push(b.id, b.name, sigOf(st));
    }
    return partes.join("|");
  }
  // O pacote que vai para o gist: os orçamentos todos, o ativo do primeiro-a-ser-visto no fim.
  function syncContainer(){
    return { v:2, active:_bindex.active, budgets: _bindex.list.map(function(b){
      return { id:b.id, name:b.name, data: (b.id===_bindex.active) ? state : loadBudgetRaw(b.id) };
    }) };
  }
  function backupPending(){
    if(!state.transactions.length && !state.categories.length) return false;
    var b=state.backup||{};
    return !b.at || b.sig!==backupSig();
  }
  // A cópia em ficheiro guarda TODOS os orçamentos, por isso a pergunta "os meus dados estão
  // salvos?" é global — mas o backupPending() acima só sabe do orçamento ABERTO. Sem isto, estando
  // no orçamento A (guardado) o ecrã dizia "✅ atualizada" enquanto o B tinha alterações por
  // guardar, sem forma de dar por isso. Varre os outros orçamentos e diz quais estão em falta.
  // O resultado fica em cache porque isto lê e assina cada orçamento (caro para fazer a cada
  // desenho): os outros orçamentos só mudam ao trocar/criar/eliminar (saveIndex) ou ao marcar a
  // cópia como feita (markBackupDone) — é aí que a cache se limpa.
  var _outrosPend = null;
  function esquecerOutrosPend(){ _outrosPend = null; }
  function outrosPorGuardar(){
    if (_outrosPend) return _outrosPend;
    var lista = [];
    for (var i=0;i<_bindex.list.length;i++){
      var b = _bindex.list[i];
      if (b.id === _bindex.active) continue;
      var st = loadBudgetRaw(b.id);
      if (!st.transactions.length && !st.categories.length) continue;   // vazio: nada a guardar
      var bk = st.backup||{};
      if (!bk.at || bk.sig !== sigOf(st)) lista.push({ id:b.id, name:b.name, pend:(bk.pend||0) });
    }
    _outrosPend = { lista:lista };
    return _outrosPend;
  }
  // Frase única do estado da cópia, usada no ecrã «Dados e cópias».
  function textoEstadoCopia(){
    var outros = outrosPorGuardar().lista, meu = backupPending();
    var n = (state.backup && state.backup.pend) || 0;
    var nTxt = n>0 ? (' — <b>'+n+'</b> '+(n===1?'alteração':'alterações')) : '';
    // «2 em «Ricardo»» lê-se; ««Ricardo» (2)» obriga a adivinhar o que é o número entre
    // parênteses. Com vários orçamentos a lista junta-se com vírgulas e um «e» no fim, para
    // continuar a ser uma frase e não um despejo de dados.
    var nomes = outros.map(function(o){
      return (o.pend>0 ? (o.pend+' em ') : '')+'<b>«'+esc(o.name)+'»</b>';
    });
    var quais = nomes.length<=1 ? (nomes[0]||'')
              : nomes.slice(0,-1).join(', ')+' e '+nomes[nomes.length-1];
    if (meu && outros.length) return '⚠️ Há alterações por guardar'+nTxt+' neste orçamento. Também '+quais+'.';
    if (meu)                  return '⚠️ Há alterações por guardar'+nTxt+' desde a última cópia.';
    // Aqui a frase é «falta guardar X»: «falta guardar 2 em «Ricardo»» daria a entender que se
    // guardam alterações soltas. O que se guarda é o orçamento — por isso ficam só os nomes.
    if (outros.length) {
      var sNomes = outros.map(function(o){ return '<b>«'+esc(o.name)+'»</b>'; });
      var sQuais = sNomes.length<=1 ? sNomes[0] : sNomes.slice(0,-1).join(', ')+' e '+sNomes[sNomes.length-1];
      return '⚠️ Este orçamento está guardado, mas falta guardar '+sQuais+' — a cópia inclui <b>todos</b> os orçamentos.';
    }
    return '✅ A última cópia está atualizada'+(_bindex.list.length>1?' (todos os orçamentos)':'')+'.';
  }
  function daysSinceBackup(){
    var b=state.backup||{};
    if(!b.at) return null;
    var diff=(new Date().getTime()-new Date(b.at).getTime())/86400000;
    return Math.floor(diff);
  }
  function markBackupDone(){
    // A cópia .json inclui TODOS os orçamentos (syncContainer), por isso marcamos TODOS como
    // guardados — não só o ativo. Senão, ao trocar de orçamento, os outros mostravam «por guardar»
    // (com o (x) de alterações) apesar de já terem sido gravados no mesmo ficheiro.
    var agora = new Date().toISOString();
    esquecerOutrosPend();          // vamos mexer nos outros orçamentos: a cache deixa de valer
    for (var i=0;i<_bindex.list.length;i++){
      var id=_bindex.list[i].id;
      if (id===_bindex.active){
        state.backup = state.backup || {};
        state.backup.at = agora; state.backup.sig = sigOf(state); state.backup.pend = 0;
        state.backup.dev = _deviceId; state.backup.devNome = nomeDesteAparelho();
      } else {
        var st = loadBudgetRaw(id);
        st.backup = st.backup || {};
        st.backup.at = agora; st.backup.sig = sigOf(st); st.backup.pend = 0;
        st.backup.dev = _deviceId; st.backup.devNome = nomeDesteAparelho();
        try { localStorage.setItem(budKey(id), JSON.stringify(st)); } catch(e){}
      }
    }
  }
  var _backupBarDismissed=false;
  function maybeShowBackupReminder(){
    if(_backupBarDismissed) return;
    var b=el("backupBar"); if(!b) return;
    if(!backupPending() && !outrosPorGuardar().lista.length){ b.classList.remove("show"); return; }
    var d=daysSinceBackup();
    if(d!==null && d<3) { b.classList.remove("show"); return; }   // só avisa a partir de 3 dias
    el("backupText").textContent = (d===null)
      ? "Ainda não guardou nenhuma cópia de segurança em ficheiro."
      : ("A última cópia de segurança tem "+d+" dia"+(d===1?"":"s")+" e há alterações por guardar.");
    b.classList.add("show");
  }
  function hideBackupBar(){ var b=el("backupBar"); if(b) b.classList.remove("show"); }

  // ---------- Instantâneos diários (dentro da aplicação, últimos 5 dias) ----------
  // Guardados numa chave separada do localStorage — não sincronizam nem incham o gist.
  // Servem de "máquina do tempo" para reverter enganos. Funciona igual no iPhone e no PC,
  // porque NÃO transfere ficheiros (evita o download que o iOS bloqueia em silêncio).
  // ==========================================================================
  //  ARMAZÉM GRANDE (IndexedDB) — só para as CÓPIAS do histórico
  //
  //  O armazenamento simples do navegador tem ~5 MB. Cada ponto de histórico é uma cópia
  //  inteira do orçamento: com 3.400 transações são ~1 MB cada, e oito pontos vezes três
  //  orçamentos passam dos 12 MB — não cabe, e o histórico degradava-se sozinho até sobrar
  //  um ponto, precisamente em quem tem mais dados a proteger.
  //
  //  Este armazém guarda só as cópias, e tem espaço a mais (o Safari dá até 60% do disco).
  //  A LISTA do histórico — dia, hora, motivo — continua no sítio simples: é minúscula e,
  //  por ser lida sem esperas, todo o código à volta continua igual. Só ler o conteúdo de um
  //  ponto (repor, descarregar) é que passa a ter de esperar, e são ações raras e deliberadas.
  // ==========================================================================
  var IDB_NOME = "meu-orcamento", IDB_LOJA = "copias", _idb = null, _idbFalhou = false;
  function idbAberta(cb){
    if (_idb) { cb(_idb); return; }
    if (_idbFalhou || typeof indexedDB === "undefined") { cb(null); return; }
    try {
      var req = indexedDB.open(IDB_NOME, 1);
      req.onupgradeneeded = function(){ try { req.result.createObjectStore(IDB_LOJA); } catch(e){} };
      req.onsuccess = function(){ _idb = req.result; cb(_idb); };
      req.onerror = function(){ _idbFalhou = true; cb(null); };   // navegação privada, por exemplo
    } catch(e){ _idbFalhou = true; cb(null); }
  }
  function idbGuardar(ref, texto, cb){
    idbAberta(function(db){
      if(!db){ if(cb) cb(false); return; }
      try {
        var tx = db.transaction(IDB_LOJA, "readwrite");
        tx.objectStore(IDB_LOJA).put(texto, ref);
        tx.oncomplete = function(){ if(cb) cb(true); };
        tx.onerror = tx.onabort = function(){ if(cb) cb(false); };
      } catch(e){ if(cb) cb(false); }
    });
  }
  function idbLer(ref, cb){
    idbAberta(function(db){
      if(!db){ cb(null); return; }
      try {
        var r = db.transaction(IDB_LOJA, "readonly").objectStore(IDB_LOJA).get(ref);
        r.onsuccess = function(){ cb(typeof r.result === "string" ? r.result : null); };
        r.onerror = function(){ cb(null); };
      } catch(e){ cb(null); }
    });
  }
  function idbApagar(refs){
    if(!refs || !refs.length) return;
    idbAberta(function(db){
      if(!db) return;
      try {
        var lj = db.transaction(IDB_LOJA, "readwrite").objectStore(IDB_LOJA);
        for (var i=0;i<refs.length;i++) lj.delete(refs[i]);
      } catch(e){}
    });
  }
  // Pedir ao navegador para NÃO apagar estes dados. O Safari limpa sozinho o armazenamento de
  // sites que não são usados durante uns dias — e isso já se aplicava ao orçamento, sem nada
  // que o impedisse. O pedido é concedido com base em critérios que incluem a aplicação estar
  // instalada no ecrã principal, que é o caso de quem a usa a sério.
  (function pedirPersistencia(){
    try {
      if (navigator.storage && navigator.storage.persisted && navigator.storage.persist) {
        navigator.storage.persisted().then(function(ja){
          if (!ja) { try { navigator.storage.persist(); } catch(e){} }
        })["catch"](function(){});
      }
    } catch(e){}
  })();

  var SNAP_KEY = "meu-orcamento-snaps-v1";
  var SNAP_MAX = 5;
  var SEG_MAX = 3;   // pontos de segurança guardados além dos diários
  function snapKey(){ return SNAP_KEY + "::" + _bindex.active; }
  function loadSnaps(){ try { return JSON.parse(localStorage.getItem(snapKey())) || []; } catch(e){ return []; } }
  // Guarda a LISTA (leve) no sítio simples e manda cada CÓPIA nova para o armazém grande.
  // Uma entrada pode trazer `data` (acabada de criar) ou já só `ref` (a morada da cópia).
  function saveSnaps(arr){
    var refsVivas = {};
    for (var i=0;i<arr.length;i++){
      var s = arr[i];
      if (s.data != null && !s.ref){
        s.ref = "s-" + _bindex.active + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
        // A escrita no armazém grande é assíncrona. Se falhar (navegação privada, sem espaço),
        // a lista ficaria a apontar para um conteúdo que nunca foi escrito — um ponto de
        // restauro que parece existir e não abre. Nesse caso apaga-se a entrada da lista e
        // avisa-se: é preferível saber que não há rede do que julgar que há.
        (function(entrada){
          idbGuardar(entrada.ref, entrada.data, function(ok){
            if (ok) return;
            var lista = loadSnaps().filter(function(x){ return x.ref !== entrada.ref; });
            try { localStorage.setItem(snapKey(), JSON.stringify(lista)); } catch(e){}
            toast("Não foi possível guardar o ponto de restauro neste navegador.");
          });
        })(s);
        // A cópia sai da lista: é ela que pesa. Fica em memória durante esta sessão para o
        // caso de se repor logo a seguir, mas não é gravada no sítio simples.
        try { Object.defineProperty(s, "data", { value:s.data, enumerable:false, writable:true, configurable:true }); } catch(e){}
      }
      if (s.ref) refsVivas[s.ref] = true;
    }
    // As cópias das entradas que saíram da lista deixam de fazer falta.
    var antes = [];
    try { antes = JSON.parse(localStorage.getItem(snapKey())) || []; } catch(e){}
    var orfas = [];
    for (var j=0;j<antes.length;j++) if (antes[j].ref && !refsVivas[antes[j].ref]) orfas.push(antes[j].ref);
    if (orfas.length) idbApagar(orfas);
    try { localStorage.setItem(snapKey(), JSON.stringify(arr)); return true; }
    catch(e){ // a lista é minúscula; se nem ela couber, o armazenamento está mesmo cheio
      while(arr.length>1){ arr.shift(); try{ localStorage.setItem(snapKey(), JSON.stringify(arr)); return true; }catch(_e){} }
      return false; }
  }
  // Vai buscar a cópia de um ponto, esteja ela onde estiver: em memória (acabada de criar),
  // ainda dentro da lista (versões anteriores da aplicação) ou no armazém grande.
  function lerCopia(s, cb){
    if (!s) { cb(null); return; }
    if (s.data != null) { cb(s.data); return; }
    if (s.ref) { idbLer(s.ref, cb); return; }
    cb(null);
  }
  // Passagem única das cópias antigas — que viviam dentro da lista — para o armazém grande.
  // Corre uma vez por orçamento, em silêncio, na primeira abertura desta versão.
  function migrarHistorico(){
    try {
      var chaves = [];
      for (var k in localStorage) if (localStorage.hasOwnProperty(k) && k.indexOf(SNAP_KEY)===0) chaves.push(k);
      for (var i=0;i<chaves.length;i++){
        var lista; try { lista = JSON.parse(localStorage.getItem(chaves[i])) || []; } catch(e){ continue; }
        var mexeu = false;
        for (var j=0;j<lista.length;j++){
          var s = lista[j];
          if (s && s.data != null && !s.ref){
            s.ref = "s-mig-" + Date.now() + "-" + i + "-" + j;
            idbGuardar(s.ref, s.data);
            delete s.data; mexeu = true;
          }
        }
        if (mexeu) { try { localStorage.setItem(chaves[i], JSON.stringify(lista)); } catch(e){} }
      }
    } catch(e){}
  }
  function takeDailySnapshot(){
    if(!state.transactions.length && !state.categories.length) return;   // nada de útil para guardar
    var day = todayISO(), sig = backupSig(), snaps = loadSnaps();
    // Procura-se o ponto DIÁRIO de hoje esteja ele onde estiver na lista — olhar só para a
    // última entrada não chega: um ponto de segurança guardado entretanto fica por cima dele,
    // e o dia de hoje acabava duplicado a cada gravação.
    var iDia = -1;
    for(var i=snaps.length-1;i>=0;i--){ if(snaps[i].day===day && !snaps[i].motivo){ iDia=i; break; } }
    if(iDia>=0 && snaps[iDia].sig===sig) return;                         // hoje já está guardado tal e qual
    var entry = { day:day, at:new Date().toISOString(), sig:sig, data: JSON.stringify(state) };
    // Um ponto de segurança (guardado mesmo antes de uma ação destrutiva) nunca é substituído
    // — é precisamente a versão anterior à ação que interessa manter.
    if(iDia>=0) snaps[iDia] = entry;
    else snaps.push(entry);
    podarSnaps(snaps);
    saveSnaps(snaps);
  }
  // Mantém os últimos SNAP_MAX pontos DIÁRIOS e, além desses, os últimos SEG_MAX pontos de
  // segurança. Assim uma tarde de experiências não empurra os dias todos para fora da lista,
  // nem o passar dos dias apaga o ponto guardado antes de uma ação destrutiva.
  function podarSnaps(snaps){
    var seg=0, dia=0;
    for(var i=snaps.length-1;i>=0;i--){
      if(snaps[i].motivo){ if(++seg > SEG_MAX) snaps.splice(i,1); }
      else { if(++dia > SNAP_MAX) snaps.splice(i,1); }
    }
    return snaps;
  }
  // Ponto de segurança: fotografia tirada IMEDIATAMENTE ANTES de uma ação que não se pode
  // anular (adotar a nuvem, repor um dia antigo, carregar exemplos, apagar tudo, eliminar um
  // orçamento). Sem isto, a rede de segurança desaparecia justamente nas ações que mais
  // precisam dela: o ponto diário de hoje era reescrito com o estado JÁ destruído assim que
  // se saísse da aplicação — no telemóvel, segundos depois.
  function pontoDeSeguranca(motivo, estado){
    try {
      var st = estado || state;
      if(!st || (!st.transactions || !st.transactions.length) && (!st.categories || !st.categories.length)) return;
      var snaps = loadSnaps();
      snaps.push({ day: todayISO(), at: new Date().toISOString(), sig: null,
                   motivo: motivo, data: JSON.stringify(st) });
      podarSnaps(snaps);
      saveSnaps(snaps);
    } catch(e){}
  }
  function restoreSnapshot(idx){
    var snaps = loadSnaps(), s = snaps[idx]; if(!s) return;
    var comoEstava = s.motivo ? ("como estava "+s.motivo+" ("+fmtDate(s.day)+")") : ("tal como estava em "+fmtDate(s.day));
    if(!confirm("Voltar ao orçamento "+comoEstava+"?\nOs dados atuais deste aparelho são substituídos por essa versão.")) return;
    // O ponto de segurança acrescenta uma entrada à lista, o que pode deslocar os índices.
    // Por isso o «s» já foi lido ACIMA e é esse objeto que se usa daqui para a frente —
    // reler pelo índice depois de guardar traria a entrada errada.
    pontoDeSeguranca("antes de voltar atrás no histórico");
    // A cópia vem do armazém grande, por isso há uma espera curta. Só aqui e no descarregar.
    lerCopia(s, function(texto){
      if (texto == null) { toast("Não foi possível ler esse ponto do histórico."); return; }
      try {
        var obj = JSON.parse(texto);
        if(!obj.accounts || !obj.transactions) throw new Error("formato");
        obj.settings = obj.settings || {locale:"pt-PT",currency:"EUR"};
        obj.collapsed = obj.collapsed || {}; obj.assignments = obj.assignments || {};
        // Mesma normalização do loadBudgetRaw: um snapshot de uma versão antiga pode não ter estes
        // campos, e depois state.recurring.push()/state.backup.at rebentavam ao usá-los.
        obj.recurring = obj.recurring || []; obj.backup = obj.backup || { at:null, sig:null, autoDay:null };
        obj.groups = obj.groups || []; obj.categories = obj.categories || [];
        obj.ui = { view:"budget", month: nowMonthKey() };
        state = obj; limparHistorico(); hideUndo(); _idx=null; save(); closeModal(); render();
        toast("Voltou ao orçamento "+comoEstava+". Se sincroniza, envie para atualizar os outros aparelhos.");
      } catch(e){ toast("Esse ponto do histórico está inválido."); }
    });
  }
  // Nomes de ficheiro seguros em qualquer sistema: sem acentos, espaços nem sinais proibidos.
  function limpaNome(t){
    return String(t||"").normalize ? String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase().slice(0,30) || "orcamento"
                                   : String(t).replace(/[^A-Za-z0-9]+/g,"-").toLowerCase().slice(0,30) || "orcamento";
  }
  function downloadSnapshot(idx){
    var snaps = loadSnaps(), s = snaps[idx]; if(!s) return;
    lerCopia(s, function(texto){
      if (texto == null) { toast("Não foi possível ler esse ponto do histórico."); return; }
      // Dentro da aplicação a cópia é guardada compacta (ocupa menos); num ficheiro que a pessoa
      // pode querer abrir e ler, sai formatada — como a cópia de segurança, para não parecerem
      // coisas de natureza diferente.
      var bonito = texto;
      try { bonito = JSON.stringify(JSON.parse(texto), null, 2); } catch(e){}
      // O nome diz o que é. Chamar-lhe «orcamento-<data>» deixava-o a uma letra de distância do
      // «orcamentos-<data>» da cópia de segurança — e são coisas bem diferentes: este traz UM
      // orçamento num dia, aquele traz TODOS no estado atual.
      var nome = "historico-" + limpaNome(budgetName(_bindex.active) || "orcamento") + "-" + s.day + ".json";
      guardarFicheiro(nome, bonito, "application/json", function(){ toast("Histórico de "+fmtDate(s.day)+" guardado em ficheiro."); });
    });
  }
