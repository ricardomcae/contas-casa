  // na sincronização — é no telemóvel que dá mais jeito ver o que se fez ao computador.
  // É só leitura: quem anda para trás é o ↩ Anular. Aqui o «Anulou» fica registado como mais
  // uma linha — um diário não apaga o passado, acrescenta-lhe.
  var MOVES_MAX = 30;
  function logMove(desc, delta){
    if (!state.moves) state.moves = [];
    state.moves.unshift({ desc:desc, delta:(delta==null?null:round2(delta)), t:Date.now(), m:state.ui.month });
    if (state.moves.length > MOVES_MAX) state.moves.length = MOVES_MAX;
  }
  var _csv = null;   // pré-visualização da importação de CSV
  var _drag = null;  // arrastar para reordenar
  var _searchTimer = null;  // atraso da caixa de procura (não é guardado)
  var _tmpAccType = null;   // tipo escolhido no modal de conta (não é guardado)
  function buildIndex(m){
    var cm={}, cc={}, km={}, kc={};
    var bal={}, balCl={}, balUp={};   // saldo por conta: total, só confirmado, e até ao mês m
    var npend={};                     // quantas transações por confirmar tem cada conta
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i], mm=monthOf(t.date), net=(t.inflow||0)-(t.outflow||0);
      var inM=(mm===m), up=(mm<=m);
      bal[t.accountId]=(bal[t.accountId]||0)+net;
      if(t.cleared) balCl[t.accountId]=(balCl[t.accountId]||0)+net;
      else npend[t.accountId]=(npend[t.accountId]||0)+1;
      if(up) balUp[t.accountId]=(balUp[t.accountId]||0)+net;
      if(t.categoryId){
        if(inM) cm[t.categoryId]=(cm[t.categoryId]||0)+net;
        if(up) cc[t.categoryId]=(cc[t.categoryId]||0)+net;
      }
      var pd=0;
      if(t.transfer) pd=-net;
      else if(t.categoryId && t.categoryId!==INCOME) pd=(t.outflow||0)-(t.inflow||0);
      if(pd){
        if(inM) km[t.accountId]=(km[t.accountId]||0)+pd;
        if(up) kc[t.accountId]=(kc[t.accountId]||0)+pd;
      }
    }
    // Índice das atribuições — uma passagem, em vez de percorrer o mapa inteiro por cada categoria.
    var ac={}, aTot=0;
    for(var k in state.assignments){
      if(!state.assignments.hasOwnProperty(k)) continue;
      var bar=k.indexOf("|"); if(bar<0) continue;
      if(k.slice(bar+1) > m) continue;                      // só conta até ao mês em vista
      var cid=k.slice(0,bar), v=state.assignments[k];
      ac[cid]=(ac[cid]||0)+v; aTot+=v;
    }
    _idx={month:m, cm:cm, cc:cc, km:km, kc:kc,
          bal:bal, balCl:balCl, balUp:balUp, npend:npend, ac:ac, aTot:round2(aTot)};
    buildLookup();
  }
  // Tabelas de consulta directa — evitam percorrer listas para cada linha apresentada.
  var _lookup = null;
  function buildLookup(){
    var a={}, c={};
    for(var i=0;i<state.accounts.length;i++) a[state.accounts[i].id]=state.accounts[i];
    for(var j=0;j<state.categories.length;j++) c[state.categories[j].id]=state.categories[j];
    _lookup={acc:a, cat:c};
  }
  function lkAcc(id){ return _lookup ? (_lookup.acc[id]||null) : accountById(id); }
  function lkCat(id){ return _lookup ? (_lookup.cat[id]||null) : categoryById(id); }

  // ---------- Beneficiários já usados ----------
  // Construído a pedido (quando se abre um formulário), não a cada render.
  var _payees = null;
  function payeeKey(s){
    return String(s==null?"":s).toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  }
  function buildPayees(){
    var m={};
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(t.transfer) continue;                       // "↔ Conta" é gerado pela app, não interessa sugerir
      if(isOpening(t)) continue;                      // "Saldo inicial" também é automático, não é beneficiário
      var p=(t.payee||"").trim(); if(!p) continue;
      var k=payeeKey(p); if(!k) continue;
      var e=m[k] || (m[k]={ name:p, count:0, lastDate:"", cat:null, grafias:{} });
      e.count++;
      e.grafias[p]=(e.grafias[p]||0)+1;
      if(t.date>=e.lastDate){ e.lastDate=t.date; e.cat=t.categoryId||null; }
    }
    // Entre «Continente», «continente» e «CONTINENTE», sugere a forma que mais escreveu
    // (e não a última) — senão bastava uma vez em maiúsculas para ficar assim para sempre.
    for(var k2 in m){ if(!m.hasOwnProperty(k2)) continue;
      var ee=m[k2], melhor=null, n=-1;
      for(var g in ee.grafias){ if(ee.grafias.hasOwnProperty(g) && ee.grafias[g]>n){ n=ee.grafias[g]; melhor=g; } }
      if(melhor) ee.name=melhor;
    }
    _payees=m;
  }
  function payeeIndex(){ if(!_payees) buildPayees(); return _payees; }
  // Lista para o <datalist>, dos mais usados para os menos usados.
  // Categoria que usou da última vez neste beneficiário — só se ainda existir.
  function payeeCategoria(nome){
    var e=payeeIndex()[payeeKey(nome)];
    if(!e || !e.cat) return null;
    if(e.cat===INCOME || lkCat(e.cat)) return e.cat;
    return null;
  }

  function activityFor(catId, m) {
    var cat = lkCat(catId);
    if (_idx && _idx.month === m) {
      if (cat && cat.cardId) return round2(_idx.km[cat.cardId] || 0);
      return round2(_idx.cm[catId] || 0);
    }
    if (cat && cat.cardId) return cardPaymentActivity(cat.cardId, m, false);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.categoryId === catId && monthOf(t.date) === m) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }

  function availableFor(catId, m) {
    var cat = lkCat(catId);
    if (_idx && _idx.month === m) {
      var a = _idx.ac[catId] || 0;
      if (cat && cat.cardId) return round2(a + (_idx.kc[cat.cardId] || 0));
      return round2(a + (_idx.cc[catId] || 0));
    }
    var assigned = 0;
    for (var k in state.assignments) {
      if (!state.assignments.hasOwnProperty(k)) continue;
      var parts = k.split("|");
      if (parts[0] === catId && parts[1] <= m) assigned += state.assignments[k];
    }
    if (cat && cat.cardId) return round2(assigned + cardPaymentActivity(cat.cardId, m, true));
    var activity = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.categoryId === catId && monthOf(t.date) <= m) activity += (t.inflow||0) - (t.outflow||0);
    }
    return round2(assigned + activity);
  }

  function totalIncomeUpto(m) {
    if (_idx && _idx.month === m) return round2(_idx.cc[INCOME] || 0);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.categoryId === INCOME && monthOf(t.date) <= m) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }
  function totalAssignedUpto(m) {
    if (_idx && _idx.month === m) return _idx.aTot;
    var s = 0;
    for (var k in state.assignments) { if (state.assignments.hasOwnProperty(k) && k.split("|")[1] <= m) s += state.assignments[k]; }
    return round2(s);
  }
  function readyToAssign(m) { return round2(totalIncomeUpto(m) - totalAssignedUpto(m)); }

  // Saldos vêm do índice (não dependem do mês em vista); só percorrem as transações se ainda não houver índice.
  function accountBalance(accId, clearedOnly) {
    if (_idx) return round2((clearedOnly ? _idx.balCl : _idx.bal)[accId] || 0);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.accountId === accId && (!clearedOnly || t.cleared)) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }
  // Saldo de uma conta contando só o que acontece até ao fim do mês m (usado na verificação do orçamento).
  function accountBalanceUpto(accId, m) {
    if (_idx && _idx.month === m) return round2(_idx.balUp[accId] || 0);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.accountId === accId && monthOf(t.date) <= m) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }
  // Diferença entre o que registou e o que o banco já processou. É o número que diz
  // se a app bate certo com o extrato: zero significa que está tudo reconciliado.
  function porConfirmar(accId){
    if (accId) return round2(accountBalance(accId) - accountBalance(accId, true));
    var s=0;
    for (var i=0;i<state.accounts.length;i++) s += accountBalance(state.accounts[i].id) - accountBalance(state.accounts[i].id, true);
    return round2(s);
  }
  // Pontinho de estado de uma conta. VERDE = nada por confirmar, a conta está a par do banco.
  // ÂMBAR = há coisas lançadas que o banco ainda não processou — é informação, não um aviso:
  // é o estado normal de quem lança as despesas no dia em que as faz. Por isso o sinal que
  // importa é o verde (aparece pouco) e não o âmbar (apareceria quase sempre).
  function pontoConta(accId){
    var pend = porConfirmar(accId), ok = Math.abs(pend) <= 0.005, n = 0;
    // Quantas faltam confirmar: vem da única passagem do índice. Contar aqui obrigava a
    // percorrer TODAS as transações por cada conta, a cada desenho da barra lateral.
    if (!ok) {
      if (_idx && _idx.npend) n = _idx.npend[accId] || 0;
      else for (var i=0;i<state.transactions.length;i++){
        var t = state.transactions[i];
        if (t.accountId===accId && !t.cleared) n++;
      }
    }
    var tit = ok ? "Tudo confirmado — esta conta está a par do banco"
                 : (n + (n===1?" transação":" transações") + " por confirmar · " + fmt(pend));
    return '<span class="pt-conf '+(ok?"ok":"pend")+'" title="'+esc(tit)+'" aria-label="'+esc(tit)+'"></span>';
  }
  function netWorth() { var s=0; for (var i=0;i<state.accounts.length;i++) s += accountBalance(state.accounts[i].id); return round2(s); }
  // Há algo no orçamento? Serve para esconder o «carregar dados de exemplo» assim que houver dados
  // (reaparece só se apagar tudo — dados de exemplo editados contam na mesma como dados).
  function temDados(){ return !!(state.accounts.length || state.categories.length || state.groups.length || state.transactions.length || (state.recurring && state.recurring.length)); }

  // ---------- Integridade do orçamento ----------
  // Num orçamento base-zero tem de ser sempre verdade que:
  //     Pronto a atribuir + Σ Disponível (todas as categorias) === dinheiro nas contas de orçamento
  // Se não bater, é porque entrou ou saiu dinheiro do orçamento sem passar por uma categoria.
  // Os cartões de crédito ficam de fora desta soma: o que se gasta neles já está reservado
  // na respetiva categoria de pagamento, e a dívida não é dinheiro em caixa.
  function budgetCashUpto(m){
    var s=0;
    for(var i=0;i<state.accounts.length;i++){ var a=state.accounts[i]; if(a.type==="budget") s+=accountBalanceUpto(a.id, m); }
    return round2(s);
  }
  function budgetedTotal(m){
    var s=readyToAssign(m);
    for(var i=0;i<state.categories.length;i++) s+=availableFor(state.categories[i].id, m);
    return round2(s);
  }
  // Positivo: há dinheiro nas contas que o orçamento não conhece.
  // Negativo: o orçamento conta com dinheiro que já não existe nas contas.
  function integrityDelta(m){ return round2(budgetCashUpto(m) - budgetedTotal(m)); }

  // Lista as transações responsáveis pela diferença. A soma dos "delta" dá o integrityDelta.
  // Contribuição de UMA transação para cada lado da invariante.
  // Somando isto sobre todas as transações obtém-se exatamente o integrityDelta — por
  // construção, não por enumeração de casos. É isso que garante que nenhum tipo de
  // movimento, por invulgar que seja, escapa à explicação do painel.
  function contribuicao(t){
    var acc = lkAcc(t.accountId);
    if (!acc) return null;
    var net = (t.inflow||0) - (t.outflow||0);
    var real = acc.type==="budget" ? net : 0;            // lado do dinheiro nas contas
    var esperado = 0;                                     // lado do orçamento
    if (t.categoryId === INCOME) esperado += net;         // entra no «Pronto a atribuir»
    else if (t.categoryId) {
      var c = lkCat(t.categoryId);
      if (c && !c.cardId) esperado += net;                // categoria normal
    }
    // Reserva para a fatura do cartão, quando a conta é um cartão com categoria de pagamento viva.
    if (acc.type==="credit" && acc.paymentCatId) {
      var pc = lkCat(acc.paymentCatId);
      if (pc && pc.cardId === acc.id) {
        esperado += t.transfer ? -net : ((t.categoryId && t.categoryId!==INCOME) ? -net : 0);
      }
    }
    return { acc:acc, net:net, delta: round2(real - esperado) };
  }

  // Regra única de quem PRECISA de categoria, para não haver duas versões da verdade espalhadas
  // pela aplicação. Vale para transações avulsas, duplicados e regras recorrentes.
  //   • conta de ORÇAMENTO  → obrigatória: sem ela o movimento mexe no saldo mas fica fora do
  //     orçamento, e as contas deixam de bater certo (é a "barra de integridade").
  //   • CARTÃO de crédito   → obrigatória: é ela que guarda o dinheiro para pagar a dívida (compras)
  //     ou o devolve à categoria de origem (devoluções/cashback).
  //   • ACOMPANHAMENTO      → nunca leva (está fora do orçamento).
  // Ficam de fora, por não serem movimentos a classificar: o «Saldo inicial» (gerado pela app) e as
  // transferências (que têm a sua própria regra: só levam categoria quando cruzam a fronteira do
  // orçamento — validada no do-transfer/save-transfer).
  function precisaCategoria(acc){ return !!(acc && (acc.type==="budget" || acc.type==="credit")); }
  function faltaCategoria(t){
    if(!t || t.transfer || isOpening(t) || t.categoryId) return false;
    if(!((t.outflow||0) > 0.005) && !((t.inflow||0) > 0.005)) return false;
    return precisaCategoria(lkAcc(t.accountId));
  }
  // Movimentos por classificar, criados ANTES de a categoria passar a ser obrigatória (ou vindos de
  // uma importação de ficheiro do banco, que não bloqueia por ser em lote). Os do CARTÃO precisam de
  // um aviso próprio: ao contrário dos das contas de orçamento, não desequilibram a invariante — por
  // isso a barra de integridade nunca os mostraria e passariam despercebidos para sempre.
  function comprasCartaoSemCat(m){
    var n=0;
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(monthOf(t.date) > m || !faltaCategoria(t)) continue;
      var a=lkAcc(t.accountId);
      if(a && a.type==="credit") n++;
    }
    return n;
  }
  // Lista os movimentos que desequilibram o orçamento, já com o motivo identificado.
  // A soma dos "delta" é, por construção, igual ao integrityDelta.
  function integrityIssues(m){
    var itens=[], cartaoSemCat=0;
    var pares={}, deltaPar={};
    for(var i=0;i<state.transactions.length;i++){ var tp=state.transactions[i]; if(tp.transfer){ (pares[tp.transfer]=pares[tp.transfer]||[]).push(tp); } }
    // Uma transferência tem de ser julgada pelo PAR: cada metade sozinha parece desequilibrar
    // (sai de um lado, entra no outro), mas juntas normalmente fecham.
    for(var q=0;q<state.transactions.length;q++){
      var tq=state.transactions[q];
      if(!tq.transfer || monthOf(tq.date) > m) continue;
      var cq=contribuicao(tq); if(!cq) continue;
      deltaPar[tq.transfer]=round2((deltaPar[tq.transfer]||0)+cq.delta);
    }
    var parJaVisto={};
    for(var j=0;j<state.transactions.length;j++){
      var t=state.transactions[j];
      if(monthOf(t.date) > m) continue;
      var cb = contribuicao(t);
      if(!cb) continue;
      var acc = cb.acc;
      // Compras no cartão sem categoria não desequilibram nada, mas também não reservam
      // dinheiro para a fatura — vale a pena contá-las à parte.
      // Mesma regra do aviso do ecrã do Orçamento (faltaCategoria), senão os dois números não
      // batiam certo: este contava também o «Saldo inicial» do cartão, o outro não.
      if(faltaCategoria(t) && acc.type==="credit") cartaoSemCat++;
      if(t.transfer){
        if(parJaVisto[t.transfer]) continue;
        if(Math.abs(deltaPar[t.transfer]||0) < 0.005) continue;
        // representa-se o par pela metade do lado do orçamento, que é onde se corrige
        var hs0=pares[t.transfer]||[], repr=t;
        for(var z=0;z<hs0.length;z++){ var az=lkAcc(hs0[z].accountId); if(az && az.type==="budget"){ repr=hs0[z]; break; } }
        if(repr!==t) continue;
        parJaVisto[t.transfer]=true;
        cb = { acc:lkAcc(t.accountId), net:0, delta:deltaPar[t.transfer] };
        acc = cb.acc;
      }
      else if(Math.abs(cb.delta) < 0.005) continue;

      var motivo, outra=null, oa=null;
      if(t.transfer){
        var hs=pares[t.transfer]||[];
        for(var h=0;h<hs.length;h++) if(hs[h].id!==t.id) outra=hs[h];
        oa = outra ? lkAcc(outra.accountId) : null;
        if(!oa) motivo="meia";
        else if(t.categoryId) motivo="transfCat";
        else if(acc.type==="budget" || oa.type==="budget") motivo="paraFora";
        else motivo="transfCartao";
      }
      else if(t.categoryId === INCOME) motivo="rendFora";
      else if(t.categoryId && !lkCat(t.categoryId)) motivo="orfa";
      else if(t.categoryId) motivo="categFora";
      else motivo="semCat";
      itens.push({ t:t, acc:acc, outra:oa, delta:cb.delta, motivo:motivo });
    }
    itens.sort(function(a,b){ return a.t.date<b.t.date?1:(a.t.date>b.t.date?-1:0); });
    return { itens:itens, cartaoSemCat:cartaoSemCat };
  }

  // Transferência entre contas: cria duas metades ligadas pelo mesmo id 'transfer'. Sem categoria (não afeta o orçamento).
  // Uma transferência entre uma conta de orçamento e uma de acompanhamento faz o dinheiro
  // sair (ou entrar) do orçamento — nesse caso a metade que está do lado do orçamento
  // precisa de categoria, senão as contas deixam de bater certo com o orçamento.
  function crossesBudget(from, to){
    return (from.type==="budget" && to.type==="tracking") || (from.type==="tracking" && to.type==="budget");
  }
  function createTransfer(fromId, toId, amount, date, cleared, budgetCat, memo){
    var from=accountById(fromId), to=accountById(toId);
    if(!from||!to||fromId===toId||!(amount>0)) return false;
    var cat = (budgetCat && crossesBudget(from,to)) ? budgetCat : null;
    var pair=uid();
    state.transactions.push({id:uid(), date:date, accountId:fromId, payee:"↔ "+to.name, categoryId:(cat && from.type==="budget")?cat:null, memo:memo||"", outflow:round2(amount), inflow:0, cleared:!!cleared, transfer:pair});
    state.transactions.push({id:uid(), date:date, accountId:toId, payee:"↔ "+from.name, categoryId:(cat && to.type==="budget")?cat:null, memo:memo||"", outflow:0, inflow:round2(amount), cleared:!!cleared, transfer:pair});
    return true;
  }
  // Reescreve as DUAS metades de uma transferência já existente, sempre como espelho
  // uma da outra. É por isto que editar uma transferência é seguro.
  function updateTransfer(pair, fromId, toId, amount, date, cleared, budgetCat, memo){
    var from=accountById(fromId), to=accountById(toId);
    if(!from||!to||fromId===toId||!(amount>0)) return false;
    var metades=state.transactions.filter(function(x){ return x.transfer===pair; });
    if(metades.length!==2) return false;
    var hSaida   = (metades[0].outflow||0)>0.005 ? metades[0] : metades[1];
    var hEntrada = hSaida===metades[0] ? metades[1] : metades[0];
    var cat = (budgetCat && crossesBudget(from,to)) ? budgetCat : null;
    var v = round2(amount);
    hSaida.accountId=fromId; hSaida.payee="↔ "+to.name;   hSaida.categoryId=(cat && from.type==="budget")?cat:null;
    hSaida.outflow=v; hSaida.inflow=0;  hSaida.date=date; hSaida.memo=memo||""; hSaida.cleared=!!cleared;
    hEntrada.accountId=toId; hEntrada.payee="↔ "+from.name; hEntrada.categoryId=(cat && to.type==="budget")?cat:null;
    hEntrada.outflow=0; hEntrada.inflow=v; hEntrada.date=date; hEntrada.memo=memo||""; hEntrada.cleared=!!cleared;
    return true;
  }

  function monthsBetween(fromKey, toKey) {
    var f=fromKey.split("-"), t=toKey.split("-");
    return (parseInt(t[0],10)-parseInt(f[0],10))*12 + (parseInt(t[1],10)-parseInt(f[1],10));
  }
  // Quantas vezes um dia da semana (0=Dom .. 6=Sáb) acontece num mês → 4 ou 5
  function weekdayCount(monthKey, weekday) {
    var p=monthKey.split("-"), year=parseInt(p[0],10), month=parseInt(p[1],10)-1;
    var days=new Date(year, month+1, 0).getDate(), count=0;
    for (var d=1; d<=days; d++) if (new Date(year, month, d).getDay()===weekday) count++;
    return count;
  }
  function isoOf(dt){ return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); }
  var FREQ_LABEL = { daily:"Diária", weekly:"Semanal", biweekly:"Quinzenal", monthly:"Mensal", semiannual:"Semestral", yearly:"Anual" };
  // `dia` é o dia ORIGINAL da regra (r.dia). Sem ele, uma regra do dia 31 que passasse por
  // fevereiro ficava presa no 28 para sempre (31 jan → 28 fev → 28 mar → ...), porque o mês
  // seguinte era calculado a partir da data já encurtada. Guardando o dia pretendido, o
  // encurtamento é só naquele mês: 31 jan → 28 fev → 31 mar. É como funcionam os débitos do banco.
  // (Semanal/quinzenal somam dias, por isso não usam o dia original.)
  function advanceDate(iso, freq, dia){
    var p=iso.split("-"), y=+p[0], mo=+p[1]-1, d=+p[2];
    var alvo = (dia>0 && dia<=31) ? dia : d;
    if(freq==="daily") return isoOf(new Date(y,mo,d+1));
    if(freq==="weekly") return isoOf(new Date(y,mo,d+7));
    if(freq==="biweekly") return isoOf(new Date(y,mo,d+14));
    if(freq==="yearly"){ var lastY=new Date(y+1,mo+1,0).getDate(); return (y+1)+"-"+pad(mo+1)+"-"+pad(Math.min(alvo,lastY)); }
    if(freq==="semiannual"){ var sm=mo+6, sy=y; if(sm>11){ sm-=12; sy++; } var lastS=new Date(sy,sm+1,0).getDate(); return sy+"-"+pad(sm+1)+"-"+pad(Math.min(alvo,lastS)); }
    var nm=mo+1, ny=y; if(nm>11){nm-=12;ny++;}
    var lastM=new Date(ny,nm+1,0).getDate();
    return ny+"-"+pad(nm+1)+"-"+pad(Math.min(alvo,lastM));
  }
  // O dia pretendido de uma regra. Regras antigas não têm `dia` guardado: usa-se o da próxima
  // data, o que mantém exatamente o comportamento atual até a regra ser gravada de novo.
  function diaDaRegra(r){ return (r && r.dia>0) ? r.dia : (r && r.nextDate ? +r.nextDate.slice(8,10) : 0); }
  // Uma regra com conta de destino lança uma TRANSFERÊNCIA (as duas metades de uma vez);
  // sem destino, lança uma transação normal. É o mesmo caminho em ambos os casos.
  function lancarRecorrente(r, data){
    if (r.toAccountId) {
      var v = round2((r.outflow||0) || (r.inflow||0));
      return createTransfer(r.accountId, r.toAccountId, v, data, false, r.categoryId||null, r.memo||"");
    }
    state.transactions.push({id:uid(), date:data, accountId:r.accountId, payee:r.payee||"",
      categoryId:r.categoryId||null, memo:r.memo||"", outflow:r.outflow||0, inflow:r.inflow||0, cleared:false});
    return true;
  }
  // Uma regra só é lançável se as contas envolvidas ainda existirem e forem diferentes.
  function recValida(r){
    if (!accountById(r.accountId)) return false;
    if (r.toAccountId && (!accountById(r.toAccountId) || r.toAccountId===r.accountId)) return false;
    return true;
  }
  function processRecurring(){
    var today=todayISO(), created=0, list=state.recurring||[];
    for(var i=0;i<list.length;i++){
      var r=list[i]; if(!r.active) continue;
      if(!recValida(r)) continue;
      // Trava de segurança contra ciclos infinitos. Uma regra DIÁRIA gasta um passo por dia, por
      // isso precisa de folga para recuperar longas ausências (400 ≈ mais de um ano); as outras
      // frequências nunca chegam perto do limite antigo.
      var guard=0, limite=(r.freq==="daily") ? 400 : 120;
      while(r.nextDate && r.nextDate<=today && guard<limite){
        lancarRecorrente(r, r.nextDate);
        r.nextDate=advanceDate(r.nextDate, r.freq, diaDaRegra(r));
        created++; guard++;
      }
    }
    if(created>0) save();
    return created;
  }
  function recById(id){ for(var i=0;i<(state.recurring||[]).length;i++) if(state.recurring[i].id===id) return state.recurring[i]; return null; }

  // O que as regras recorrentes ainda vão lançar dentro do mês m (de hoje em diante).
  // O processRecurring() já lançou tudo o que estava em atraso, por isso parte-se do nextDate.
  function upcomingRecurring(m){
    if (m < nowMonthKey()) return [];                       // meses passados não têm futuro
    var hoje=todayISO(), out=[], list=state.recurring||[];
    for(var i=0;i<list.length;i++){
      var r=list[i];
      if(!r.active || !accountById(r.accountId)) continue;
      var d=r.nextDate, guarda=0;
      // O guarda tem de dar para chegar a qualquer mês que se possa espreitar. Uma regra DIÁRIA
      // gasta ~30 passos por mês, por isso 600 esgotava-se a ~20 meses de distância e a regra
      // desaparecia do "Ainda este mês" sem aviso. 4000 dá para mais de 10 anos.
      while(d && d.slice(0,7)<=m && guarda++<4000){
        if(d.slice(0,7)===m && d>=hoje) out.push({r:r, date:d});
        d=advanceDate(d, r.freq, diaDaRegra(r));
      }
    }
    out.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
    return out;
  }
  function upcomingTotals(m){
    var l=upcomingRecurring(m), sai=0, entra=0, porCat={};
    for(var i=0;i<l.length;i++){
      var r=l[i].r;
      if(r.toAccountId && !r.categoryId) continue;      // transferência interna: não mexe no orçamento
      sai+=(r.outflow||0); entra+=(r.inflow||0);
      if(r.categoryId && r.categoryId!==INCOME && r.outflow) porCat[r.categoryId]=(porCat[r.categoryId]||0)+r.outflow;
    }
    return { lista:l, sai:round2(sai), entra:round2(entra), porCat:porCat };
  }
  // Fixa os grupos de sistema (pagamentos de cartão) no topo, preservando a ordem dos restantes.
  function pinSystemGroups(){ var sys=[],norm=[]; for(var i=0;i<state.groups.length;i++){ (state.groups[i].system?sys:norm).push(state.groups[i]); } state.groups=sys.concat(norm); }
  function moveGroup(id, dir){
    var idx=-1; for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===id) idx=i;
    if(idx<0 || state.groups[idx].system) return;           // grupos de sistema não se movem
    var j=idx+dir; if(j<0||j>=state.groups.length || state.groups[j].system) return; // nem passam à frente de um grupo de sistema
    var t=state.groups[idx]; state.groups[idx]=state.groups[j]; state.groups[j]=t;
  }
  // Arrastar: move a categoria de origem para a posição da categoria de destino (e para o grupo dela).
  function dropCategory(srcId, dstId){
    if(srcId===dstId) return false;
    var src=categoryById(srcId), dst=categoryById(dstId);
    if(!src||!dst||src.cardId||dst.cardId) return false;
    var si=-1, di=-1;
    for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===srcId) si=i; if(state.categories[i].id===dstId) di=i; }
    if(si<0||di<0) return false;
    state.categories.splice(si,1);          // di (posição original do destino) é o ponto de inserção correto
    src.groupId=dst.groupId;
    state.categories.splice(di,0,src);
    return true;
  }
  function dropGroup(srcId, dstId){
    if(srcId===dstId) return false;
    var src=groupById(srcId), dst=groupById(dstId);
    if(!src||!dst||src.system||dst.system) return false;
    var si=-1, di=-1;
    for(var i=0;i<state.groups.length;i++){ if(state.groups[i].id===srcId) si=i; if(state.groups[i].id===dstId) di=i; }
    if(si<0||di<0) return false;
    state.groups.splice(si,1);
    state.groups.splice(di,0,src);
    return true;
  }
  // Reordena contas dentro do MESMO tipo (orçamento com orçamento, cartões/acompanhamento
  // entre si), que é como aparecem agrupadas no ecrã Contas e fazem sentido na barra lateral.
  function accSiblings(id){ var a=accountById(id); if(!a) return []; var t=(a.type==="budget")?"b":"o";
    return state.accounts.filter(function(x){ return !x.hidden && ((x.type==="budget")?"b":"o")===t; }); }
  function moveAccount(id, dir){
    var sib=accSiblings(id), pos=-1; for(var i=0;i<sib.length;i++) if(sib[i].id===id) pos=i;
    if(pos<0) return false;                    // conta fora da lista visível (arquivada): não mexe
    var alvo=sib[pos+dir]; if(!alvo) return false;
    var gi=-1,gj=-1; for(var k=0;k<state.accounts.length;k++){ if(state.accounts[k].id===id) gi=k; if(state.accounts[k].id===alvo.id) gj=k; }
    if(gi<0||gj<0) return false;
    var t=state.accounts[gi]; state.accounts[gi]=state.accounts[gj]; state.accounts[gj]=t; return true;
  }
  function dropAccount(srcId, dstId){
    if(srcId===dstId) return false;
    var src=accountById(srcId), dst=accountById(dstId);
    if(!src||!dst) return false;
    if(((src.type==="budget")?1:0)!==((dst.type==="budget")?1:0)) return false;   // não cruza tipos
    var si=-1,di=-1; for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].id===srcId) si=i; if(state.accounts[i].id===dstId) di=i; }
    if(si<0||di<0) return false;
    state.accounts.splice(si,1); state.accounts.splice(di,0,src); return true;
  }
  function moveCategory(id, dir){
    var cat=categoryById(id); if(!cat) return;
    var sib=categoriesOfGroup(cat.groupId), pos=-1; for(var i=0;i<sib.length;i++) if(sib[i].id===id) pos=i;
    // Sem esta guarda, uma categoria fora da lista visível (arquivada) dava pos=-1 e o "descer"
    // trocava-a com a PRIMEIRA da lista, baralhando a ordem sem ninguém pedir.
    if(pos<0) return;
    var target=sib[pos+dir]; if(!target) return;
    var gi=-1,gj=-1; for(var k=0;k<state.categories.length;k++){ if(state.categories[k].id===id) gi=k; if(state.categories[k].id===target.id) gj=k; }
    if(gi<0||gj<0) return;
    var t=state.categories[gi]; state.categories[gi]=state.categories[gj]; state.categories[gj]=t;
  }
  // Mensalidade fixa do "até uma data" no modo Reservar. Congela-se no momento da edição e não
  // volta a mudar — é isto que faz o pedido ser cego ao que se gasta. O cálculo tem de saber, além
  // do saldo (availNow), quanto já foi ATRIBUÍDO este mês (assignedThis), porque disso depende se o
  // mês corrente ainda vai ser reforçado até à fatia (e por isso conta para o divisor) ou se já tem
  // o que precisa e fica de fora — senão perde-se uma mensalidade (bug das "Prendas de Natal").
  function sliceAteData(amount, availNow, assignedThis, fromMonth, date){
    var dm = monthsBetween(fromMonth, date);
    var nTotal  = dm>=0 ? dm+1 : 1;   // meses até à data, mês corrente incluído
    var nFuture = dm>=0 ? dm   : 0;   // só os meses a seguir ao corrente
    var have = availNow>0 ? availNow : 0;
    var a    = assignedThis>0 ? assignedThis : 0;
    var carry = round2(have - a); if (carry<0) carry = 0;   // saldo transitado de meses anteriores
    if (amount - have <= 0.005) return 0;                   // objetivo já atingido: nada a congelar
    // Fatia se o mês corrente também for reforçado (o que já cá está, tirando o transitado, conta).
    var limiar = round2((amount - carry) / nTotal);
    var sl;
    if (nFuture>0 && a >= limiar) {
      // Já foi atribuída, este mês, pelo menos uma fatia: o mês corrente fica como está e o que
      // falta reparte-se SÓ pelos meses seguintes — assim não se perde a mensalidade deste mês.
      sl = round2((amount - have) / nFuture);
    } else {
      // O mês corrente ainda vai ser reforçado até à fatia: reparte-se por TODOS os meses.
      sl = limiar;
    }
    if (amount - have > 0.005 && sl < 0.01) sl = 0.01;      // nunca congelar em zero havendo falta
    if (sl < 0) sl = 0;
    return round2(sl);
  }
  // Cadências de alvo: mensal | semanal | trimestral | semestral | anual | até uma data.
  // Devolve {need, met, progress, label} ou null quando a categoria não tem alvo.
  // Alvo adiado neste mês: o utilizador disse "não me chateies agora" (😴). Existe por categoria E
  // por mês, por isso expira sozinho — no mês seguinte volta a pedir sem ser preciso fazer nada.
  function isSnoozed(catId, m){ return !!(state.snooze && state.snooze[catId+"|"+m]); }

  function targetInfo(cat, m) {
    if (!cat.target || !(cat.target.amount>0)) return null;
    var tg = cat.target, type = tg.type || "monthly", amt = tg.amount;
    var avail = availableFor(cat.id, m);
    var assignedThis = assignedFor(cat.id, m);
    // Adiado: não pede nada este mês (need 0) nem conta como abaixo do alvo — estado próprio "adiado".
    if (isSnoozed(cat.id, m)) {
      return { need:0, met:true, doMes:true, snoozed:true,
        progress: Math.max(0, Math.min(1, amt>0 ? avail/amt : 0)),
        label: "😴 Adiado este mês — não pede dinheiro" };
    }
    if (type==="monthly") {
      var fund = tg.fund || "refill";
      if (fund==="setAside") {
        var needS = Math.max(0, round2(amt - assignedThis));
        return { need:needS, met: assignedThis>=amt-0.005, progress: Math.max(0,Math.min(1, amt>0?assignedThis/amt:0)),
          label: needS>0 ? ("Reservar "+fmt(needS)+" este mês — "+fmt(amt)+"/mês (sempre)") : ("✅ Reservado "+fmt(amt)+" este mês") };
      }
      // Repor estilo YNAB ("refill up to X"): o alvo conta como cumprido quando já foi FINANCIADO
      // este mês (o que transitou + o que se atribuiu este mês), e CONTINUA cumprido depois de
      // gastar — gastar não reabre o alvo. Só o mês seguinte volta a pedir para repor até X, e aí
      // aproveita o que sobrou (por isso a conta variável que fica abaixo do previsto pede menos).
      var fundedM = round2(avail - activityFor(cat.id, m));   // transitado + atribuído este mês (antes do gasto)
      var needM = Math.max(0, round2(amt - fundedM));
      // COR pelo financiamento (verde fica verde depois de gastar); LARGURA pelo que RESTA
      // disponível — assim a barra encolhe à medida que se gasta, sem mudar de cor.
      return { need:needM, met: fundedM>=amt-0.005, progress: Math.max(0,Math.min(1, amt>0?avail/amt:0)),
        label: needM>0 ? ("Faltam "+fmt(needM)+" para financiar "+fmt(amt)+" este mês") : ("🎯 Financiado "+fmt(amt)+" este mês") };
    }
    if (type==="weekly") {
      var wd = (tg.weekday==null?1:tg.weekday);
      var weeks = weekdayCount(m, wd);
      var monthTarget = round2(amt*weeks);
      // Mesmo critério "refill up to X" do mensal: cumprido quando o mês está financiado até ao
      // total semanal (semanas × valor), e mantém-se cumprido depois de gastar.
      var fundedW = round2(avail - activityFor(cat.id, m));
      var needW = Math.max(0, round2(monthTarget - fundedW));
      // COR pelo financiamento; LARGURA pelo que resta (encolhe ao gastar) — igual ao mensal.
      return { need:needW, met: fundedW>=monthTarget-0.005, progress: Math.max(0,Math.min(1, monthTarget>0?avail/monthTarget:0)),
        label: needW>0 ? ("Faltam "+fmt(needW)+" — "+fmt(amt)+"/semana × "+weeks+" semanas = "+fmt(monthTarget))
                       : ("🎯 Financiado "+fmt(amt)+"/semana × "+weeks+" = "+fmt(monthTarget)+" este mês") };
    }
    if (type==="quarterly" || type==="semiannual" || type==="yearly") {
      var per = type==="quarterly"?3:(type==="semiannual"?6:12), cad = type==="quarterly"?"trimestre":(type==="semiannual"?"semestre":"ano");
      // RESERVAR: mete um valor fixo (total ÷ período) todos os meses, aconteça o que acontecer.
      // Ao contrário do Repor, NÃO olha para o saldo — gastar a meio não muda o que pede. É a
      // opção de quem planeia gastar ao longo do período e não quer compensar o que já gastou.
      if ((tg.fund||"refill")==="setAside") {
        var fatiaFix = round2(amt/per);
        if (fatiaFix < 0.01) fatiaFix = 0.01;
        var needF = Math.max(0, round2(fatiaFix - assignedThis));
        return { need:needF, met: assignedThis>=fatiaFix-0.005, doMes: needF<=0.005,
          progress: Math.max(0,Math.min(1, fatiaFix>0?assignedThis/fatiaFix:0)),
          label: needF>0 ? ("Reservar "+fmt(needF)+" este mês — "+fmt(fatiaFix)+"/mês (="+fmt(amt)+"/"+cad+", gaste à vontade)")
                         : ("✅ Reservado o deste mês — "+fmt(fatiaFix)+"/mês (="+fmt(amt)+"/"+cad+")") };
      }
      // Mês da despesa (opcional). Quando já passou, avança sozinho para o período seguinte,
      // para o alvo continuar a funcionar ano após ano sem ser preciso mexer nele.
      var dueEff = tg.due || null, gd = 0;
      while (dueEff && monthsBetween(m, dueEff) < 0 && gd++ < 4000) dueEff = shiftMonth(dueEff, per);

      var falta = round2(amt - avail);
      if (falta <= 0.005) {
        return { need:0, met:true, progress:1,
          label: "🎯 Já tem "+fmt(amt)+" juntos"+(dueEff?(" para "+monthLabel(dueEff)):"")+" — nada a reservar este mês" };
      }
      var fatia, restantes = per;
      if (dueEff) { var dm = monthsBetween(m, dueEff); restantes = dm>=0 ? dm+1 : 1; fatia = round2(falta/restantes); }
      else fatia = round2(amt/per);
      if (falta > 0.005 && fatia < 0.01) fatia = 0.01;      // idem: não encravar nos últimos cêntimos
      // Nunca pedir mais do que falta para o total — é isto que faz o alvo "acabar".
      // Conta só o que se PÔS este mês (positivo): ter TIRADO dinheiro já baixou o saldo e por
      // isso já subiu o "falta" e a fatia — descontar um negativo cobrava o movimento duas vezes.
      var postoQ = assignedThis>0 ? assignedThis : 0;
      var needQ = Math.max(0, round2(Math.min(fatia - postoQ, falta)));
      var lbl;
      if (needQ > 0.005) {
        lbl = dueEff ? ("Juntar "+fmt(needQ)+" este mês até "+monthLabel(dueEff)+" — faltam "+fmt(falta)+" de "+fmt(amt))
                     : ("Reservar "+fmt(needQ)+" este mês — "+fmt(fatia)+"/mês para "+fmt(amt)+"/"+cad);
      } else {
        lbl = "✅ Reservado o deste mês — faltam "+fmt(falta)+" de "+fmt(amt)+(dueEff?(" até "+monthLabel(dueEff)):"");
      }
      return { need:needQ, met: falta<=0.005, doMes: needQ<=0.005, progress: Math.max(0,Math.min(1, amt>0?avail/amt:0)), label: lbl };
    }
    if (type==="byDate") {
      var target = tg.date || m;
      // RESERVAR: mensalidade FIXA, congelada quando a categoria foi editada (tg.slice). Não
      // olha para o saldo — gastar a meio não muda o pedido. Pede-a até à data; depois pára.
      // slice × nº de meses = o que faltava na altura, por isso quem não gasta acerta no total.
      if ((tg.fund||"refill")==="setAside") {
        var passou = monthsBetween(m, target) < 0;
        var slFix = round2(tg.slice||0);
        if (passou || slFix<=0.005) {
          return { need:0, met:true, doMes:true, progress: Math.max(0,Math.min(1, amt>0?avail/amt:0)),
            label: passou ? ("Prazo terminado ("+monthLabel(target)+")") : ("🎯 Nada a reservar até "+monthLabel(target)) };
        }
        var needSl = Math.max(0, round2(slFix - assignedThis));
        return { need:needSl, met: assignedThis>=slFix-0.005, doMes: needSl<=0.005,
          progress: Math.max(0,Math.min(1, amt>0?avail/amt:0)),
          label: needSl>0 ? ("Reservar "+fmt(needSl)+" este mês — "+fmt(slFix)+"/mês até "+monthLabel(target)+" (gaste à vontade)")
                          : ("✅ Reservado o deste mês — "+fmt(slFix)+"/mês até "+monthLabel(target)) };
      }
      var diff = monthsBetween(m, target), left = diff>=0 ? diff+1 : 1;
      var remain = round2(amt - avail);
      // Descontar o que já foi atribuído ESTE mês, senão cada financiamento voltava a pedir uma
      // fatia nova e atribuía a mais em silêncio. Mas conta SÓ o que se PÔS (positivo): se este
      // mês se TIROU dinheiro da categoria, isso já baixou o saldo — logo já subiu o "falta
      // juntar" e, com ele, a fatia mensal. Descontar um atribuído NEGATIVO cobrava o mesmo
      // movimento duas vezes e pedia o total em falta como se fosse a mensalidade (o rótulo
      // chegava a dizer "142,34/mês" faltando 142,34 no total, com dois meses pela frente).
      // É a mesma proteção que o sliceAteData já fazia no modo Reservar.
      var posto3 = assignedThis>0 ? assignedThis : 0;
      var fatia3 = round2(remain / left);
      if (remain > 0.005 && fatia3 < 0.01) fatia3 = 0.01;   // nunca deixar o alvo encravado nos últimos cêntimos
      var need3 = Math.max(0, round2(Math.min(fatia3 - posto3, remain)));
      var lbl3;
      if (remain <= 0.005) lbl3 = "🎯 Objetivo atingido ("+fmt(amt)+")";
      else if (need3 > 0.005) lbl3 = "Juntar "+fmt(need3)+"/mês até "+monthLabel(target)+" — faltam "+fmt(remain)+" de "+fmt(amt);
      else lbl3 = "✅ Reservado o deste mês — faltam "+fmt(remain)+" de "+fmt(amt)+" até "+monthLabel(target);
      return { need:need3, met: remain<=0.005, doMes: need3<=0.005, progress: Math.max(0,Math.min(1, avail/amt)), label: lbl3 };
    }
    return null;
  }

  function orderedCategories() {
    var out=[];
    for (var g=0; g<state.groups.length; g++){ var cs=categoriesOfGroup(state.groups[g].id); for(var c=0;c<cs.length;c++) out.push(cs[c]); }
    return out;
  }
  var PRIO_RANK = { alta:0, normal:1, baixa:2 };
  var PRIO_LABEL = { alta:"Alta", normal:"Normal", baixa:"Baixa" };
  var PRIO_ICON  = { alta:"▲", normal:"●", baixa:"▼" };
  var PRIO_CICLO = ["alta","normal","baixa"];        // cada clique desce um nível; do fundo volta ao topo
  // mode "full" = cobre a totalidade dos alvos em falta.
  // mode "cap"  = financia só até esgotar o Pronto a atribuir, segundo a estratégia:
  //   "order"    – pela ordem do orçamento (enche cada uma até acabar o dinheiro)
  //   "priority" – primeiro as de prioridade Alta, depois Normal, depois Baixa
  //   "prop"     – reparte proporcionalmente ao que falta em cada categoria
  function fundingPlan(mode, m, strategy) {
    strategy = strategy || "priority";        // predefinição num sítio só, não em cada chamada
    var list = orderedCategories();
    var rta = readyToAssign(m);
    var needs = [];
    for (var i=0;i<list.length;i++){
      var c=list[i], ti=targetInfo(c,m);
      if (!ti || !(ti.need>0)) continue;
      needs.push({ catId:c.id, name:c.name, need:round2(ti.need), prio:(c.priority||"normal") });
    }
    var entries = [];
    if (mode !== "cap") {
      entries = needs.map(function(n){ return {catId:n.catId, name:n.name, add:n.need, prio:n.prio}; });
    } else if (rta > 0.005) {
      if (strategy === "prop") {
        var totalNeed = 0; needs.forEach(function(n){ totalNeed += n.need; });
        if (totalNeed <= rta + 0.005) {
          entries = needs.map(function(n){ return {catId:n.catId, name:n.name, add:n.need, prio:n.prio}; });
        } else {
          entries = needs.map(function(n){ return {catId:n.catId, name:n.name, add:round2(rta*(n.need/totalNeed)), prio:n.prio}; });
          var sum=0; entries.forEach(function(e){ sum+=e.add; });
          var diff = round2(rta - sum);
          if (entries.length && Math.abs(diff) >= 0.005) entries[entries.length-1].add = round2(entries[entries.length-1].add + diff);
          entries = entries.filter(function(e){ return e.add > 0.005; });
        }
      } else {
        var order = needs.slice();
        if (strategy === "priority") order.sort(function(a,b){ return (PRIO_RANK[a.prio]==null?1:PRIO_RANK[a.prio]) - (PRIO_RANK[b.prio]==null?1:PRIO_RANK[b.prio]); });
        var remaining = rta;
        for (var j=0;j<order.length;j++){
          if (remaining <= 0.005) break;
          var add = Math.min(order[j].need, round2(remaining));
          if (add <= 0.005) continue;
          entries.push({catId:order[j].catId, name:order[j].name, add:round2(add), prio:order[j].prio});
          remaining = round2(remaining - add);
        }
      }
    }
    var total=0; for (var k=0;k<entries.length;k++) total += entries[k].add;
    total = round2(total);
    return { entries:entries, total:total, rtaBefore:round2(rta), rtaAfter:round2(rta-total) };
  }

  // ---------- Trocar e gerir orçamentos ----------
  function loadBudgetRaw(id){
    try {
      var raw = localStorage.getItem(budKey(id));
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var o = JSON.parse(raw);
      o.settings = o.settings || { locale:"pt-PT", currency:"EUR" };
      o.collapsed = o.collapsed || {}; o.assignments = o.assignments || {}; o.snooze = o.snooze || {};
      o.recurring = o.recurring || []; o.ui = o.ui || { view:"budget", month:nowMonthKey() };
      // Regras criadas antes de existir o «dia pretendido»: fixa-se agora, a partir da próxima
      // data. Não muda nada no imediato, mas passa a proteger do encurtamento de fevereiro.
      for (var ri=0; ri<o.recurring.length; ri++){
        var rr=o.recurring[ri];
        if (rr && !(rr.dia>0) && rr.nextDate) rr.dia = +String(rr.nextDate).slice(8,10) || null;
      }
      o.backup = o.backup || { at:null, sig:null, autoDay:null, pend:0 };
      if (!Array.isArray(o.moves)) o.moves = [];       // orçamentos criados antes desta funcionalidade
      // A paleta já mudou duas vezes. Quem tinha uma cor antiga fica com a mais parecida das
      // novas, em vez de ser atirado para o tema de origem sem explicação.
      var CORES_ANTIGAS = { rose:"framboesa", green:"petroleo", verde:"petroleo", rosa:"framboesa",
                            malva:"violeta", ocre:"grafite", telha:"ameixa" };
      if (CORES_ANTIGAS[o.settings.theme]) o.settings.theme = CORES_ANTIGAS[o.settings.theme];
      return o;
    } catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
  }
  // Estado de VISTA reposto sempre que se "abre" um orçamento (entrar na aplicação ou trocar de
  // orçamento). Só toca no state.ui — nunca em dados. Sem isto, a aplicação reabria onde se tinha
  // saído: noutro separador, noutro mês (com risco de atribuir dinheiro ao mês errado) ou com
  // filtros ligados a esconder categorias, dando a impressão de que faltavam.
  function reporVistaInicial(){
    state.ui = state.ui || {};
    state.ui.view = "budget";
    state.ui.month = nowMonthKey();
    state.ui.budgetFilters = {};      // 🟢🟡🔴 / com saldo / com excedente
    state.ui.prioFilters = {};        // ▲ ● ▼
    state.ui.txFilter = null;         // filtros da lista de transações
    state.ui.txLimit = PAGINA;        // volta à primeira página
    aoTopo();                         // é outro orçamento: começa-se do princípio
  }
  function switchBudget(id){
    if (id === _bindex.active) { closeModal(); return; }
    if (!budgetName(id)) return;
    // Se a gravação falhar (armazenamento cheio), o que está em memória é a ÚNICA cópia do
    // trabalho recente. Trocar de orçamento substitui a memória — e essas edições morriam ali,
    // em silêncio. Antes de deitar fora a memória, exige-se que ela esteja em disco.
    if (!save()) { toast("Não foi possível guardar este orçamento — a troca foi cancelada para não perder as alterações."); return; }
    _bindex.active = id; saveIndex(_bindex);
    state = loadBudgetRaw(id);
    if (!state.ui) state.ui = { view:"budget", month:nowMonthKey() };
    _ultimoJSON = null; _sigCache = null;   // outro orçamento: as caches do anterior não servem
    reporVistaInicial();          // aterra no Orçamento do mês corrente, sem filtros do outro orçamento
    _idx=null; _payees=null; limparHistorico(); hideUndo();
    var posted = processRecurring();
    closeModal(); render();
    toast("Orçamento: "+budgetName(id)+(posted>0?(" · lançadas "+posted+" recorrentes"):""));
  }
  function createBudget(nome){
    nome = corta(nome, LIM_NOME) || "Novo orçamento";
    var id = novoId();
    var vazio = JSON.parse(JSON.stringify(DEFAULT_STATE)); vazio.ui = { view:"budget", month:nowMonthKey() };
    try { localStorage.setItem(budKey(id), JSON.stringify(vazio)); } catch(e){ toast("Sem espaço para outro orçamento."); return; }
    // Mesma regra da troca: o orçamento novo só abre depois de o atual estar a salvo em disco.
    if (!save()) { toast("Não foi possível guardar o orçamento atual — o novo não foi aberto, para não perder alterações."); return; }
    _bindex.list.push({ id:id, name:nome });
    _bindex.active = id; saveIndex(_bindex);
    state = vazio; _ultimoJSON=null; _sigCache=null; _idx=null; _payees=null; limparHistorico(); hideUndo();
    closeModal(); render(); toast("Orçamento «"+nome+"» criado.");
  }
  function renameBudget(id, nome){
    nome = corta(nome, LIM_NOME); if(!nome) return;
    for(var i=0;i<_bindex.list.length;i++) if(_bindex.list[i].id===id) _bindex.list[i].name=nome;
    saveIndex(_bindex); scheduleAutoSync(); render(); budgetsModal();
  }
  function deleteBudget(id){
    if (_bindex.list.length<=1){ toast("Tem de haver pelo menos um orçamento."); return; }
    var nome = budgetName(id);
    if(!confirm("Eliminar o orçamento «"+nome+"» e tudo o que tem dentro?\nEsta ação não se pode anular.")) return;
    // Guarda-se o conteúdo ANTES de o apagar. O ponto de segurança tem de ir para a lista de um
    // orçamento que SOBREVIVE (a do que se elimina desaparece com ele), por isso só se escreve
    // depois de o orçamento ativo estar decidido, mais abaixo.
    var salvo = null; try { salvo = loadBudgetRaw(id); } catch(e){}
    try {
      var lst=[]; try{ lst=JSON.parse(localStorage.getItem(SNAP_KEY+"::"+id))||[]; }catch(_e){}
      idbApagar(lst.map(function(x){return x.ref;}).filter(Boolean));
      localStorage.removeItem(budKey(id)); localStorage.removeItem(SNAP_KEY+"::"+id);
    } catch(e){}
    _bindex.list = _bindex.list.filter(function(b){ return b.id!==id; });
    if (_bindex.active===id) {
      _bindex.active = _bindex.list[0].id; saveIndex(_bindex);
      state = loadBudgetRaw(_bindex.active); _ultimoJSON=null; _sigCache=null; _idx=null; _payees=null; limparHistorico(); hideUndo();
    } else saveIndex(_bindex);
    if (salvo) pontoDeSeguranca("antes de eliminar «"+nome+"»", salvo);
    scheduleAutoSync(); render(); budgetsModal();
    toast("Orçamento «"+nome+"» eliminado.");
  }

  // Operação simétrica do financiamento: quando se atribuiu mais do que havia, retira
  // das categorias até o «Pronto a atribuir» voltar a zero.
  // A diferença de fundo é o limite de cada categoria — aqui é o que ela TEM, não o que lhe falta.
  // E por prioridade tira-se primeiro das BAIXAS, para proteger as Altas: ao contrário do
  // financiamento, onde as Altas são as primeiras a ser servidas.
  function recoverPlan(m, strategy) {
    strategy = strategy || "priority";
    var rta = readyToAssign(m), falta = round2(-rta);
    if (falta <= 0.005) return { entries:[], total:0, rtaBefore:rta, rtaAfter:rta, disponivel:0 };

    var list = orderedCategories(), podem = [], totalTem = 0;
    for (var i=0;i<list.length;i++){
      var c = list[i];
      if (c.cardId) continue;                        // a do cartão é automática, não se mexe
      var tem = availableFor(c.id, m);
      if (tem > 0.005) { podem.push({ catId:c.id, name:c.name, tem:round2(tem), prio:(c.priority||"normal") }); totalTem += tem; }
    }
    totalTem = round2(totalTem);
    var entries = [];
    if (strategy === "prop") {
      if (totalTem <= falta + 0.005) entries = podem.map(function(p){ return {catId:p.catId, name:p.name, add:round2(-p.tem), prio:p.prio}; });
      else {
        entries = podem.map(function(p){ return {catId:p.catId, name:p.name, add:round2(-falta*(p.tem/totalTem)), prio:p.prio}; });
        var soma=0; entries.forEach(function(e){ soma+=e.add; });
        var dif = round2(-falta - soma);
        if (entries.length && Math.abs(dif) >= 0.005) entries[entries.length-1].add = round2(entries[entries.length-1].add + dif);
        entries = entries.filter(function(e){ return e.add < -0.005; });
      }
    } else {
      var ordem = podem.slice();
      if (strategy === "priority") ordem.sort(function(a,b){ return (PRIO_RANK[b.prio]==null?1:PRIO_RANK[b.prio]) - (PRIO_RANK[a.prio]==null?1:PRIO_RANK[a.prio]); });
      else ordem.reverse();                          // pela ordem da lista, mas de baixo para cima
      var resta = falta;
      for (var j=0;j<ordem.length;j++){
        if (resta <= 0.005) break;
        var tira = Math.min(ordem[j].tem, round2(resta));
        if (tira <= 0.005) continue;
        entries.push({catId:ordem[j].catId, name:ordem[j].name, add:round2(-tira), prio:ordem[j].prio});
        resta = round2(resta - tira);
      }
    }
    var total=0; entries.forEach(function(e){ total += e.add; });
    total = round2(total);
    return { entries:entries, total:total, rtaBefore:rta, rtaAfter:round2(rta - total), disponivel:totalTem };
  }

  // Tecto de cada categoria: quanto é que ela precisa de ter, no máximo, segundo o seu alvo.
  //   "alvo"    -> há um tecto; o que passe disso é excedente
  //   "acumula" -> «reservar todos os meses» junta de propósito, não há tecto
  //   "sem"     -> sem alvo, não há como saber o que é de mais
  function tetoDaCategoria(cat, m) {
    var tg = cat.target;
    // A categoria do cartão precisa exatamente do que falta liquidar. O que passe disso é excedente.
    if (cat.cardId) return { teto: Math.max(0, round2(-accountBalanceUpto(cat.cardId, m))), tipo:"alvo" };
    if (!tg || !(tg.amount > 0)) return { teto:null, tipo:"sem" };
    var t = tg.type || "monthly";
    // Reservar (mensal, periódico OU até uma data) acumula sem teto: o dinheiro vai crescendo.
    if (tg.fund === "setAside" && (t === "monthly" || t === "quarterly" || t === "semiannual" || t === "yearly" || t === "byDate")) return { teto:null, tipo:"acumula" };
    if (t === "weekly") return { teto: round2(tg.amount * weekdayCount(m, (tg.weekday==null?1:tg.weekday))), tipo:"alvo" };
    return { teto: round2(tg.amount), tipo:"alvo" };
  }

  // Dinheiro que está numa categoria ACIMA do que o alvo dela exige. Devolvê-lo ao
  // «Pronto a atribuir» não mexe em contas nem em transações — só desfaz a atribuição.
  function surplusPlan(m, incluirSemAlvo) {
    var list = orderedCategories(), entries = [], total = 0;
    for (var i=0;i<list.length;i++){
      var c = list[i];
      var tem = availableFor(c.id, m);
      if (tem <= 0.005) continue;
      var t = tetoDaCategoria(c, m), excesso = 0;
      if (t.tipo === "acumula") continue;                      // é para juntar, não é excedente
      if (t.tipo === "sem") { if (!incluirSemAlvo) continue; excesso = tem; }
      else excesso = round2(tem - t.teto);
      if (excesso > 0.005) { entries.push({ catId:c.id, name:c.name, add:round2(-excesso), tem:round2(tem), teto:t.teto }); total -= excesso; }
    }
    total = round2(total);
    var rta = readyToAssign(m);
    return { entries:entries, total:total, rtaBefore:rta, rtaAfter:round2(rta - total) };
  }

  // Tem mais do que o alvo pede? Mesma regra do surplusPlan, por categoria (para o filtro «Com
  // excedente»). Sem alvo NÃO conta (não há alvo a exceder); «reservar» também não (acumula de
  // propósito). No cartão, o teto é o que falta liquidar — a folga acima disso é excedente.
  function temExcedente(c, m){
    var tem = availableFor(c.id, m);
    if (tem <= 0.005) return false;
    var t = tetoDaCategoria(c, m);
    if (t.tipo !== "alvo") return false;              // "acumula" e "sem" não têm excedente
    return round2(tem - t.teto) > 0.005;
  }

  // ---------- Datas em dd/mm/aaaa ----------
  // O <input type="date"> nativo mostra a data no idioma do *browser*, não no da página:
  // quem tem o Chrome em inglês vê mm/dd/aaaa por muito lang="pt-PT" que aqui esteja.
  // Por isso a data escreve-se num campo de texto nosso, e o calendário nativo fica
  // atrás de um botão só para escolher. Guardado continua tudo em ISO, como antes.
  function isoParaPt(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
    return m ? m[3]+"/"+m[2]+"/"+m[1] : "";
  }
  function ptParaIso(txt) {
    var m = /^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/.exec(String(txt||"").trim());
    if (!m) return "";
    var d = +m[1], mes = +m[2], ano = +m[3];
    if (mes < 1 || mes > 12 || d < 1 || ano < 1900 || ano > 2999) return "";
    var dt = new Date(Date.UTC(ano, mes-1, d));
    // 31/02 seria empurrado para 03/03 sem dar nas vistas — é recusado.
    if (dt.getUTCMonth() !== mes-1 || dt.getUTCDate() !== d) return "";
    return ano+"-"+pad(mes)+"-"+pad(d);
  }
  function dateVal(id) { var e = el(id); return e ? ptParaIso(e.value) : ""; }
  function dateField(id, iso, extra) {
    return '<div class="date-field">'+
      '<input id="'+id+'" class="date-txt" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" '+
        'value="'+esc(isoParaPt(iso))+'" '+(extra||"")+'>'+
      '<span class="date-btn" aria-hidden="true">📅</span>'+
      '<input id="'+id+'__nat" class="date-nat" type="date" value="'+esc(iso||"")+'" aria-label="Escolher a data no calendário">'+
    '</div>';
  }

  // As quatro operações em bloco — financiar, repor, libertar e cobrir — movem dinheiro
  // entre sítios do orçamento, e nenhuma toca nas contas. Estes dois ajudantes existem
  // para que as quatro se expliquem sempre pela mesma ordem e com as mesmas palavras:
  // o que se passa, de onde vem para onde vai, e a garantia de que nada sai do banco.
  function opIntro(diagnostico, de, para) {
    return '<p class="op-intro">'+diagnostico+
      '<span class="op-fluxo"><span>'+de+'</span><span class="seta">→</span><span>'+para+'</span></span>'+
      '<span class="op-nota">Nada sai das contas — o dinheiro só muda de função.</span></p>';
  }
  // Três números, sempre na mesma ordem: como está agora, quanto se mexe, como fica.
  function opKpis(rotulo, agora, clsA, verbo, mexe, depois, clsD) {
    function k(r, v, c){ return '<div class="kpi op-kpi"><div class="k-label">'+r+'</div><div class="k-value '+(c||"")+'">'+v+'</div></div>'; }
    return '<div class="op-kpis">'+k(rotulo, agora, clsA)+k("A "+verbo, mexe, "")+k("Fica em", depois, clsD)+'</div>';
  }

  // Somatórios do topo do orçamento. As categorias de pagamento de cartão ficam de
  // fora, e o motivo é concreto: a atividade delas é o espelho *positivo* do que se
  // gastou. Pagar 50 € de mercearia com o cartão dá −50 na Mercearia e +50 no cartão;
  // somando tudo daria zero, e a coluna diria que não se gastou nada nesse mês.
  // Como as três colunas obedecem a  disponível = transitado + atribuído + atividade,
  // tirar o cartão de uma obriga a tirá-lo das três — senão os totais deixam de fechar.
  // O grupo do cartão continua a ter os seus próprios subtotais, na linha dele.
  function budgetTotals(m) {
    var list = orderedCategories(), t = { assigned:0, activity:0, avail:0, cartoes:0 };
    for (var i=0;i<list.length;i++) {
      var c = list[i];
      if (c.cardId) { t.cartoes = round2(t.cartoes + availableFor(c.id, m)); continue; }
      t.assigned = round2(t.assigned + assignedFor(c.id, m));
      t.activity = round2(t.activity + activityFor(c.id, m));
      t.avail    = round2(t.avail    + availableFor(c.id, m));
    }
    return t;
  }

  // Devolve ao Pronto a atribuir tudo o que foi atribuído *neste* mês. O que transitou
  // de meses anteriores fica onde está — mexer nisso reescreveria o passado.
  function clearPlan(m) {
    var entries = [], total = 0;
    var list = orderedCategories();
    for (var i=0;i<list.length;i++) {
      var c = list[i], k = c.id+"|"+m, v = round2(state.assignments[k] || 0);
      if (Math.abs(v) <= 0.005) continue;
      entries.push({ id:c.id, name:c.name, add:v, fica: round2(availableFor(c.id, m) - v) });
      total = round2(total + v);
    }
    entries.sort(function(a,b){ return Math.abs(b.add) - Math.abs(a.add); });
    var rtaBefore = readyToAssign(m);
    return { entries:entries, total:total, rtaBefore:rtaBefore, rtaAfter: round2(rtaBefore + total) };
  }

  function clearModal() {
    var m = state.ui.month, plan = clearPlan(m);
    var negativas = plan.entries.filter(function(e){ return e.fica < -0.005; }).length;
    var rows = plan.entries.length ? plan.entries.map(function(e){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--border);">'+
        '<span><b>'+esc(e.name)+'</b><br><span class="tag">fica em '+fmt(e.fica)+(e.fica < -0.005 ? ' — já gastou mais do que isso' : '')+'</span></span>'+
        '<b class="tx-amt in" style="font-variant-numeric:tabular-nums;">'+fmt(e.add)+'</b></div>';
    }).join("") : '<div class="muted" style="padding:14px 0;text-align:center;">Ainda não atribuiu nada neste mês. 👍</div>';

    openModal(
      '<div class="modal-head"><h2>🧽 Limpar atribuições — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        opIntro(plan.entries.length
            ? ('Vai devolver <b>'+fmt(plan.total)+'</b> atribuídos a '+plan.entries.length+(plan.entries.length===1?' categoria':' categorias')+', para recomeçar o mês do zero.')
            : 'Não há nada atribuído neste mês para devolver.',
          "Categorias", "Pronto a atribuir")+
        opKpis("Por atribuir", fmt(plan.rtaBefore), "", "devolver", fmt(plan.total), fmt(plan.rtaAfter), plan.rtaAfter < -0.005 ? "neg" : "pos")+
        '<div class="hint" style="margin-bottom:12px;">Só mexe em <b>'+monthLabel(m)+'</b>: o que transitou dos meses anteriores fica onde está, e as transações não são tocadas.'+
          (negativas ? ' <b style="color:var(--warning)">'+negativas+(negativas===1?' categoria fica negativa':' categorias ficam negativas')+'</b>, por já ter gasto nelas mais do que isso.' : '')+'</div>'+
        '<div style="max-height:230px;overflow:auto;">'+rows+'</div>'+
      '</div>'+
      '<div class="modal-foot"><span></span>'+
        '<span><button class="btn" data-action="close">Cancelar</button> '+
        (plan.entries.length?'<button class="btn primary" data-action="apply-clear">Devolver '+fmt(plan.total)+'</button>':'')+'</span></div>');
  }

  // Quem pode emprestar dinheiro para tapar um buraco. O Pronto a atribuir vem sempre
  // primeiro nas sugestões automáticas: é dinheiro que ainda não tem função nenhuma.
  // Daqui a quantos meses é que o dinheiro desta categoria faz falta. É o terceiro eixo para
  // decidir de onde tirar, e não se confunde com os outros dois: a PRIORIDADE diz o que é
  // importante, a FOLGA diz onde há dinheiro parado, e o PRAZO diz quanto tempo há para repor
  // o que se tirar. São coisas independentes — as férias do próximo verão podem ser prioritárias
  // E distantes, e é delas que dói menos tirar hoje.
  var PRAZO_LONGO = 999;   // sem prazo nenhum: nada foi prometido, logo nada urge
  function mesesAtePrecisar(cat, m) {
    var tg = cat.target;
    if (!tg || !(tg.amount > 0)) return PRAZO_LONGO;          // sem alvo, sem compromisso
    var t = tg.type || "monthly";
    // Mensal e semanal são para gastar ESTE mês: tirar de lá estraga o mês corrente.
    if (t === "monthly" || t === "weekly") return 0;
    if (t === "byDate") {
      if (!tg.date) return PRAZO_LONGO;
      var d = monthsBetween(m, tg.date);
      // Prazo já passado com dinheiro ainda lá: ninguém está à espera dele.
      return d < 0 ? PRAZO_LONGO : d;
    }
    var per = t === "quarterly" ? 3 : (t === "semiannual" ? 6 : 12);
    if (!tg.due) return per;                                   // sem mês marcado: vale o período
    // O mês da despesa anda sozinho para o período seguinte quando passa — mesma regra do
    // targetInfo, senão um alvo anual dado como «vencido» parecia sempre urgente.
    var due = tg.due, g = 0;
    while (monthsBetween(m, due) < 0 && g++ < 4000) due = shiftMonth(due, per);
    return Math.max(0, monthsBetween(m, due));
  }
  function coverSources(alvoId, m) {
    var out = [], rta = readyToAssign(m);
    if (rta > 0.005) out.push({ id:RTA_ID, name:"Pronto a atribuir", prio:"baixa", max:round2(rta), rta:true, meses:PRAZO_LONGO });
    var list = orderedCategories();
    for (var i=0;i<list.length;i++){
      var c = list[i];
      if (c.id === alvoId) continue;
      var tem = availableFor(c.id, m);
      if (tem <= 0.005) continue;
      var max = tem;
      // Ao cartão só se tira a folga: o resto é preciso para o liquidar.
      if (c.cardId) { var t = tetoDaCategoria(c, m); max = round2(tem - (t.teto || 0)); }
      if (max <= 0.005) continue;
      out.push({ id:c.id, name:c.name, prio:c.priority||"normal", max:round2(max), rta:false,
                 meses: mesesAtePrecisar(c, m) });
    }
    return out;
  }

  // Ordena as fontes conforme o modo escolhido — usada tanto na sugestão automática como na
  // lista visível: "prio" mostra primeiro as prioridades mais baixas, "folga" quem tem mais
  // dinheiro parado, "prazo" quem só precisa do dinheiro mais tarde, "manual" mantém a ordem
  // do ecrã Orçamento. O desempate é sempre por quem tem mais: assim mexe-se em menos
  // categorias para tapar o mesmo buraco.
  function coverOrder(fontes, modo) {
    var ord = fontes.slice();
    if (modo === "manual") return ord;
    ord.sort(function(a,b){
      if (a.rta !== b.rta) return a.rta ? -1 : 1;
      if (modo === "folga") return b.max - a.max;
      if (modo === "prazo") return (b.meses - a.meses) || (b.max - a.max);
      return (PRIO_RANK[b.prio] - PRIO_RANK[a.prio]) || (b.max - a.max);
    });
    return ord;
  }
  // Sugestão automática. "prio" tira primeiro de quem tem prioridade mais baixa, "folga" de
  // quem tem mais dinheiro parado, "prazo" de quem só precisa do dinheiro mais tarde,
  // "manual" não sugere nada.
  function coverAuto(fontes, falta, modo) {
    var sel = {};
    if (modo === "manual") return sel;
    var ord = coverOrder(fontes, modo);
    var resta = falta;
    for (var i=0;i<ord.length && resta > 0.005;i++){
      var t = Math.min(ord[i].max, resta);
      if (t > 0.005) { sel[ord[i].id] = round2(t); resta = round2(resta - t); }
    }
    return sel;
  }

  function coverTotal(sel) { var s=0; for (var k in sel) if (sel.hasOwnProperty(k)) s += sel[k]||0; return round2(s); }

  // ---------- Desenho do ecrã ----------
  function applyTheme(){
    if (!document.body) return;
    var t = temaAtual();
    for (var i=0;i<TEMAS.length;i++) document.body.classList.remove("tema-"+TEMAS[i].id);
    if (t !== "verde") document.body.classList.add("tema-"+t);   // o verde é o de origem: não precisa de classe
  }
  function render() {
    _txSel = {};   // a seleção temporária de transações não sobrevive a mudanças de página
    var _sb = document.getElementById("txSelBar"); if (_sb) _sb.classList.remove("show");
    applyTheme();
    pinSystemGroups();
    // Guardar ANTES de indexar: o save() invalida o índice, e assim ele fica válido
    // também depois do render (os cliques seguintes já não voltam a percorrer tudo).
    save();
    buildIndex(state.ui.month);
    renderSidebar();
    var v = state.ui.view;
    el("viewTitle").textContent = ({budget:"Orçamento",accounts:"Contas",transactions:"Transações",recurring:"Recorrentes",reports:"Relatórios"})[v];
    el("monthLabel").textContent = monthLabel(state.ui.month);
    el("monthNav").style.display = (v === "budget" || v === "reports") ? "flex" : "none";
    // separador ativo
    var nb = el("nav").querySelectorAll("button");
    for (var i=0;i<nb.length;i++) nb[i].classList.toggle("active", nb[i].getAttribute("data-view") === v);

    if (v === "budget") { renderRTA(); renderBudget(); }
    else { el("rtaWrap").innerHTML = ""; }
    if (v === "accounts") renderAccounts();
    if (v === "transactions") renderTransactions();
    if (v === "recurring") renderRecurring();
    if (v === "reports") renderReports();
    refreshUndoButtons();
    medirTopo();
    ajustarBarra();
  }

  function renderSidebar() {
    var bn = el("budName"); if (bn) bn.textContent = budgetName(_bindex.active) || "Orçamento";
    // O mesmo nome no cabeçalho do telemóvel, onde a barra lateral não existe: sem ele, um ícone
    // sozinho não dizia nem o que fazia nem em que orçamento se estava.
    var bnm = el("budNameM"); if (bnm) bnm.textContent = budgetName(_bindex.active) || "Orçamento";
    var wrap = el("sideAccounts");
    var accs = state.accounts.filter(function(a){return !a.hidden;});
    if (!accs.length) { wrap.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:#64748b;">Sem contas ainda</div>'; }
    else {
      wrap.innerHTML = accs.map(function (a) {
        var bal = accountBalance(a.id);
        return '<button class="side-acc" data-action="open-account" data-id="' + a.id + '" draggable="true" data-drag="acc" data-drag-id="' + a.id + '">' +
          '<span class="nm">' + pontoConta(a.id) + esc(a.name) + '</span>' +
          '<span class="bal ' + (bal < 0 ? "neg" : "") + '">' + fmt(bal) + '</span></button>';
      }).join("");
    }
    el("netWorth").textContent = fmt(netWorth());
    // O aviso é GLOBAL: a cópia em ficheiro guarda todos os orçamentos, por isso o badge conta
    // também o que está por guardar nos outros — senão, estando num orçamento guardado, nada
    // indicava que outro tinha alterações a descoberto.
    var outrosP = outrosPorGuardar().lista;
    var meuP = backupPending();
    var pend = meuP || outrosP.length>0;
    var pn = meuP ? ((state.backup && state.backup.pend) || 0) : 0;
    for (var oi=0; oi<outrosP.length; oi++) pn += outrosP[oi].pend||0;
    var pTit = 'Há alterações por guardar em ficheiro' + (pn>0 ? (' ('+pn+')') : '')
             + (outrosP.length ? ' — inclui outro(s) orçamento(s)' : '');
    function badge(cls){ return pend ? ('<span class="count-badge'+cls+'" title="'+pTit+'">'+(pn>0 ? (pn>99?'99+':pn) : '')+'</span>') : ''; }
    var bd = el("btnData");
    if (bd) bd.innerHTML = '<span>💾</span> Dados e cópias' + badge('');
    var bdm = el("btnDataM");
    if (bdm) bdm.innerHTML = '💾' + badge(' corner');
  }

  function renderRTA() {
    var rta = readyToAssign(state.ui.month);
    var excedente = surplusPlan(state.ui.month, !!state.ui.surplusSemAlvo).total;
    var temAtribuido = clearPlan(state.ui.month).entries.length > 0;
    // Categorias excedidas (disponível negativo). Contadas ANTES do balão, mas só para lhe
    // TIRAR a festa: com contas por acertar, «cada euro tem uma função 🎉» era uma boa notícia a
    // tapar uma má. Dizer QUANTAS é trabalho da barra vermelha logo por baixo, que tem o
    // «Ver quais» — repeti-lo aqui punha o mesmo alarme duas vezes, em duas cores.
    // O número (0,00) está certo e não se mexe: o rendimento ESTÁ todo atribuído. O que falha
    // é ter gasto em certas categorias mais do que lhes deu, e isso resolve-se movendo dinheiro
    // ENTRE categorias, não atribuindo mais.
    // Só as categorias VISÍVEIS: o «Ver quais» liga um filtro que corre sobre essas, por isso
    // contar as arquivadas dava um número que a lista a seguir não conseguia mostrar.
    var visiveisCats = orderedCategories(), excedidas = 0;
    for (var oc=0; oc<visiveisCats.length; oc++) if (catStatus(visiveisCats[oc], state.ui.month) === "neg") excedidas++;
    var cls = rta > 0.005 ? "" : (rta < -0.005 ? "over" : "zero");
    var msg = rta > 0.005 ? "Pronto a atribuir"
            : (rta < -0.005 ? "Atribuiu mais do que tinha"
            : (excedidas ? "Tudo atribuído" : "Tudo atribuído — cada euro tem uma função 🎉"));
    var undoBtn = '';   // o anular/refazer é agora só pelos botões ↩ ↪ do topo (sistema único)
    var dv = integrityDelta(state.ui.month);
    var aviso = "";
    if (Math.abs(dv) >= 0.005) {
      aviso = '<div class="integrity-bar"><span>⚠️</span><span class="grow">' +
        (dv < 0 ? ('O orçamento conta com <b>'+fmt(-dv)+'</b> que já não estão nas contas de orçamento.')
                : ('Há <b>'+fmt(dv)+'</b> nas contas de orçamento que ainda não passaram por nenhuma categoria.')) +
        '</span><button data-action="integrity">Ver porquê</button></div>';
    } else {
      // Tudo bate certo, mas pode haver compras no cartão sem categoria: não reservam dinheiro
      // para a fatura, e sem este aviso o utilizador não tinha como dar por isso.
      var semCat = comprasCartaoSemCat(state.ui.month);
      if (semCat > 0) {
        aviso = '<div class="integrity-bar"><span>ℹ️</span><span class="grow"><b>'+semCat+'</b> '+
          (semCat===1 ? 'movimento no cartão de crédito está sem categoria' : 'movimentos no cartão de crédito estão sem categoria')+
          ' — o orçamento não '+(semCat===1?'o':'os')+' acompanha.'+
          '</span><button data-action="integrity">Ver quais</button></div>';
      }
    }
    // Aviso de categorias excedidas: só visual + atalho para as filtrar (já contadas acima).
    var over = "";
    if (excedidas > 0) {
      // «gastou mais do que tinha disponível» é a definição de «excedida» — dizia duas vezes a
      // mesma coisa. Fica o número, e o «Ver quais» para quem quiser agir.
      over = '<div class="overspent-bar"><span>🔴</span><span class="grow"><b>'+excedidas+'</b> '+
        (excedidas===1 ? 'categoria excedida' : 'categorias excedidas')+'</span>'+
        '<button data-action="show-overspent">Ver quais</button></div>';
    }
    var up = upcomingTotals(state.ui.month);
    var futuro = "";
    if (up.lista.length) {
      var partes = [];
      if (up.sai > 0.005)   partes.push('<b>'+fmt(up.sai)+'</b> por sair');
      if (up.entra > 0.005) partes.push('<b>'+fmt(up.entra)+'</b> por entrar');
      futuro = '<div class="upcoming-bar"><span>📅</span><span class="grow">Ainda este mês: '+partes.join(' · ')+
        ' ('+up.lista.length+' lançamento'+(up.lista.length===1?'':'s')+' recorrente'+(up.lista.length===1?'':'s')+')</span>'+
        '<button data-action="upcoming">Ver</button></div>';
    }
    el("rtaWrap").innerHTML =
      '<div class="rta-banner ' + cls + '">' +
        '<div><div class="rta-amount">' + fmt(rta) + '</div><div class="rta-label">' + msg + '</div></div>' +
        '<div class="rta-actions">' +
          (rta < -0.005 ? '<button data-action="recover-preview">↩ Repor a zero…</button>'
                        : '<button data-action="fund-preview">🎯 Financiar alvos…</button>') +
          (excedente < -0.005 ? '<button data-action="surplus-preview">🧹 Libertar '+fmt(-excedente)+'…</button>' : '') +
          (temAtribuido ? '<button data-action="clear-preview" title="Devolver tudo o que atribuiu neste mês">🧽 Limpar atribuições…</button>' : '') +
          undoBtn +
        '</div>' +
      '</div>' + over + aviso + futuro;
  }

  // Tempo relativo curto ("agora", "há 5 min", "há 2 h") para o painel de movimentos.
  function tempoRel(t){
    var s = Math.floor((Date.now()-t)/1000);
    if (s < 45) return "agora";
    if (s < 3600) return "há "+Math.max(1,Math.round(s/60))+" min";
    if (s < 86400) return "há "+Math.round(s/3600)+" h";
    return "há "+Math.round(s/86400)+" d";
  }
  // Janela dos movimentos recentes — só leitura, como o diário que é.
  function movesModal(){
    var lista = state.moves || [], mAtual = state.ui.month;
    if (!lista.length) {
      openModal(
        '<div class="modal-head"><h2>🕑 Movimentos recentes</h2><button class="x" data-action="close">×</button></div>'+
        '<div class="modal-body">'+
          emptyState("🕑","Ainda não mexeu em dinheiro",
            "Aqui fica o registo de como reparte o dinheiro pelas categorias — mover entre categorias, cobrir um excesso, financiar alvos, libertar excedente ou atribuir à mão. As transações não entram: essas têm a sua própria lista.","")+
        '</div>'+
        '<div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>');
      return;
    }
    var linhas = "";
    for (var i=0;i<lista.length;i++){
      var mv = lista[i];
      var cor = mv.delta==null ? "var(--text-muted)" : (mv.delta>0?"var(--positive)":(mv.delta<0?"var(--negative)":"var(--text-muted)"));
      var sinal = mv.delta==null ? "" : (mv.delta>0?"+":(mv.delta<0?"−":""));
      var val = mv.delta==null ? "" : (sinal+fmt(Math.abs(mv.delta)));
      // O mês só aparece quando NÃO é o que está a ver: senão repetia-se em todas as linhas,
      // e é precisamente quando é outro que a informação faz falta («financiei 200 €» — em quê?).
      var etq = (mv.m && mv.m !== mAtual) ? ' <span class="tag">'+monthLabel(mv.m)+'</span>' : '';
      linhas += '<div class="move-row"><span class="m-desc">'+esc(mv.desc)+etq+'</span>'+
        (val?'<span class="m-amt" style="color:'+cor+'">'+val+'</span>':'')+
        '<span class="m-time">'+tempoRel(mv.t)+'</span></div>';
    }
    openModal(
      '<div class="modal-head"><h2>🕑 Movimentos recentes</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Como tem repartido o dinheiro pelas categorias, do mais recente para o mais antigo (últimos '+MOVES_MAX+'). As transações não entram aqui. É só um registo — para desfazer, use o <b>↩</b> no topo.</p>'+
        '<div class="moves-list">'+linhas+'</div>'+
      '</div>'+
      '<div class="modal-foot"><span><button class="btn danger" data-action="clear-moves">Limpar lista</button></span>'+
        '<button class="btn primary" data-action="close">Fechar</button></div>');
  }

  // Estado de uma categoria no mês: "neg" (excesso), "warn" (abaixo do alvo), "ok" (cumprido), "none" (sem alvo)
  function catStatus(cat, m){
    var avail = availableFor(cat.id, m);
    if (avail < -0.005) return "neg";
    if (cat.cardId){
      // Até ao mês EM VISTA, e não o saldo de todos os tempos: uma compra datada de um mês
      // à frente não é dívida deste. Com o saldo total, a linha dizia «dívida coberta» ao mesmo
      // tempo que o «Libertar excedente» (que já contava até ao mês) se oferecia para devolver
      // esse mesmo dinheiro — dois números a discordar sobre a mesma pergunta.
      var debt = round2(-accountBalanceUpto(cat.cardId, m));
      if (debt <= 0.005) return "ok";
      return avail >= debt-0.005 ? "ok" : "warn";
    }
    var ti = targetInfo(cat, m);
    if (!ti) return "none";
    if (ti.snoozed) return "snoozed";
    return (ti.doMes!=null ? ti.doMes : ti.met) ? "ok" : "warn";
  }

  // Filtros da barra do orçamento. Dentro de cada grupo é "ou"; entre os dois grupos é "e"
  // (por exemplo «Abaixo do alvo» E «Alta»). Sem nada escolhido num grupo, esse grupo não filtra.
  function passaFiltros(c, m, bf, bp){
    bf = bf || {}; bp = bp || {};
    var fEstado = !!(bf.warn || bf.neg || bf.ok || bf.snoozed);
    var fPrio   = !!(bp.alta || bp.normal || bp.baixa);
    if (fEstado && !bf[catStatus(c, m)]) return false;
    if (fPrio && (c.cardId || !bp[c.priority||"normal"])) return false;   // as do cartão não têm prioridade
    if (bf.money && !(availableFor(c.id, m) > 0.005)) return false;        // só as que têm disponível > 0
    if (bf.over && !temExcedente(c, m)) return false;                      // só as que têm mais do que o alvo pede
    return true;
  }

  function renderBudget() {
    var m = state.ui.month;
    if (!state.groups.length) {
      el("content").innerHTML = emptyState("📊", "Comece o seu orçamento",
        "Crie grupos e categorias para dar uma função a cada euro. Para experimentar com dados de exemplo, use «Dados e cópias».",
        '<button class="btn primary" data-action="add-group">+ Novo grupo</button>');
      return;
    }
    var upc = upcomingTotals(m).porCat;   // o que cada categoria ainda tem por sair este mês
    var bf = state.ui.budgetFilters || {};
    var bp = state.ui.prioFilters || {};
    var filtering = !!(bf.warn || bf.neg || bf.ok || bf.snoozed || bf.money || bf.over || bp.alta || bp.normal || bp.baixa);
    var nShown=0, nTotal=0;
    var rows = "";
    for (var g=0; g<state.groups.length; g++) {
      var grp = state.groups[g];
      var allCats = categoriesOfGroup(grp.id);
      nTotal += allCats.length;
      var cats = filtering ? allCats.filter(function(c){ return passaFiltros(c, m, bf, bp); }) : allCats;
      nShown += cats.length;
      if (filtering && !cats.length) continue;
      var gAssigned=0, gActivity=0, gAvail=0;
      for (var c=0;c<cats.length;c++){ gAssigned+=assignedFor(cats[c].id,m); gActivity+=activityFor(cats[c].id,m); gAvail+=availableFor(cats[c].id,m); }
      var collapsed = !!state.collapsed[grp.id];
      rows += '<tr class="grp-row"'+(grp.system?'':' draggable="true" data-drag="grp" data-drag-id="'+grp.id+'"')+'><td>' +
        '<div class="grp-name"><button class="grp-toggle" data-action="toggle-group" data-id="'+grp.id+'">' +
        '<span class="caret" style="transform:rotate('+(collapsed?"-90":"0")+'deg)">▾</span>' + esc(grp.name) + '</button>' +
        (grp.system ? '' :
