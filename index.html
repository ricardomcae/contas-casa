    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #0f172a;
      --sidebar: #0b1120;
      --sidebar-2: #060a13;
      --sidebar-text: #94a3b8;
      --sidebar-text-strong: #e2e8f0;
      --text: #e5e7eb;
      --text-muted: #94a3b8;
      --border: #1f2a3c;
      --primary: #14b8a6;
      --primary-dark: #0d9488;
      --primary-soft: #134e4a;
      --accent2: #0e7490;
      --positive: #4ade80;
      --positive-soft: #14351f;
      --negative: #f87171;
      --negative-soft: #3b1414;
      --warning: #fbbf24;
      --warning-soft: #3a2c07;
      --info: #60a5fa;
      --info-soft: #17233f;
      --neutral-soft: #1f2a3c;
      --group-row: #172232;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  /* Cores da aplicação — seis. Cada tema mexe apenas nas quatro variáveis da cor de marca; os
     verdes e vermelhos dos valores nunca mudam, porque são eles que dizem se há ou não dinheiro
     e não podem depender do gosto de cada um. Daí a paleta ir do azul-esverdeado ao rosa pelo
     lado do roxo, e não passar pelo verde-relva nem pelo laranja-tijolo: qualquer cor de marca
     nessas zonas confunde-se com as barras do orçamento a um relance.
     O tema sem classe (petróleo) é o de origem e vive no :root, lá em cima. */
  body.tema-azul      { --primary: #2563eb; --primary-dark: #1d4ed8; --primary-soft: #dbe6fe; --accent2: #60a5fa; }
  body.tema-violeta   { --primary: #7c3aed; --primary-dark: #6d28d9; --primary-soft: #e9e0fb; --accent2: #c4b5fd; }
  body.tema-ameixa    { --primary: #86198f; --primary-dark: #701a75; --primary-soft: #f5e1f7; --accent2: #d946ef; }
  body.tema-framboesa { --primary: #be185d; --primary-dark: #9d174d; --primary-soft: #fce0ec; --accent2: #f472b6; }
  body.tema-grafite   { --primary: #334155; --primary-dark: #1e293b; --primary-soft: #e6e9ee; --accent2: #94a3b8; }
  body.tema-cobalto   { --primary: #1e3a8a; --primary-dark: #172554; --primary-soft: #dde3f5; --accent2: #6b8ad6; }
  body.tema-cafe      { --primary: #4a3728; --primary-dark: #33261b; --primary-soft: #ece5df; --accent2: #a08972; }
  @media (prefers-color-scheme: dark) {
    body:not([class*="tema-"]) { --primary: #3cb4d1; --primary-dark: #2793ad; --primary-soft: #10262d; --accent2: #1d6f83; }
    body.tema-azul      { --primary: #6fa1f7; --primary-dark: #4f83e0; --primary-soft: #141d2e; --accent2: #3f6bbf; }
    body.tema-violeta   { --primary: #b39af2; --primary-dark: #9575e5; --primary-soft: #1e1630; --accent2: #6d3fc4; }
    body.tema-ameixa    { --primary: #d07ad6; --primary-dark: #b45cbb; --primary-soft: #2a1730; --accent2: #8b3d92; }
    body.tema-framboesa { --primary: #ef7ba5; --primary-dark: #d95c8a; --primary-soft: #2d1520; --accent2: #a63f68; }
    body.tema-grafite   { --primary: #a3b2c7; --primary-dark: #8696ad; --primary-soft: #1b1f26; --accent2: #5b6b80; }
    body.tema-cobalto   { --primary: #8fa5e0; --primary-dark: #6b85cc; --primary-soft: #151a2e; --accent2: #3f56a3; }
    body.tema-cafe      { --primary: #c4a68c; --primary-dark: #a8886d; --primary-soft: #241d17; --accent2: #7a5f47; }
  }
  .theme-toggle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); background: linear-gradient(135deg, var(--primary), var(--accent2)); padding: 0; flex: 0 0 auto; cursor: pointer; transition: transform .12s; }
  .theme-toggle:hover { transform: scale(1.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  /* O Safari do iPhone aumenta sozinho a letra de blocos largos com pouco texto («text
     autosizing»). Era por isso que a linha do mês nas recorrentes — uma célula sozinha a
     atravessar a tabela toda — aparecia maior num orçamento do que noutro: o aumento depende
     da largura da tabela, que muda com o tamanho dos nomes lá dentro. Com isto, 11px são
     sempre 11px. Não impede o utilizador de aumentar o texto — só impede o Safari de o fazer
     por conta própria. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

  /* Barra lateral */
  .sidebar {
    background: var(--sidebar);
    color: var(--sidebar-text);
    display: flex; flex-direction: column;
    padding: 16px 0; gap: 4px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; margin: 0 6px 4px; width: calc(100% - 12px);
    background: transparent; border: 0; border-radius: 9px; cursor: pointer; text-align: start; color: inherit; }
  .brand:hover { background: rgba(255,255,255,.06); }
  .brand h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--accent2)); display: grid; place-items: center; font-size: 18px; }
  .brand h1 { font-size: 16px; margin: 0; color: var(--sidebar-text-strong); font-weight: 700; letter-spacing: .2px; }
  .brand small { display: block; font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .nav { padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: start;
    background: transparent; border: 0; color: var(--sidebar-text);
    padding: 9px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px;
  }
  .nav button .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }
  .nav button.active { background: var(--primary); color: #fff; }
  .side-section { padding: 14px 20px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .side-accounts { padding: 2px 12px; display: flex; flex-direction: column; gap: 1px; }
  .side-acc { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 7px; background: transparent; border: 0; color: var(--sidebar-text); width: 100%; text-align: start; }
  .side-acc:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }
  .side-acc .nm { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-acc .bal { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .side-acc .bal.neg { color: var(--negative); }
  .side-total { padding: 8px 24px; font-size: 12px; display:flex; justify-content: space-between; color: var(--sidebar-text); border-top: 1px solid rgba(255,255,255,.06); margin-top: 6px; }
  .side-total b { color: var(--sidebar-text-strong); font-variant-numeric: tabular-nums; }
  .add-acc { margin: 8px 16px; padding: 8px; border: 1px dashed rgba(255,255,255,.2); background: transparent; color: var(--sidebar-text); border-radius: 8px; font-weight: 600; font-size: 12.5px; }
  .add-acc:hover { border-color: var(--primary); color: #fff; }
  .side-footer { margin-top: auto; padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 4px; }
  /* Uma linha só, sempre — o ponto de aviso não pode empurrar o texto para baixo. */
  .side-footer button { background: transparent; border: 0; color: var(--sidebar-text); text-align: start; padding: 7px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; display:flex; align-items:center; gap:9px; white-space: nowrap; overflow: hidden; }
  /* Largura fixa para o ícone: os emojis têm larguras diferentes e desalinhavam os rótulos. */
  .side-footer button > span:first-child { flex: 0 0 20px; text-align: center; }
  .side-footer button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }

  /* Zona principal */
  .main { padding: 0; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 26px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  .view-title { font-size: 19px; font-weight: 700; margin: 0; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav button.arrow { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 16px; display: grid; place-items: center; }
  .month-nav button.arrow:hover { background: var(--surface-2); border-color: var(--primary); }
  .month-nav .month-label { font-weight: 700; font-size: 15px; min-width: 150px; text-align: center; }
  .month-nav .today-btn { font-size: 12px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 600; }

  .rta-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 20px 26px 0; padding: 16px 22px; border-radius: 14px; background: var(--primary); color: #fff; box-shadow: var(--shadow); flex-wrap: wrap; }
  .rta-banner.zero { background: linear-gradient(135deg, var(--primary), var(--accent2)); }
  .rta-banner.over { background: linear-gradient(135deg, #b91c1c, #dc2626); }
  .rta-amount { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .rta-label { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .rta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .rta-actions button { background: rgba(255,255,255,.94); color: var(--primary-dark); border: 1px solid transparent; padding: 8px 13px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
  .rta-actions button:hover { background: #fff; }

  /* Aviso de divergência entre o orçamento e o dinheiro real nas contas */
  .integrity-bar { display: flex; align-items: center; gap: 12px; margin: 10px 26px 0; padding: 11px 16px; border-radius: 12px; background: var(--warning-soft); border: 1px solid var(--warning); color: var(--warning); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .integrity-bar .grow { flex: 1; min-width: 170px; }
  .integrity-bar button { background: var(--surface); border: 1px solid var(--warning); color: var(--warning); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .integrity-bar button:hover { background: var(--warning); color: #fff; }
  .upcoming-bar { display: flex; align-items: center; gap: 12px; margin: 10px 26px 0; padding: 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .upcoming-bar .grow { flex: 1; min-width: 170px; }
  .upcoming-bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .upcoming-bar button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .upcoming-bar button:hover { border-color: var(--primary); color: var(--primary); }
  /* Lista dos movimentos recentes, dentro da janela. */
  .moves-list { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .move-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  .move-row:last-child { border-bottom: 0; }
  .move-row .m-desc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .move-row .m-amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .move-row .m-time { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .overspent-bar { display: flex; align-items: center; gap: 12px; margin: 10px 26px 0; padding: 11px 16px; border-radius: 12px; background: var(--negative-soft); border: 1px solid var(--negative); color: var(--negative); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .overspent-bar .grow { flex: 1; min-width: 170px; }
  .overspent-bar b { font-variant-numeric: tabular-nums; }
  .overspent-bar button { background: var(--surface); border: 1px solid var(--negative); color: var(--negative); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .overspent-bar button:hover { background: var(--negative); color: #fff; }
  .int-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .int-row .who { min-width: 0; }
  .int-row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A descrição por baixo do nome tem de caber SEMPRE numa linha: partida em duas, a linha do
     beneficiário ficava com o dobro da altura e a lista perdia o alinhamento. Corta com "…". */
  .int-row .who .tag { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .int-row .amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  /* Os dois botões de cada beneficiário, lado a lado e sempre na mesma linha. */
  .py-acoes { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  /* Botões só de ícone: quadrados e com área de toque suficiente para o dedo. */
  .btn.sm.py-ico { padding: 7px 10px; font-size: 15px; line-height: 1; }

  .content { padding: 20px 26px 60px; }

  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 15px; border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--surface-2); border-color: var(--primary); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn:disabled:hover { background: var(--surface); border-color: var(--border); }
  .undo-redo { display: inline-flex; gap: 4px; }
  .undo-redo .btn { padding: 6px 10px; font-size: 14px; line-height: 1; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--negative); border-color: var(--negative-soft); }
  .btn.danger:hover { background: var(--negative-soft); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  /* Blocos da barra de filtros: cada um fica inteiro, e a quebra dá-se só ENTRE eles. */
  /* Encolhimento por degraus: quando a barra não cabe numa linha, vai-se tirando o texto pela
     ordem em que ele faz menos falta: 1) a prioridade (▲ ● ▼ dizem-se sozinhos); 2) o Limpar
     (o ✕ é universal); 3) os dois botões de ação (o ➕ em destaque no canto é inconfundível);
     4) os filtros de estado — 💰 e 🔵 são os que mais precisam do nome; 5) e por fim os rótulos
     «Mostrar:» e «Prioridade:», que só nomeiam grupos já separados por uma barra vertical.
     Esgotados os degraus, a janela já é estreita ao ponto de a vista passar à de telemóvel —
     onde não há barra lateral e sobram 250 px. Só assim se evita a quebra em duas linhas. */
  .toolbar.enc1 .f-prio .rot,
  .toolbar.enc2 .btn-limpar .rot,
  .toolbar.enc3 .tb-acao .rot,
  .toolbar.enc4 .f-estado .rot,
  .toolbar.enc5 .tb-etiq { display: none; }
  .toolbar.enc1 .f-prio + .f-prio { margin-inline-start: -2px; }
  /* Só durante a medição: sem quebra e sem encolher, para a largura natural ser a verdadeira. */
  .toolbar.medindo { flex-wrap: nowrap; }
  .toolbar.medindo .tb-bloco, .toolbar.medindo .tb-bloco > * { flex-shrink: 0; }
  /* Chapeu da conta, por cima da barra de filtros: identifica a conta e junta as accoes que
     so existem dentro de uma. Sem margem em baixo — cola-se à barra de filtros, para se ler
     como um bloco só. */
  /* Os três andares do ecrã Transações colam-se uns aos outros: lidos de cima a baixo são
     um bloco só (que conta → o que posso fazer → o que estou a ver), e não três barras soltas. */
  .toolbar.acc-head { margin-bottom: 10px; }
  /* Linha de resumo, colada à lista: o que a conta tem à esquerda, o que falta acertar e
     quantas linhas estão à vista à direita. Uma linha para os números todos, em vez de três
     bocados espalhados por barras diferentes. */
  .tx-resumo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    flex-wrap: wrap; font-size: 12.5px; margin: 0 2px 8px; }
  .tx-resumo > span:last-child { margin-inline-start: auto; white-space: nowrap; }
  .toolbar.acc-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .toolbar.acc-acoes { margin-bottom: 10px; }
  /* A procura cresce para o espaço que sobra: o texto do campo estava a ser cortado a meio
     («Procurar beneficiário ou n»), e um campo que não cabe não consegue dizer o que faz. */
  .toolbar.tx-filtros .search-wrap { flex: 1 1 240px; min-width: 150px; max-width: 380px; }
  .toolbar .tb-bloco { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0; }
  .toolbar .tb-fim { flex: 1 1 auto; }   /* cresce para empurrar a contagem para a direita */
  .toolbar .spacer { flex: 1; }
  /* O ✕ vive DENTRO da caixa de procura, encostado à direita e por cima do texto. O espaço
     à direita do campo é reservado para ele quando aparece, para nunca tapar o que se escreveu. */
  .search-wrap { position: relative; display: inline-flex; align-items: center; min-width: 0; }
  .search-wrap .search { width: 100%; padding-inline-end: 30px; }
  .search-x { position: absolute; inset-inline-end: 6px; border: 0; background: transparent; cursor: pointer;
    color: var(--text-muted); font-size: 13px; line-height: 1; padding: 5px 6px; border-radius: 6px; }
  .search-x:hover { background: var(--surface-2); color: var(--text); }
  .search { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); min-width: 180px; }
  select.filter, input.filter { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-weight: 600; }

  /* Tabela do orçamento */
  .budget-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow); }
  table.budget { width: 100%; border-collapse: collapse; }
  table.budget thead th { text-align: end; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  table.budget thead th.first { text-align: start; }
  table.budget tr.tot-row td { text-align: end; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 6px 10px 9px; border-bottom: 2px solid var(--border); color: var(--text); background: var(--surface-2); }
  table.budget tr.tot-row td.first { text-align: start; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
  table.budget tr.tot-row td.pos { color: var(--positive); }
  table.budget tr.tot-row td.neg { color: var(--negative); }
  table.budget tr.tot-row .tag { font-weight: 600; }

  .grp-row td { padding: 11px 18px; background: var(--group-row); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); font-weight: 700; }
  .grp-row .grp-name { display: flex; align-items: center; gap: 9px; }
  .grp-row .grp-name .caret { transition: transform .15s; color: var(--text-muted); font-size: 12px; }
  /* Um <button> centra o texto por omissão. Enquanto o nome do grupo cabe numa linha isso
     não se vê; quando quebra para duas, as linhas apareciam centradas e desalinhadas da
     lista. O alinhamento ao início arruma-as por baixo do nome. O caret sobe para o topo
     pela mesma razão: com duas linhas, centrado a meio ficava a flutuar. */
  .grp-row .grp-name button.grp-toggle { background: transparent; border: 0; display: flex;
    align-items: flex-start; gap: 9px; color: var(--text); font-weight: 700; padding: 0;
    text-align: start; }
  .grp-row .grp-name button.grp-toggle .caret { margin-top: 3px; }
  .grp-row .grp-add { font-size: 11.5px; color: var(--primary); font-weight: 600; background: transparent; border: 0; opacity: 0; }
  .grp-row:hover .grp-add { opacity: 1; }
  .grp-total { text-align: end; font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 600; }

  tr.cat-row td { padding: 9px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.cat-row:hover { background: var(--surface-2); }
  tr.cat-row:last-child td { border-bottom: 0; }
  .cat-name-cell { display: flex; align-items: center; gap: 10px; }
  .cat-name { font-weight: 600; }
  /* Prioridade: sempre visível e clicável (alta → normal → baixa → alta). */
  .prio-btn { flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid transparent; background: transparent; font-size: 11px; line-height: 1; display: inline-grid; place-items: center; transition: background .12s, border-color .12s; }
  .prio-btn:hover { border-color: var(--border); background: var(--surface-2); }
  /* Escala tipo semáforo. Verde/vermelho vêm de --positive/--negative (e não de --primary),
     para se manterem iguais nos dois temas e não se confundirem com o rosa. */
  .prio-btn.p-alta { color: var(--positive); font-size: 12px; }
  .prio-btn.p-normal { color: var(--text-muted); opacity: .4; }
  .prio-btn.p-baixa { color: var(--negative); font-size: 12px; }
  .cat-name-cell .cat-actions { display: flex; gap: 4px; opacity: 0; }
  tr.cat-row:hover .cat-actions { opacity: 1; }
  .cat-actions button { background: transparent; border: 0; color: var(--text-muted); font-size: 13px; padding: 2px 5px; border-radius: 5px; }
  .cat-actions button:hover { background: var(--neutral-soft); color: var(--text); }
  /* Ocupa toda a largura da coluna da categoria, em qualquer ecrã. */
  .pend { color: var(--warning); }
  .date-field { position: relative; display: inline-flex; align-items: center; width: 100%; }
  .date-txt { width: 100%; padding-inline-end: 34px !important; font-variant-numeric: tabular-nums; }
  .date-txt.erro { border-color: var(--negative); }
  /* O <input type="date"> nativo fica por cima da zona do 📅, transparente mas a receber toques:
     assim um toque no telemóvel abre o calendário nativo com gesto real (o caminho fiável no iOS),
     e a parte esquerda do campo continua livre para escrever a data à mão em dd/mm/aaaa. */
  .date-nat { position: absolute; inset-inline-end: 0; top: 0; width: 42px; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; z-index: 2; -webkit-appearance: none; appearance: none; }
  .date-btn { position: absolute; inset-inline-end: 3px; background: none; border: 0; font-size: 15px; line-height: 1; padding: 4px 5px; border-radius: 6px; pointer-events: none; z-index: 1; color: var(--text-muted); }
  .toolbar .date-field { width: auto; }
  .toolbar .date-txt { width: 128px; }
  .op-intro { margin: 0 0 12px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .op-fluxo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 9px 0 6px; font-weight: 700; font-size: 12.5px; color: var(--text); }
  .op-fluxo > span:not(.seta) { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 3px 9px; }
  .op-fluxo .seta { color: var(--primary); font-size: 15px; }
  .op-nota { display: block; font-size: 12px; }
  .op-kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; text-align: center; }
  .op-kpi { padding: 12px 8px; }
  .cov-sum { padding: 9px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .cov-list { max-height: 300px; overflow: auto; }
  .cov-row { display: grid; grid-template-columns: 1fr 132px 84px; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--border); }
  .cov-row > * { min-width: 0; }
  .cov-nome { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  .cov-nome .tag { display: block; }
  .cov-val { text-align: end; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .cov-slider { width: 100%; accent-color: var(--primary); height: 26px; }
  .prio-dot { font-size: 10px; }
  .prio-dot.p-alta { color: var(--negative); } .prio-dot.p-normal { color: var(--text-muted); } .prio-dot.p-baixa { color: var(--primary); }
  .target-bar { height: 5px; border-radius: 4px; background: var(--neutral-soft); margin-top: 5px; overflow: hidden; width: 100%; }
  .target-bar > span { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .18s, background .18s; }
  /* Verde é «está a cumprir» — a largura da barra é que diz se já lá chegou.
     Dois verdes diferentes para «cumprido» e «a caminho» só levantavam a dúvida
     de qual era qual, quando a própria barra e a legenda já o dizem. */
  .target-bar > span.full,
  .target-bar > span.ok   { background: var(--positive); }
  .target-bar > span.warn { background: var(--warning); }    /* abaixo do alvo */
  .target-bar > span.neg  { background: var(--negative); }   /* excesso (negativo) */
  .target-bar > span.snoozed { background: var(--text-muted); opacity: .5; }   /* adiado este mês */
  tr[data-drag] { cursor: grab; }
  tr[data-drag]:active { cursor: grabbing; }
  tr.drag-over td { box-shadow: inset 0 2px 0 var(--primary); background: var(--primary-soft); }
  .btn.f-warn.active { background: var(--warning-soft); border-color: var(--warning); color: var(--warning); }
  .btn.f-neg.active  { background: var(--negative-soft); border-color: var(--negative); color: var(--negative); }
  .btn.f-ok.active   { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
  .btn.f-money.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .btn.f-over.active  { background: var(--info-soft); border-color: var(--info); color: var(--info); }
  /* Adiada é um estado em pausa, não um alerta: tom neutro, sem a carga das outras cores. */
  .btn.f-snoozed.active { background: var(--neutral-soft); border-color: var(--text-muted); color: var(--text); }
  .btn.f-alta.active   { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
  .btn.f-normal.active { background: var(--neutral-soft); border-color: var(--text-muted); color: var(--text); }
  .btn.f-baixa.active  { background: var(--negative-soft); border-color: var(--negative); color: var(--negative); }
  /* Separador de mês nas listas: só para dar respiro à leitura. Não é clicável nem conta para nada. */
  table.data tr.mes-sep td { background: var(--surface-2); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted);
    padding: 7px 16px; border-top: 1px solid var(--border); }
  table.data tr.mes-sep:first-child td { border-top: 0; }
  .toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .target-note { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  /* Os montantes nunca partem de linha — era o que atirava o «€» para baixo. */
  .num, .grp-total, .activity-cell, .avail-pill { white-space: nowrap; }
  table.budget td.num, table.budget th:not(.first) { width: 1%; }   /* colunas de valores: só o necessário */
  table.budget td:first-child, table.budget th.first { width: auto; }
  .num { text-align: end; font-variant-numeric: tabular-nums; }
  /* Tem de parecer um campo mesmo sem lhe passar o rato por cima — no telemóvel não há rato. */
  .assign-input { width: 108px; text-align: end; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .assign-input:hover { border-color: var(--primary); background: var(--surface); }
  .assign-input:focus { border-color: var(--primary); background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
  .assign-input.kp-active { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }
  /* Mini-teclado de cálculo próprio */
  /* Resultado da conta escrita no próprio campo ("120+35" mostra "= 155,00" por baixo). */
  /* Campo de dinheiro em "só leitura" no telemóvel: quem escreve é o teclado próprio. Não pode
     parecer desativado nem mostrar o cursor de texto — é um campo normal que se toca. */
  .money[readonly] { opacity: 1; cursor: pointer; caret-color: transparent; }
  /* Pontinho de estado de uma conta: verde = a par do banco; âmbar = há coisas por confirmar
     (informação, não aviso). Tamanho fixo e pequeno para não roubar largura à tabela. */
  .pt-conf { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 6px;
    vertical-align: baseline; flex: 0 0 auto; }
  .pt-conf.ok { background: var(--positive); }
  .pt-conf.pend { background: #d9a441; }
  .side-acc .pt-conf { margin-inline-end: 7px; }
  .t-curto { display: none; }
  .calc-hint { position: fixed; z-index: 260; pointer-events: none; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--primary); border-radius: 7px; padding: 3px 8px;
    font-size: 12.5px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow-lg); }
  .money.kp-active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  /* Espaço no fundo das janelas para o teclado não tapar o campo que se está a preencher. */
  body.kp-aberto .modal-overlay { padding-bottom: 300px; }
  .calcpad { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%) translateY(110%); width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.22); z-index: 250; transition: transform .2s ease; padding: 10px 10px calc(12px + env(safe-area-inset-bottom)); }
  .calcpad.show { transform: translateX(-50%) translateY(0); }
  /* Véu do teclado: sinal visual de que é no teclado que se decide. Deixa passar os toques
     (pointer-events:none) — quem os trata é o guarda em JS, que precisa de deixar passar os
     saltos para outro campo de dinheiro. */
  body.kp-veu::after { content: ""; position: fixed; inset: 0; z-index: 249; pointer-events: none;
    background: rgba(0,0,0,.16); animation: kpFade .18s ease; }
  @keyframes kpFade { from { opacity: 0; } to { opacity: 1; } }
  .calc-head { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; }
  .calc-disp { flex: 1; text-align: end; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calc-close { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); width: 34px; height: 34px; border-radius: 9px; font-size: 20px; line-height: 1; cursor: pointer; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-key { padding: 15px 0; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); color: var(--text); font-size: 19px; font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .calc-key:active { background: var(--primary-soft); border-color: var(--primary); }
  .calc-key.op { background: var(--surface); color: var(--primary); }
  .calc-key.ok { background: var(--primary); color: #fff; border-color: var(--primary); }
  .calc-key.ok:active { opacity: .85; }
  .activity-cell { color: var(--text-muted); }
  .avail-pill { display: inline-block; padding: 4px 11px; border-radius: 20px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .avail-pill.pos { background: var(--positive-soft); color: var(--positive); }
  .avail-pill.zero { background: var(--neutral-soft); color: var(--text-muted); }
  .avail-pill.neg { background: var(--negative-soft); color: var(--negative); }
  .avail-pill.warn { background: var(--warning-soft); color: var(--warning); }

  /* Tabela genérica (transações / contas) */
  /* NO COMPUTADOR a tabela cabe na largura, por isso o cartão não precisa de deslizar para o
     lado. Sem ser uma zona de deslize, o cabeçalho pode colar-se à PÁGINA — é o comportamento
     natural, sem caixas dentro de caixas. O `clip` recorta os cantos arredondados sem criar
     essa zona de deslize (ao contrário de `hidden`, que a criaria e estragaria tudo). */
  .data-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: clip; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow); }
  /* O cabeçalho pára logo abaixo da barra de cima, cuja altura é medida e guardada em --topo. */
  table.data thead th { position: sticky; top: var(--topo, 64px); z-index: 6; }
  table.data { width: 100%; border-collapse: collapse; }
  table.data th { text-align: start; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
  table.data td { padding: 10px 16px; vertical-align: middle; }
  /* O separador vive na LINHA, não em cada célula — assim não pode ficar aos degraus. */
  table.data tbody tr { border-bottom: 1px solid var(--border); }
  /* Nada parte de linha: com alturas iguais, as linhas ficam sempre direitas em qualquer largura. */
  table.data td, table.data th { white-space: nowrap; }
  table.data tbody tr:last-child { border-bottom: 0; }
  table.data tbody tr:hover, table.data tr.hoverable:hover { background: var(--surface-2); }
  /* A nota nunca empurra as outras colunas: tem um tecto próprio e corta com «…». */
  table.data td.col-nota { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  /* Nota por baixo do beneficiário. No computador não aparece — a nota tem coluna própria e
     mostrá-la duas vezes só roubava altura à lista. */
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
  .pill.budget { background: var(--primary-soft); color: var(--primary-dark); }
  .pill.tracking { background: var(--neutral-soft); color: var(--text-muted); }
  .pill.credit { background: var(--warning-soft); color: var(--warning); }
  .cleared-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; display: inline-grid; place-items: center; font-size: 11px; color: transparent; }
  .cleared-dot.on { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
  .tx-amt.out { color: var(--negative); font-weight: 600; }
  .tx-amt.in { color: var(--positive); font-weight: 600; }
  .muted { color: var(--text-muted); }
  .tag { font-size: 11.5px; color: var(--text-muted); }
  /* Um td com display:flex deixa de se comportar como célula de tabela e ignora o
     vertical-align da linha — era por isso que estes botões ficavam colados ao topo.
     Com o flex a centrar, voltam ao meio da linha como tudo o resto. */
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
  /* A margem negativa devolve à linha a altura que o padding destes botões lhe acrescentava: a
     zona de toque mantém-se, mas a linha deixa de crescer por causa deles. */
  .row-actions button { background: transparent; border: 0; color: var(--text-muted); padding: 4px 6px; margin: -4px 0; border-radius: 6px; font-size: 13px; line-height: 1.3; }
  .row-actions button:hover { background: var(--neutral-soft); color: var(--text); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .empty h3 { margin: 0 0 6px; color: var(--text); }

  /* Cartões de indicadores */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi .k-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; }
  .kpi .k-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 6px; letter-spacing: -.5px; }
  .kpi .k-value.pos { color: var(--positive); }
  .kpi .k-value.neg { color: var(--negative); }
  /* Nas janelas o espaço é a três colunas: o valor tem de caber sem partir a linha. */
  .op-kpi { padding: 12px 6px; }
  .op-kpi .k-label { font-size: 10px; }
  .op-kpi .k-value { font-size: 15px; letter-spacing: -.3px; white-space: nowrap; margin-top: 4px; }

  /* Barras dos relatórios */
  .report-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .report-block h3 { margin: 0 0 16px; font-size: 15px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 90px; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row .b-name { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--surface-2); border-radius: 6px; height: 22px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--accent2)); min-width: 2px; }
  /* Valor dentro da barra. O halo na cor do cartão mantém-no legível por cima do
     preenchimento ou fora dele, sem depender de a barra ser clara ou escura. */
  .bar-num { position: absolute; inset-inline-end: 7px; top: 0; line-height: 22px; font-size: 11px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--text); pointer-events: none;
    text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 2px var(--surface); }
  .bar-val { text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; }
  .rep-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .rep-chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; }
  .rep-chip:hover { border-color: var(--primary); color: var(--text); }
  .evo-host { min-height: 220px; }
  .evo-pt { cursor: pointer; }
  .chart-tip { position: fixed; z-index: 300; background: var(--sidebar); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; pointer-events: none; opacity: 0; white-space: nowrap; box-shadow: var(--shadow-lg); transition: opacity .1s; }
  .chart-tip.show { opacity: 1; }

  /* Janelas */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 460px; overflow: hidden; animation: pop .16s ease; }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h2 { margin: 0; font-size: 16.5px; }
  .modal-head button.x { background: transparent; border: 0; font-size: 20px; color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; }
  .modal-head button.x:hover { background: var(--surface-2); color: var(--text); }
  .modal-body { padding: 20px 22px; }
  .modal-foot { flex-wrap: wrap; padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .field { margin-bottom: 14px; }
  /* Uma etiqueta de OPÇÃO (a que acompanha uma caixa de seleção) é uma frase que se lê, não o
     título de um campo: sem maiúsculas nem letras espaçadas, que a fariam ocupar o dobro e
     partir-se em duas linhas dentro das janelas. */
  .opcao { display: flex !important; font-size: 13px; font-weight: 600; color: var(--text);
    text-transform: none !important; letter-spacing: normal !important; margin-bottom: 0 !important; line-height: 1.35; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  /* Autocomplete de beneficiários — dropdown próprio (o <datalist> não funciona no Safari iOS). */
  .ac-wrap { position: relative; }
  .ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 244px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ac-item { padding: 10px 12px; font-size: 13.5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .ac-item:last-child { border-bottom: 0; }
  .ac-item.active, .ac-item:hover { background: var(--primary-soft); }
  .ac-item .ac-cat { font-size: 11.5px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .ac-item.ac-new { color: var(--primary); font-weight: 600; }
  /* Seleção temporária de transações (só visual): checkbox por linha + barra de somatório. */
  .tx-selcell { display: inline-flex; align-items: center; margin-inline-end: 8px; vertical-align: middle; cursor: pointer; }
  /* A caixa do cabeçalho fica na mesma célula da coluna Data, alinhada com as das linhas. */
  table.data th .tx-selcell { margin-inline-end: 8px; }
  .tx-sel-all { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); margin: 0; }
  .tx-sel { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); margin: 0; }
  .tx-sel-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 90; display: none; align-items: center; gap: 8px 14px; flex-wrap: wrap; justify-content: center; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); border-radius: 12px; padding: 10px 16px; font-size: 13px; max-width: calc(100% - 24px); }
  .tx-sel-bar.show { display: flex; }
  .tx-sel-bar b { font-variant-numeric: tabular-nums; }
  .tx-sel-bar .txsel-clear { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .tx-sel-bar .txsel-clear:hover { border-color: var(--primary); color: var(--primary); }
  .field .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  /* Nas Definições as cores levam a linha toda: oito bolas não cabem ao lado da moeda sem a
     espremer, e espalhadas por toda a largura acabam com o vazio que ficava à direita. */
  .grid-def { grid-template-columns: 1fr; }
  /* Bolinhas das cores. A escolhida leva um anel por fora — uma marca por dentro tapava
     precisamente a cor que se está a mostrar. */
  /* Uma fila só, sempre — nunca uma lista que se parte quando não cabe. Oito bolas de 28 com
     8 de intervalo pedem 280px: cabem na largura da janela mesmo no iPhone mais estreito, mas
     já não caberiam ao lado da moeda. Por isso as cores levam a linha toda e a moeda vem por
     baixo — assim a moeda também deixa de estar apertada. As bolas espalham-se pela linha em
     vez de se amontoarem à esquerda, que era o vazio que se notava. */
  .cores { display: grid; grid-template-columns: repeat(8, 28px); gap: 8px;
           justify-content: space-between; padding: 2px 0; }
  .cor-bola { width: 28px; height: 28px; }
  .cor-bola { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0; transition: transform .12s; }
  .cor-bola:hover { transform: scale(1.12); }
  .cor-bola.sel { box-shadow: 0 0 0 2px var(--text); }
  .split-line select, .split-line input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); }
  .split-line select:focus, .split-line input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 9px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; font-weight: 600; color: var(--text-muted); }
  .seg button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .help-list { font-size: 13px; color: var(--text-muted); }
  .help-list li { margin-bottom: 9px; }
  .help-list b { color: var(--text); }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--sidebar); color: #fff; padding: 12px 20px; border-radius: 10px; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 13px; opacity: 0; transition: all .25s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .undo-bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(30px); background: var(--sidebar); color: #fff; padding: 8px 10px 8px 16px; border-radius: 11px; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 14px; opacity: 0; transition: all .25s; z-index: 210; pointer-events: none; }
  .undo-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .undo-bar .btn { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .undo-bar .btn:hover { background: rgba(255,255,255,.32); }
  .backup-bar { z-index: 205; max-width: calc(100vw - 24px); flex-wrap: wrap; }
  .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--warning); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 1; margin-inline-start: 5px; vertical-align: middle; box-sizing: border-box; }
  .count-badge:empty { min-width: 0; width: 7px; height: 7px; padding: 0; border-radius: 50%; }
  .count-badge.corner { position: absolute; top: -5px; inset-inline-end: -5px; margin: 0; box-shadow: 0 0 0 2px var(--surface); }

  .hidden { display: none !important; }
  .mobile-only { display: none; }
  /* No computador o nome do orçamento vive na barra lateral («Trocar orçamento ▾»), por isso o
     chip do cabeçalho é só de telemóvel — como o resto do bloco .topbar-actions. */
  .bud-chip #budNameM, .bud-chip .caret { display: inline; }
  .so-fone { display: none; }
  .so-fone-btn { display: none; }
  button { -webkit-tap-highlight-color: transparent; }

  /* A vista de telemóvel — barra de navegação em baixo, sem barra lateral — entra aos 1040 px
     e não aos 820. Motivo: abaixo dos ~1040 a barra de filtros já não cabe numa linha mesmo
     depois de perder todos os textos, e passaria a duas linhas. Mudando de vista libertam-se
     os 250 px da barra lateral e ela volta a caber. Assim nunca há uma faixa de larguras em
     que a barra parta em duas. */
  @media (max-width: 1040px), (max-height: 500px) {
    .app { grid-template-columns: 1fr; }
    /* Barra lateral -> barra de navegação inferior (estilo iOS) */
    .sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      height: auto; flex-direction: row; padding: 0; gap: 0; overflow: visible;
      z-index: 60; border-top: 1px solid var(--border);
      box-shadow: 0 -2px 12px rgba(15,23,42,.12);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    .brand, .side-section, .side-accounts, .add-acc, .side-total, .side-footer { display: none; }
    .nav { flex-direction: row; width: 100%; padding: 5px 3px; gap: 0; }
    .nav button { flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 1px; font-size: 10.5px; letter-spacing: -.3px; border-radius: 9px; min-width: 0; }
    .nav button .ic { font-size: 19px; width: auto; }

    /* Cabeçalho — respeita a área segura do iPhone (notch/Dynamic Island) na aplicação instalada */
    .topbar { padding: calc(11px + env(safe-area-inset-top)) calc(13px + env(safe-area-inset-right)) 11px calc(13px + env(safe-area-inset-left)); flex-wrap: wrap; }
    /* O título do ecrã sai: a barra de baixo já diz onde se está, com o separador aceso —
       e era a peça mais larga da fila de cima. A cor da aplicação também: escolhe-se uma vez
       e passou para «Dados e cópias → Definições», onde vivem as outras preferências. O que
       fica no cabeçalho é só o que se usa todos os dias. */
    .view-title { display: none; }
    .theme-toggle { display: none; }
    .mobile-only { display: flex; }
    .topbar-actions { order: 1; flex: 1 1 auto; min-width: 0; }
    .undo-redo { order: 2; }
    /* O nome do orçamento encosta à esquerda e empurra os ícones todos para a direita. */
    .topbar-actions .bud-chip { margin-inline-end: auto; }
    /* Botões do cabeçalho. O que o polegar sente é sobretudo a ALTURA — acerta-se numa
       banda horizontal, não num quadrado. Por isso mantêm-se os 44px de altura que a Apple
       recomenda e estreita-se a largura: é assim que os sete cabem numa linha, com o nome do
       orçamento à vista. A área sensível estende-se depois 3px para cada lado (metade do
       intervalo, para nunca invadir o botão vizinho), ficando maior do que o botão parece. */
    .topbar-actions .btn, .undo-redo .btn { padding: 10px 8px; min-height: 44px; position: relative; }
    .topbar-actions .btn::after, .undo-redo .btn::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -3px; right: -3px; }
    .undo-redo { gap: 6px; }
    .topbar-actions { gap: 6px; }
    .topbar { gap: 10px; }
    /* O botão de trocar de orçamento diz o nome do orçamento aberto, com seta: um ícone sozinho
       não se percebia. O nome encolhe até caber e corta com «vâo…» — são os outros botões, de
       largura fixa, que mandam. Assim a barra nunca parte por causa de um nome comprido. */
    .topbar-actions .bud-chip {
      display: inline-flex; align-items: center; gap: 5px; min-width: 0; flex: 0 1 auto;
      max-width: 46vw; min-width: 74px; padding-inline: 10px; font-weight: 600;
    }
    .topbar-actions .bud-chip #budNameM {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .topbar-actions .bud-chip .caret { opacity: .55; flex: none; }
    .topbar-actions .btn:not(.bud-chip) { flex: none; }
    .month-nav { order: 3; width: 100%; justify-content: center; margin-top: 8px; }
    .month-nav .month-label { min-width: 120px; }

    /* Conteúdo com espaço para a barra inferior + área segura do iPhone */
    .content { padding: 16px calc(13px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(13px + env(safe-area-inset-left)); }
    .rta-banner { margin: 14px 13px 0; padding: 14px 16px; }
    .integrity-bar, .upcoming-bar, .overspent-bar { margin: 10px 13px 0; }
    .rta-amount { font-size: 22px; }

    /* Safari faz zoom ao focar qualquer campo com menos de 16px.
       A regra é deliberadamente abrangente para não escapar nenhum campo novo. */
    input, select, textarea, .assign-input { font-size: 16px; }

    /* Orçamento compacto; ações sempre visíveis (não há hover no toque) */
    table.budget thead th, .grp-row td, tr.cat-row td { padding: 8px 6px; }
    table.budget tr.tot-row td { font-size: 12.5px; padding: 6px 5px; }
    table.budget tr.tot-row td.first { font-size: 11px; }
    .cat-actions, .grp-add { opacity: 1 !important; }
    .cat-name-cell { flex-wrap: wrap; gap: 6px; }
    .assign-input { width: 82px; padding: 6px; }
    .activity-cell, .grp-total { font-size: 12.5px; }
    .avail-pill { padding: 4px 8px; }

    /* Escondido no telemóvel: já existe noutro sítio, ou não cabe. */
    .hide-phone { display: none !important; }
    .so-fone { display: inline; }
    .so-fone-btn { display: inline-flex; }

    /* Campos de data: o iOS dá-lhes largura própria e centra o texto, o que os fazia
       transbordar da coluna e encavalitar no campo do lado. */
    input[type="date"], input[type="month"] {
      -webkit-appearance: none; appearance: none;
      min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box;
      text-align: start; line-height: 1.35; height: auto;
    }
    .grid-2 > *, .toolbar > *, .split-line > * { min-width: 0; }

    /* Lista de transações: a nota vai quase sempre vazia e roubava largura, e o texto
       a partir em duas linhas deixava as alturas das linhas todas diferentes. */
    /* A nota tem coluna própria também no telemóvel, mas estreita: dá para perceber do que
       se trata, e o resto lê-se abrindo a transação. O limite em píxeis é o que garante o
       corte — sem ele a coluna esticava até caber a nota inteira e empurrava tudo o resto. */
    /* Menos uma coluna deu espaço à nota: cabe agora bastante mais texto antes de cortar. */
    table.data td.col-nota { max-width: 150px; }
    /* Na tabela das contas de ORÇAMENTO a coluna Tipo diz sempre «Orçamento» — o mesmo que o
       título da secção. Esconde-se, e nas outras contas fica a forma curta: o espaço ganho é
       muito maior do que o pontinho de estado ocupa, por isso a vista continua a caber sem
       deslizar para o lado. */
    /* NO TELEMÓVEL a tabela não cabe na largura: o cartão TEM de deslizar para o lado, e um
       elemento que desliza não deixa nada colar-se à página. Então é o próprio cartão que passa
       a deslizar também na vertical, e o cabeçalho cola-se ao topo DELE. A lista passa a correr
       dentro do cartão em vez de a página inteira correr — é a diferença que se nota. */
    .data-card { overflow: auto; max-height: calc(100dvh - var(--carta, 232px)); }
    table.data thead th { top: 0; }
    .sem-tipo .col-tipo { display: none !important; }
    .t-longo { display: none; }
    .t-curto { display: inline; }
    /* Área de toque maior nas caixas de seleção (a caixa continua com o mesmo tamanho, o que
       cresce é a zona sensível à volta) — 16px são difíceis de acertar com o dedo. */
    /* Mesma ideia: a área de toque continua grande (o padding fica), mas a margem negativa
       impede que ela estique a linha — eram 20px a mais por transação. */
    .tx-selcell { padding: 10px 8px 10px 2px; margin: -10px 2px -10px 0; }
    .tx-sel, .tx-sel-all { width: 19px; height: 19px; }
    /* No telemóvel nem um bloco inteiro cabe numa linha: aqui deixa-se partir por dentro,
       senão transbordava para fora do ecrã. */
    .toolbar .tb-bloco { flex-wrap: wrap; }
    /* Sem uma conta aberta, nesta fila só há o «Nova transação» e o exportar — e ambos são
       de computador (no telemóvel o ➕ está no cabeçalho). Ficava uma fila vazia a ocupar
       altura, por isso só aparece quando tem de facto botões: dentro de uma conta. */
    .toolbar.acc-acoes { display: none; }
    .toolbar.acc-acoes.tem-conta { display: flex; }
    .toolbar .tb-fim .sep { display: none; }   /* barras verticais: não há espaço para separadores */
    /* No telemóvel o «Limpar» é o que faz a barra partir em duas linhas. Sai — desliga-se cada
       filtro com um segundo toque no próprio botão, que é o gesto que já se faz. Só no telemóvel. */
    .btn-limpar { display: none !important; }
    .btn.f-filtro { padding: 6px 9px; font-size: 13px; }
    .rot { display: none; }          /* rótulo longo: fica só o símbolo ou a forma curta */

    /* Tabelas largas (transações/contas/recorrentes) com deslize horizontal suave */
    table.data { min-width: 620px; }

    /* Modais e gráficos */
    .modal-overlay { padding: 14px 10px calc(14px + env(safe-area-inset-bottom)); align-items: flex-start; }
    .modal { max-width: 100%; }
    .toolbar { gap: 8px; }
    .toolbar .search { min-width: 140px; flex: 1; }
    .bar-row { grid-template-columns: 88px 1fr 80px; }
    .bar-val { white-space: nowrap; }
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .kpi { padding: 14px 12px; }
    .kpi .k-value { font-size: 19px; white-space: nowrap; }
    .undo-bar, .toast { bottom: calc(78px + env(safe-area-inset-bottom)); }
    /* Sem rato não há hover, e o dedo é grosso: a área sensível cresce para os 44px
       que a Apple recomenda, sem mexer no tamanho visível do botão. */
    .prio-btn, .cleared-dot, .cat-actions button, .row-actions button, .grp-add,
    .modal-head button.x, .theme-toggle, .month-nav button.arrow { position: relative; }
    /* Os que estão SOZINHOS podem crescer até aos 44px sem invadir nada. */
    .prio-btn::after, .cleared-dot::after, .grp-add::after,
    .modal-head button.x::after, .theme-toggle::after, .month-nav button.arrow::after {
      content: ""; position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
      transform: translate(-50%, -50%); }
    /* Os que estão EM FILA (duplicar/eliminar, e as ações de cada categoria) não: uma zona de
       44px em botões colados sobrepõe-se à do vizinho, e tocar entre dois acionaria o errado
       — eliminar em vez de duplicar, por exemplo. Aqui o alvo cresce em altura (onde não há
       vizinhos) e o espaço entre eles aumenta, que é o que evita mesmo os enganos. */
    .cat-actions, .row-actions { gap: 10px; }
    .cat-actions button, .row-actions button { min-height: 40px; padding-inline: 8px; }
    .btn.sm, .today-btn { min-height: 38px; }
    /* No cabeçalho vão um pouco além dos 38px do resto: são os mais usados, e são os
       únicos que se acertam com o polegar enquanto se segura o telemóvel numa mão. */
    .topbar-actions .btn, .undo-redo .btn, .bud-chip { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <button class="brand" data-action="budgets" title="Trocar ou gerir orçamentos">
      <div class="logo">💰</div>
      <div style="min-width:0;text-align:start;">
        <h1 id="budName">O Meu Orçamento</h1>
        <small>Trocar orçamento ▾</small>
      </div>
    </button>
    <nav class="nav" id="nav">
      <button data-view="budget" class="active"><span class="ic">📊</span> Orçamento</button>
      <button data-view="accounts"><span class="ic">🏦</span> Contas</button>
      <button data-view="transactions"><span class="ic">🧾</span> Transações</button>
      <button data-view="recurring"><span class="ic">📅</span> Recorrentes</button>
      <button data-view="reports"><span class="ic">📈</span> Relatórios</button>
    </nav>

    <div class="side-section"><span>Contas</span></div>
    <div class="side-accounts" id="sideAccounts"></div>
    <button class="add-acc" data-action="add-account">+ Adicionar conta</button>
    <div class="side-total"><span>Património líquido</span><b id="netWorth">—</b></div>

    <div class="side-footer">
      <button data-action="add-tx"><span>➕</span> Nova transação</button>
      <button data-action="payees"><span>🏷️</span> Beneficiários</button>
      <button data-action="data-menu" id="btnData"><span>💾</span> Dados e cópias</button>
      <button data-action="help"><span>❓</span> Como funciona</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <h2 class="view-title" id="viewTitle">Orçamento</h2>
      <div class="month-nav" id="monthNav">
        <button class="arrow" data-action="prev-month" aria-label="Mês anterior">‹</button>
        <span class="month-label" id="monthLabel">—</span>
        <button class="arrow" data-action="next-month" aria-label="Mês seguinte">›</button>
        <button class="today-btn" data-action="this-month">Hoje</button>
      </div>
      <div class="topbar-actions mobile-only">
        <button class="btn sm bud-chip" data-action="budgets" aria-label="Trocar ou gerir orçamentos" title="Trocar ou gerir orçamentos">💰<span id="budNameM">Orçamento</span><span class="caret">▾</span></button>
        <button class="btn sm" data-action="add-tx" aria-label="Nova transação">➕</button>
        <button class="btn sm" data-action="payees" aria-label="Beneficiários">🏷️</button>
        <button class="btn sm" id="btnDataM" data-action="data-menu" aria-label="Dados e cópias de segurança" style="position:relative;">💾</button>
      </div>
      <div class="undo-redo">
        <button class="btn sm" data-action="undo-do" id="btnUndo" title="Anular" aria-label="Anular">↩</button>
        <button class="btn sm" data-action="redo-do" id="btnRedo" title="Refazer" aria-label="Refazer">↪</button>
        <!-- Mesmo assunto do anular/refazer («o que é que eu andei a fazer»), por isso mesmo
             sítio. Vive no cabeçalho e não dentro do Orçamento: assim chega-se a ele de qualquer
             ecrã, e o Orçamento fica sem mais uma barra por baixo do balão. -->
        <button class="btn sm" data-action="moves" id="btnMoves" title="Movimentos recentes" aria-label="Movimentos recentes">🕑</button>
        <!-- A ajuda fecha a fila, a seguir ao anular/refazer. No computador vive na barra
             lateral, por isso aqui é só de telemóvel. -->
        <button class="btn sm so-fone-btn" data-action="help" aria-label="Como funciona">❓</button>
      </div>
      <button class="theme-toggle" data-action="toggle-theme" title="Mudar a cor da aplicação" aria-label="Mudar a cor da aplicação"></button>
    </div>

    <div id="rtaWrap"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>
<div class="chart-tip" id="chartTip"></div>
<div class="undo-bar" id="undoBar"><span id="undoText"></span><button class="btn sm" data-action="undo-do">↩ Anular</button></div>
<div class="undo-bar backup-bar" id="backupBar"><span>💾</span><span id="backupText"></span><button class="btn sm" data-action="backup-now">Guardar agora</button><button class="btn sm" data-action="backup-later">Mais tarde</button></div>

<!-- Mini-teclado de cálculo próprio para o campo "Atribuído": sem teclado nativo (logo sem letras),
     com aritmética simples (+ − =). Aparece ao tocar num campo de atribuição. -->
<div class="calcpad" id="calcPad" aria-hidden="true">
  <div class="calc-head"><span class="calc-disp" id="calcDisp">0</span><button class="calc-close" data-calc="cancel" aria-label="Fechar sem guardar">×</button></div>
  <div class="calc-grid">
    <button class="calc-key" data-calc="7">7</button><button class="calc-key" data-calc="8">8</button><button class="calc-key" data-calc="9">9</button><button class="calc-key op" data-calc="+">+</button>
    <button class="calc-key" data-calc="4">4</button><button class="calc-key" data-calc="5">5</button><button class="calc-key" data-calc="6">6</button><button class="calc-key op" data-calc="-">−</button>
    <button class="calc-key" data-calc="1">1</button><button class="calc-key" data-calc="2">2</button><button class="calc-key" data-calc="3">3</button><button class="calc-key op" data-calc="=">=</button>
    <button class="calc-key" data-calc=",">,</button><button class="calc-key" data-calc="0">0</button><button class="calc-key" data-calc="back">⌫</button><button class="calc-key ok" data-calc="ok">✓</button>
  </div>
</div>

<script>
"use strict";
(function () {
  // ---------- Constantes e auxiliares ----------
  var STORAGE_KEY = "meu-orcamento-v1";
  // Identificador deste aparelho, criado à primeira utilização e guardado só aqui. Serve para
  // saber se a última cópia de segurança foi feita NESTE aparelho ou noutro: como o carimbo da
  // cópia viaja na sincronização, sem isto o telemóvel mostrava a cópia feita no PC como se fosse
  // sua. É um código anónimo — não sai daqui a não ser dentro da cópia cifrada.
  var DEVICE_KEY = "meu-orcamento-aparelho-v1";
  var _deviceId = (function(){
    try {
      var d = localStorage.getItem(DEVICE_KEY);
      if(!d){ d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); localStorage.setItem(DEVICE_KEY, d); }
      return d;
    } catch(e){ return "d0"; }
  })();
  // Nome legível do aparelho, só para o utilizador se orientar ("neste telemóvel" vs "no PC").
  function nomeDesteAparelho(){
    try { return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? "telemóvel" : "computador"; }
    catch(e){ return "aparelho"; }
  }
  // ---------- Vários orçamentos (Pessoal, Família, …) ----------
  // Cada orçamento vive numa chave própria; `state` continua a ser SEMPRE o que está aberto,
  // por isso o resto da app não muda nada. Um índice guarda a lista e qual está ativo.
  var BUDGETS_KEY = "meu-orcamento-lista-v1";
  function novoId(){ return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function budKey(id){ return STORAGE_KEY + "::" + id; }
  function loadIndex(){ try { return JSON.parse(localStorage.getItem(BUDGETS_KEY)); } catch(e){ return null; } }
  // Trocar/criar/eliminar/renomear orçamento passa por aqui: é o momento certo para esquecer a
  // cache do estado de cópia dos OUTROS orçamentos (ver outrosPorGuardar).
  function saveIndex(ix){ try { localStorage.setItem(BUDGETS_KEY, JSON.stringify(ix)); } catch(e){} esquecerOutrosPend(); }
  var _bindex = null;   // { active:id, list:[{id,name}] }
  // Garante que há sempre pelo menos um orçamento. Migra a versão antiga (um só, na chave
  // STORAGE_KEY) para o primeiro orçamento da lista, sem perder nada.
  function ensureBudgets(){
    _bindex = loadIndex();
    if (_bindex && _bindex.list && _bindex.list.length && _bindex.active) return;
    var antigo = null;
    try { antigo = localStorage.getItem(STORAGE_KEY); } catch(e){}
    var id = novoId();
    if (antigo) {
      try { localStorage.setItem(budKey(id), antigo); localStorage.removeItem(STORAGE_KEY); } catch(e){}
    }
    _bindex = { active:id, list:[{ id:id, name:"O meu orçamento" }] };
    saveIndex(_bindex);
  }
  function budgetName(id){ for(var i=0;i<_bindex.list.length;i++) if(_bindex.list[i].id===id) return _bindex.list[i].name; return ""; }
  var INCOME = "__income__"; // identificador da categoria especial do «Pronto a atribuir»
  // Transação de "Saldo inicial": é gerada pela app ao criar uma conta com saldo. Continua a
  // financiar o orçamento e a contar no património, mas — como as transferências — não é uma
  // despesa/receita real nem um beneficiário reutilizável, por isso fica de FORA dos relatórios
  // e da lista de beneficiários. As novas levam a etiqueta opening; as antigas reconhecem-se pelo nome.
  function isOpening(t){ return !!(t && (t.opening || t.payee==="Saldo inicial")); }

  var PAGINA = 50;   // linhas por página nas listas de transações
  var MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var REPORT_COLORS = ["#0d9488","#6366f1","#f59e0b","#ef4444","#0891b2","#db2777","#65a30d","#8b5cf6"];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]); }); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function monthOf(iso) { return (iso || "").slice(0, 7); }
  function nowMonthKey() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1); }
  function monthLabel(key) { var p = key.split("-"); return MONTHS_PT[parseInt(p[1],10)-1] + " " + p[0]; }
  function shiftMonth(key, delta) {
    var p = key.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1 + delta, 1);
    return d.getFullYear() + "-" + pad(d.getMonth()+1);
  }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  // Visualização universal: "." separa milhares, "," separa cêntimos (ex.: 1.234,56 €)
  var CURRENCIES = [["EUR","€"],["GBP","£"],["USD","$"],["BRL","R$"],["CHF","CHF"],["AOA","Kz"]];
  function currencySym(){
    var c = (state && state.settings && state.settings.currency) || "EUR";
    for (var i=0;i<CURRENCIES.length;i++) if (CURRENCIES[i][0]===c) return CURRENCIES[i][1];
    return c;
  }
  function fmt(n) {
    n = round2(n || 0);
    var neg = n < 0; n = Math.abs(n);
    var s = n.toFixed(2).split(".");
    var intp = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + intp + "," + s[1] + " " + currencySym();
  }
  // Datas sempre em dd/mm/aaaa, sem depender do idioma do aparelho — era isso que fazia
  // aparecer o formato americano a quem tem o telemóvel ou o navegador em inglês.
  // (Resultados em cache: formatar linha a linha numa lista grande é caro.)
  var _dtCache = {};
  function fmtDate(iso) {
    if (_dtCache[iso] !== undefined) return _dtCache[iso];
    var p = String(iso == null ? "" : iso).split("-");
    var out = (p.length === 3 && p[0].length === 4) ? (p[2].slice(0,2) + "/" + p[1] + "/" + p[0]) : String(iso);
    _dtCache[iso] = out;
    return out;
  }
  // Data + hora curtas (dd/mm/aaaa hh:mm) a partir de um ISO — para a última sincronização.
  function fmtDateTime(iso){
    var d = new Date(iso); if (!iso || isNaN(d.getTime())) return "";
    function p2(n){ return (n<10?"0":"")+n; }
    return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes());
  }

  // ---------- Estado ----------
  var APP_VERSION = "1.52";
  // As cores da aplicação. O "id" é o que fica guardado (e sincronizado, porque as
  // definições vão no mesmo pacote dos dados); a "amostra" é só para desenhar a bolinha.
  var TEMAS = [
    { id:"petroleo",  nome:"Petróleo",  amostra:"#0e7490" },
    { id:"azul",      nome:"Azul",      amostra:"#2563eb" },
    { id:"violeta",   nome:"Violeta",   amostra:"#7c3aed" },
    { id:"ameixa",    nome:"Ameixa",    amostra:"#86198f" },
    { id:"framboesa", nome:"Framboesa", amostra:"#be185d" },
    { id:"grafite",   nome:"Grafite",   amostra:"#334155" },
    { id:"cobalto",   nome:"Cobalto",   amostra:"#1e3a8a" },
    { id:"cafe",      nome:"Café",      amostra:"#4a3728" }
  ];
  function temaAtual(){
    var t = (state.settings||{}).theme;
    for (var i=0;i<TEMAS.length;i++) if (TEMAS[i].id===t) return t;
    // Sem cor escolhida, ou com uma que já não existe: a primeira da lista. Estava aqui um
    // nome fixo («verde») que a paleta entretanto deixou de ter — e um nome que não existe não
    // corresponde a bolinha nenhuma, pelo que as Definições apareciam sem nada selecionado.
    return TEMAS[0].id;
  }
  var DEFAULT_STATE = {
    version: 1,
    settings: { locale: "pt-PT", currency: "EUR" },
    accounts: [],
    groups: [],
    categories: [],
    assignments: {},   // "idCategoria|AAAA-MM": valor
    snooze: {},        // "idCategoria|AAAA-MM": true — alvo adiado nesse mês (não pede dinheiro)
    transactions: [],
    recurring: [],     // regras recorrentes
    backup: { at:null, sig:null, autoDay:null, pend:0 },  // controlo da cópia de segurança em ficheiro (pend = alterações desde a última)
    collapsed: {},     // idGrupo: true
    moves: [],         // diário dos últimos movimentos de dinheiro entre categorias
    ui: { view: "budget", month: nowMonthKey() }
  };

  var state = load();

  // Delega no loadBudgetRaw para haver UMA só normalização/migração. Antes tinha uma cópia
  // desatualizada da lista de campos: faltavam o `snooze`, o `backup.pend` e — pior — a migração
  // do `dia` das regras recorrentes. Como o orçamento ATIVO é sempre carregado por aqui, era
  // precisamente esse que ficava por migrar; ao trocar de orçamento e voltar, já ficava certo.
  // Dados iguais a comportarem-se de forma diferente é o pior tipo de bug.
  function load() {
    ensureBudgets();
    var s = loadBudgetRaw(_bindex.active);
    delete s._tmpAccType;   // lixo de versões anteriores: era guardado por engano
    return s;
  }
  // Se o armazenamento encher, o estado fica só em memória — perde-se ao fechar o separador.
  // Por isso isto não pode ser um aviso que desaparece em dois segundos.
  var _semEspaco = false;
  // Último conteúdo escrito, para não reescrever o mesmo, e a assinatura correspondente.
  // Ambos são invalidados no mesmo sítio: quando se escreve algo diferente.
  var _ultimoJSON = null, _sigCache = null;
  function save() {
    _idx = null; _payees = null;
    var guardou = true;
    // Uma ação normal chama save() e a seguir render(), que volta a chamar save(). Sem isto,
    // cada toque serializava o estado inteiro duas vezes e escrevia-o duas vezes no disco —
    // e a assinatura para o aviso de «por guardar» serializava-o uma terceira. Serializa-se
    // uma vez por save (barato), mas só se escreve quando o conteúdo MUDOU de facto.
    var json;
    try { json = JSON.stringify(state); } catch(e0){ json = null; }
    // Sem serialização não se grava nada: escrever "null" apagaria o orçamento na leitura
    // seguinte, e em silêncio — porque não houve exceção nenhuma para avisar.
    if (json === null) { if(!_semEspaco){ _semEspaco=true; toast("Não foi possível guardar — os dados não puderam ser preparados."); } return false; }
    if (json === _ultimoJSON) { scheduleAutoSync(); return true; }
    try { localStorage.setItem(budKey(_bindex.active), json); _ultimoJSON = json; _sigCache = null; }
    catch (e) { guardou = false; }
    if (guardou) _semEspaco = false;
    else if (!_semEspaco) { _semEspaco = true; try { storageFullModal(); } catch(e2){ toast("Não foi possível guardar — armazenamento cheio."); } }
    scheduleAutoSync();
    return guardou;
  }
  // Quanto ocupa cada coisa no armazenamento deste navegador (aproximado: 2 bytes por caractere).
  // O «histórico» aqui é só a LISTA (dia, hora, motivo). As cópias vivem no armazém grande,
  // que tem espaço a mais e não conta para este limite — é essa a razão de o número ter
  // encolhido em relação a versões anteriores.
  function espacoApp(){
    try {
      var dados=0, hist=0, outros=0;
      for (var k in localStorage) {
        if (!localStorage.hasOwnProperty(k)) continue;
        var n = (((localStorage.getItem(k)||"").length) + k.length) * 2;
        if (k.indexOf(STORAGE_KEY)===0) dados+=n; else if (k.indexOf(SNAP_KEY)===0) hist+=n; else outros+=n;
      }
      return { dados:dados, hist:hist, outros:outros, total:dados+hist+outros };
    } catch(e){ return null; }
  }

  // ---------- Cálculos do orçamento ----------
  function accountById(id) { for (var i=0;i<state.accounts.length;i++) if (state.accounts[i].id===id) return state.accounts[i]; return null; }
  function categoryById(id) { for (var i=0;i<state.categories.length;i++) if (state.categories[i].id===id) return state.categories[i]; return null; }
  function groupById(id) { for (var i=0;i<state.groups.length;i++) if (state.groups[i].id===id) return state.groups[i]; return null; }
  function categoriesOfGroup(gid) { return state.categories.filter(function (c) { return c.groupId===gid && !c.hidden; }); }

  // Reserva/pagamento automático da categoria de pagamento de um cartão.
  // Compra categorizada no cartão -> reserva (+). Pagamento (transferência para o cartão) -> usa a reserva (-).
  function cardPaymentActivity(cardId, m, upto){
    var s=0;
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(t.accountId!==cardId) continue;
      var mm=monthOf(t.date);
      if(upto ? (mm>m) : (mm!==m)) continue;
      if(t.transfer){ s -= (t.inflow||0)-(t.outflow||0); }
      else if(t.categoryId && t.categoryId!==INCOME){ s += (t.outflow||0)-(t.inflow||0); }
    }
    return round2(s);
  }
  function ensurePaymentCategory(card){
    if(card.paymentCatId && categoryById(card.paymentCatId)){ categoryById(card.paymentCatId).name="💳 "+card.name; return; }
    var grp=null; for(var g=0;g<state.groups.length;g++) if(state.groups[g].system) grp=state.groups[g];
    if(!grp){ grp={id:uid(), name:"Pagamentos de cartão de crédito", system:true}; state.groups.push(grp); }
    var cat={id:uid(), groupId:grp.id, name:"💳 "+card.name, cardId:card.id, target:null};
    state.categories.push(cat); card.paymentCatId=cat.id;
  }
  function removePaymentCategory(card){
    if(!card.paymentCatId) return;
    var pid=card.paymentCatId;
    state.categories=state.categories.filter(function(c){return c.id!==pid;});
    for(var k in state.assignments) if(state.assignments.hasOwnProperty(k) && k.split("|")[0]===pid) delete state.assignments[k];
    card.paymentCatId=null;
  }

  function assignedFor(catId, m) { return round2(state.assignments[catId + "|" + m] || 0); }

  // Índice de UM varrimento das transações para o mês apresentado — evita O(categorias × transações) por render.
  var _idx = null;
  var _split = null; // estado de trabalho da transação dividida (não é guardado)
  var _rec = null;   // estado de trabalho da regra recorrente (não é guardado)
  var _undo = [], _redo = [], _undoTimer = null, UNDO_MAX = 5; // histórico de anular/refazer (até 5 passos cada)
  // Esvaziar o histórico é SEMPRE das duas pilhas. Em separado nunca: um «Refazer» sobrevivente
  // a uma troca de orçamento (ou a repor uma cópia) aplicaria por cima um estado que pertence a
  // outro sítio — e o utilizador via os dados de outro orçamento a aparecer no que tem aberto.
  function limparHistorico(){ _undo = []; _redo = []; }
  // Diário dos movimentos de dinheiro ENTRE categorias — mover, cobrir, financiar, libertar,
  // repor, limpar, atribuir à mão, adiar. Transações NÃO entram: essas têm a sua própria lista,
  // e o que aqui interessa é como se repartiu o dinheiro, não onde se gastou.
  // Vive dentro do estado (e não só em memória) para sobreviver a fechar a aplicação e para ir
