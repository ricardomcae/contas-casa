  // ==========================================================================
  //  SINCRONIZAÇÃO NA NUVEM  —  gist privado do GitHub + cifra AES-GCM
  //  As credenciais (token, palavra-passe, id do gist) vivem numa chave SEPARADA
  //  do localStorage e NUNCA entram no estado que é exportado/enviado.
  //  O gist só guarda texto CIFRADO — o GitHub nunca vê os dados em claro.
  // ==========================================================================
  var SYNC_KEY = "meu-orcamento-sync-v1";
  var _sync = loadSyncCfg();
  var _syncing = false, _syncStatus = "", _pendingConflict = null, _autoTimer = null;
  var _gistPerdido = null;   // o gist configurado deixou de existir — à espera de decisão do utilizador

  function loadSyncCfg(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e){ return {}; } }
  function saveSyncCfg(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(_sync)); } catch(e){} }
  function syncReady(){ return !!(_sync.token && _sync.pass); }
  function setSyncStatus(s){ _syncStatus = s; var e = el("syncStatus"); if (e) e.textContent = s; }

  // ---- Cifra: AES-GCM com chave derivada da palavra-passe (PBKDF2) ----
  function b64(buf){ var b = new Uint8Array(buf), s = ""; for (var i=0;i<b.length;i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return a; }
  async function gzip(u8, dir){
    var Ctor = dir === "c" ? (typeof CompressionStream!=="undefined"?CompressionStream:null)
                           : (typeof DecompressionStream!=="undefined"?DecompressionStream:null);
    if (!Ctor) return u8;
    var ab = await new Response(new Blob([u8]).stream().pipeThrough(new Ctor("gzip"))).arrayBuffer();
    return new Uint8Array(ab);
  }
  async function deriveKey(pass, salt){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:150000, hash:"SHA-256"},
                                   km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  async function encEnvelope(obj, pass){
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv   = crypto.getRandomValues(new Uint8Array(12));
    var key  = await deriveKey(pass, salt);
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
    if (typeof CompressionStream !== "undefined") { try { bytes = await gzip(bytes,"c"); z = 1; } catch(e){ z = 0; } }
    var ct = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, bytes);
    return { v:1, z:z, salt:b64(salt.buffer), iv:b64(iv.buffer), ct:b64(ct) };
  }
  async function decEnvelope(env, pass){
    var salt = unb64(env.salt), iv = unb64(env.iv), ct = unb64(env.ct);
    var key = await deriveKey(pass, salt);
    var pt;
    try { pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct); }
    catch(e){ throw new Error("palavra-passe errada ou dados corrompidos"); }
    var bytes = new Uint8Array(pt);
    if (env.z) {
      // A cópia veio comprimida. Sem a descompressão o gzip() devolveria os bytes tal e qual e o
      // JSON.parse rebentava com uma mensagem incompreensível — dizemos antes o que se passa.
      if (typeof DecompressionStream === "undefined")
        throw new Error("este navegador é demasiado antigo para abrir a cópia (foi guardada comprimida) — use um mais recente");
      bytes = await gzip(bytes,"d");
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  // ---- Ligação ao GitHub (gists) ----
  function ghHeaders(){ return { "Authorization":"Bearer "+_sync.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json" }; }
  async function gistRead(){
    var res = await fetch("https://api.github.com/gists/"+_sync.gistId, { headers: ghHeaders() });
    if (!res.ok) throw new Error("leitura ("+res.status+")");
    var g = await res.json(), f = g.files && g.files["orcamento.enc.json"];
    if (!f) throw new Error("ficheiro não encontrado no gist");
    var content = f.content;
    if (f.truncated && f.raw_url) { var r2 = await fetch(f.raw_url); content = await r2.text(); }
    return JSON.parse(content);
  }
  async function gistWrite(outer){
    var res = await fetch("https://api.github.com/gists/"+_sync.gistId, { method:"PATCH", headers: ghHeaders(),
      body: JSON.stringify({ files:{ "orcamento.enc.json":{ content: JSON.stringify(outer) } } }) });
    if (!res.ok) throw new Error("escrita ("+res.status+")");
  }
  async function gistCreate(outer){
    var res = await fetch("https://api.github.com/gists", { method:"POST", headers: ghHeaders(),
      body: JSON.stringify({ description:"O Meu Orçamento (cifrado)", public:false, files:{ "orcamento.enc.json":{ content: JSON.stringify(outer) } } }) });
    if (!res.ok) throw new Error("criação ("+res.status+")");
    return (await res.json()).id;
  }

  // ---- Máquina de sincronização (deteção de conflitos, sem perda silenciosa) ----
  function localChangedSinceSync(){ return _sync.syncedSig === undefined || allSig() !== _sync.syncedSig; }
  // Escrita com compare-and-swap. A API dos gists não tem escrita condicional (não aceita
  // If-Match), por isso entre ler e escrever há uma janela em que outro aparelho pode
  // publicar — e o último a escrever apagava o outro sem ninguém dar por isso.
  // Fecha-se por verificação dupla: relê MESMO antes de escrever para confirmar que a
  // revisão remota ainda é a que esperávamos, e relê DEPOIS para confirmar que foi a
  // nossa que ficou lá. Se em qualquer dos dois momentos aparecer outra, aborta-se com
  // "corrida" e o syncNow() recomeça do princípio, onde o conflito é tratado como deve ser.
  // Traduz um erro de sincronização para linguagem de gente. A palavra "corrida" é um termo
  // interno (dois aparelhos a escrever ao mesmo tempo) e não tem de chegar ao ecrã.
  function msgSync(e){
    var m = (e && e.message) || "";
    if (/corrida/.test(m))      return "Outro aparelho estava a guardar ao mesmo tempo. Nada se perdeu — tente daqui a pouco.";
    if (/\(404\)/.test(m))      return "A cópia na nuvem não foi encontrada. Verifique a configuração da sincronização.";
    if (/\(401\)|\(403\)/.test(m)) return "O GitHub recusou o token — pode ter expirado ou sido revogado.";
    if (/decrypt|Unexpected token|palavra-passe/i.test(m)) return "Não foi possível abrir a cópia da nuvem — a palavra-passe pode ser diferente.";
    if (/Failed to fetch|NetworkError|network/i.test(m)) return "Não foi possível chegar ao GitHub. Verifique a ligação à Internet.";
    return "Não foi possível concluir a sincronização. Tente novamente daqui a pouco.";
  }
  async function pushLocal(rev){
    // Assinatura do que VAI ser enviado, capturada AGORA (antes das idas à rede). Se a gravássemos
    // no fim, a partir do estado atual, uma edição feita durante a sincronização ficaria marcada
    // como "já sincronizada" — e podia perder-se quando este aparelho adotasse a nuvem mais tarde.
    var sigPushed = allSig();
    var outer = { v:2, rev:rev, updatedAt:new Date().toISOString(), device:_sync.device, enc: await encEnvelope(syncContainer(), _sync.pass) };
    if (!_sync.gistId) {
      _sync.gistId = await gistCreate(outer);
    } else {
      var antes = await gistRead();
      if ((antes.rev||0) >= rev) throw new Error("corrida");
      await gistWrite(outer);
      var depois = await gistRead();
      if ((depois.rev||0) !== rev || depois.device !== _sync.device) throw new Error("corrida");
    }
    _sync.baseRev = rev; _sync.syncedSig = sigPushed; saveSyncCfg();
  }
  // Conta as diferenças entre o que está na nuvem e o que está neste aparelho, para o ecrã de
  // conflito poder dizer "a nuvem tem 3 que este não tem". Compara transações por ID, orçamento a
  // orçamento. É só uma AJUDA para decidir: duas edições diferentes na MESMA transação contam como
  // "existe nos dois" — por isso o texto fala em transações a mais, nunca em "está tudo bem".
  function compararComNuvem(remoto){
    if(!remoto) return null;
    if(remoto.accounts && !remoto.budgets)     // formato antigo: um só orçamento
      remoto = { budgets:[{ id:_bindex.active, name:budgetName(_bindex.active), data:remoto }] };
    if(!remoto.budgets) return null;
    var soNuvem=0, soAqui=0, orcSoNuvem=0, orcSoAqui=0;
    var remPorId={};
    for(var i=0;i<remoto.budgets.length;i++){ var rb=remoto.budgets[i]; if(rb && rb.id) remPorId[rb.id]=rb; }
    var vistos={};
    for(var j=0;j<_bindex.list.length;j++){
      var id=_bindex.list[j].id; vistos[id]=true;
      var loc=(id===_bindex.active)?state:loadBudgetRaw(id);
      var rem=remPorId[id];
      if(!rem){ orcSoAqui++; soAqui+=(loc.transactions||[]).length; continue; }
      var idsRem={}, rt=(rem.data&&rem.data.transactions)||[];
      for(var k=0;k<rt.length;k++) idsRem[rt[k].id]=true;
      var idsLoc={}, lt=loc.transactions||[];
      for(var q=0;q<lt.length;q++) idsLoc[lt[q].id]=true;
      for(var w=0;w<rt.length;w++) if(!idsLoc[rt[w].id]) soNuvem++;
      for(var y=0;y<lt.length;y++) if(!idsRem[lt[y].id]) soAqui++;
    }
    for(var z=0;z<remoto.budgets.length;z++){
      var b=remoto.budgets[z];
      if(b && b.id && !vistos[b.id]){ orcSoNuvem++; soNuvem+=((b.data&&b.data.transactions)||[]).length; }
    }
    return { soNuvem:soNuvem, soAqui:soAqui, orcSoNuvem:orcSoNuvem, orcSoAqui:orcSoAqui };
  }
  function adoptRemote(remoto, rev){
    // Compatibilidade: a nuvem pode ainda ter o formato antigo (um só orçamento).
    if (remoto && remoto.accounts && !remoto.budgets) {
      remoto = { v:2, active:_bindex.active, budgets:[{ id:_bindex.active, name:budgetName(_bindex.active), data:remoto }] };
    }
    // Nuvem vazia ou corrompida: NÃO adotar. Sem esta guarda, a limpeza abaixo apagava todos os
    // orçamentos locais e depois lista[0].id rebentava — ou seja, perda de dados a partir de um
    // pacote inválido. Mais vale deixar o local como está e avisar.
    if (!remoto || !remoto.budgets || !remoto.budgets.length) {
      setSyncStatus("Nuvem vazia ⚠️");
      toast("A cópia na nuvem está vazia ou corrompida — nada foi alterado neste aparelho.");
      return;
    }
    var ui = state.ui;                    // preserva a vista/mês/tema deste dispositivo
    pontoDeSeguranca("antes de adotar a versão da nuvem");
    var antigos = _bindex.list.map(function(b){ return b.id; });
    var lista = [];
    for (var i=0;i<remoto.budgets.length;i++){
      var b=remoto.budgets[i];
      try { localStorage.setItem(budKey(b.id), JSON.stringify(b.data)); } catch(e){}
      lista.push({ id:b.id, name:b.name });
    }
    // limpa os orçamentos que a nuvem já não tem
    for (var j=0;j<antigos.length;j++){ if(!lista.some(function(x){return x.id===antigos[j];})){ try{ var lv=[]; try{ lv=JSON.parse(localStorage.getItem(SNAP_KEY+"::"+antigos[j]))||[]; }catch(_e){} idbApagar(lv.map(function(x){return x.ref;}).filter(Boolean)); localStorage.removeItem(budKey(antigos[j])); localStorage.removeItem(SNAP_KEY+"::"+antigos[j]); }catch(e){} } }
    var act = _bindex.active;
    if (!lista.some(function(x){return x.id===act;})) act = remoto.active;
    if (!lista.some(function(x){return x.id===act;})) act = lista[0].id;
    _bindex = { active:act, list:lista }; saveIndex(_bindex);
    state = loadBudgetRaw(act); state.ui = ui;
    _idx = null; _payees = null;
    _sync.baseRev = rev; save(); _sync.syncedSig = allSig(); saveSyncCfg();
    render();
  }
  async function syncNow(opts){
    opts = opts || {};
    if (_syncing || !syncReady()) return;
    _syncing = true; setSyncStatus("A sincronizar…");
    try {
      var outer = null;
      if (_sync.gistId) { outer = await gistRead(); }
      var remoteRev = outer ? (outer.rev||0) : 0, base = _sync.baseRev||0, changed = localChangedSinceSync();
      // A leitura de confirmação logo a seguir à escrita pode vir atrasada (o GitHub demora um
      // instante a mostrar o que acabou de receber, sobretudo em rede móvel). Nesse caso abortámos
      // uma escrita que afinal ficou lá, e na tentativa seguinte encontramos na nuvem uma revisão
      // mais recente do que a nossa base — mas escrita por NÓS. Não há trabalho de outro aparelho
      // em risco, logo não há conflito a mostrar: adota-se o número da revisão e segue-se o
      // caminho normal. Sem isto aparecia o ecrã de conflito com zero diferenças em transações.
      if (outer && remoteRev > base && outer.device && outer.device === _sync.device) {
        base = remoteRev; _sync.baseRev = remoteRev; saveSyncCfg();
      }
      if (outer && remoteRev > base) {
        if (!changed) {
          adoptRemote(await decEnvelope(outer.enc, _sync.pass), remoteRev);
          setSyncStatus("Atualizado da nuvem ✓"); toast("Sincronizado — dados atualizados da nuvem.");
        } else {
          _pendingConflict = { remoteRev:remoteRev, enc:outer.enc, remoteAt:outer.updatedAt };
          // Abre a versão da nuvem só para CONTAR as diferenças — ajuda a escolher qual manter.
          // Se falhar (palavra-passe diferente, pacote antigo), mostra-se o conflito na mesma:
          // é uma ajuda, não uma condição para poder decidir.
          try { _pendingConflict.dif = compararComNuvem(await decEnvelope(outer.enc, _sync.pass)); }
          catch(e){ _pendingConflict.dif = null; }
          setSyncStatus("Conflito ⚠️"); _syncing = false; conflictModal(); return;
        }
      } else if (changed || !outer || remoteRev < base) {
        var newRev = Math.max(remoteRev, base) + 1;
        await pushLocal(newRev);
        setSyncStatus("Guardado na nuvem ✓" + (_sync.gistId?"  ·  gist "+_sync.gistId.slice(0,8)+"…":""));
        if (!opts.silent) toast("Sincronizado ✓");
      } else {
        setSyncStatus("Já sincronizado ✓");
        if (!opts.silent) toast("Já está sincronizado.");
      }
      _sync.lastSyncAt = new Date().toISOString(); saveSyncCfg();   // carimbo da última sincronização bem-sucedida
    } catch(e){
      // Gist não encontrado (apagado no GitHub, ID errado, ou o token deixou de lhe aceder).
      // NUNCA criar outro em silêncio: com dois aparelhos ligados, cada um criaria o seu
      // e os orçamentos passavam a divergir sem ninguém dar por isso.
      if (/\(404\)/.test(e.message) && _sync.gistId) {
        _gistPerdido = { id:_sync.gistId, jaSincronizou: (_sync.baseRev||0) > 0 };
        setSyncStatus("Gist não encontrado ⚠️");
        _syncing = false; gistLostModal(); return;
      }
      if (/\(401\)|\(403\)/.test(e.message)) {
        setSyncStatus("Token recusado ⚠️");
        toast("O GitHub recusou o token — pode ter expirado ou sido revogado.");
        _syncing = false; return;
      }
      // Outro aparelho publicou entre a nossa leitura e a nossa escrita. Nada se perdeu:
      // recomeça-se do princípio, e aí a revisão remota já é maior do que a nossa base —
      // ou seja, entra pelo caminho normal (adotar, ou perguntar em caso de conflito).
      // Uma tentativa só; duas corridas seguidas é sinal de outra coisa qualquer.
      if (/corrida/.test(e.message) && !opts.reentrada) {
        setSyncStatus("Outro aparelho escreveu ao mesmo tempo — a repetir…");
        _syncing = false;
        opts.reentrada = true;
        return syncNow(opts);
      }
      if (/corrida/.test(e.message)) {
        setSyncStatus("Sincronização adiada ⚠️");
        if (!opts.silent) toast("Outro aparelho está a sincronizar agora. Tente daqui a pouco.");
        _syncing = false; return;
      }
      setSyncStatus("Sincronização falhou ⚠️"); toast(msgSync(e));
    }
    _syncing = false;
  }
  function scheduleAutoSync(){
    if (!_sync.auto || !syncReady() || _gistPerdido) return;
    // A verificação "há dados novos?" (localChangedSinceSync -> allSig) lê e assina TODOS os
    // orçamentos: num orçamento grande custa dezenas de milissegundos. Estava a correr a cada
    // save() — ou seja, a cada mudança de mês, separador ou filtro — e travava o ecrã.
    // Agora só corre DENTRO do temporizador, uma vez por pausa de 4 segundos, e não no clique.
    clearTimeout(_autoTimer);
    var esperas = 0;
    _autoTimer = setTimeout(function tick(){
      // Se ainda há uma sincronização a decorrer, espera-se e volta a tentar. Antes desistia-se,
      // e as alterações feitas DURANTE uma sincronização ficavam por enviar até ao toque seguinte
      // — o que acontecia sempre no telemóvel, onde a ida à rede é mais lenta.
      if (_syncing) { if (esperas++ < 20) { _autoTimer = setTimeout(tick, 1500); } return; }
      if (!localChangedSinceSync()) return;    // sem dados novos, não vale a pena ir à rede
      syncNow({silent:true});
    }, 4000);
  }

  function download(filename, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }
  // No iPhone com a aplicação instalada no ecrã principal, o download silencioso falha.
  // Nesse caso usa-se a partilha do sistema, que deixa guardar em Ficheiros, enviar por
  // e-mail, mandar para o iCloud/OneDrive, etc. Nos restantes casos, download normal.
  function podePartilharFicheiros(){
    try { return !!(navigator.canShare && navigator.canShare({ files:[new File(["a"], "t.txt", {type:"text/plain"})] })); }
    catch(e){ return false; }
  }
  function appInstaladaIOS(){
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "") ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = (window.navigator.standalone === true) ||
                     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    return ios && standalone;
  }
  function usaPartilha(){ return appInstaladaIOS() && podePartilharFicheiros(); }
  function guardarFicheiro(nome, texto, tipo, aoConseguir){
    if (usaPartilha()) {
      try {
        navigator.share({ files:[new File([texto], nome, {type:tipo})], title:nome })
          .then(function(){ if(aoConseguir) aoConseguir("partilha"); })
          .catch(function(){});                                  // o utilizador cancelou
        return;
      } catch(e){}
    }
    download(nome, texto, tipo);
    if (aoConseguir) aoConseguir("download");
  }

  // Uma transação por linha, sempre com as mesmas colunas e pela mesma ordem — quer se exporte
  // tudo, quer se exporte só o que está à vista. Assim os dois ficheiros abrem iguais na folha
  // de cálculo, e uma fórmula feita para um serve para o outro.
  function linhasTx(lista) {
    var rows = [["Data","Conta","Beneficiário","Categoria","Nota","Saída","Entrada","Confirmada"]];
    var sorted = lista.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
    for (var i=0;i<sorted.length;i++){
      var t=sorted[i]; var acc=accountById(t.accountId);
      var cat = t.categoryId===INCOME?"Rendimento":(t.categoryId?((categoryById(t.categoryId)||{name:""}).name):"");
      rows.push([t.date, acc?acc.name:"", t.payee||"", cat, t.memo||"", (t.outflow||0).toFixed(2).replace(".",","), (t.inflow||0).toFixed(2).replace(".",","), t.cleared?"Sim":"Não"]);
    }
    return rows.map(function(r){ return r.map(function(c){ var s=String(c); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";"); }).join("\n");
  }

        else if ((tg.type==="quarterly"||tg.type==="semiannual"||tg.type==="yearly") && tg.fund!=="setAside" && tg.due)
          detalhe = "Mês da despesa: " + monthLabel(tg.due);
        rows.push([grp.name, cat.name, prio, tipo, metodo, n(tg.amount), detalhe, cat.note||""]);
      }
    }
    var csv = rows.map(function(r){ return r.map(function(c){ var s=String(c==null?"":c); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";"); }).join("\n");
    guardarFicheiro("alvos-" + limpaNome(budgetName(_bindex.active)) + ".csv", "﻿"+csv, "text/csv;charset=utf-8", function(){ toast("Configuração do orçamento exportada (CSV)."); });

  // ---------- Importação de CSV ----------
  function splitCSVLine(line, d){
    var out=[],cur="",q=false;
    for(var i=0;i<line.length;i++){ var ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===d){ out.push(cur); cur=""; } else cur+=ch; } }
    out.push(cur); return out;
  }
  // Para PALAVRAS-CHAVE: nomes de colunas, tipos de alvo, «sim/não». Deita fora tudo o que não
  // seja letra, e é isso que faz «Tipo de alvo» e «tipodealvo» darem no mesmo.
  function normKey(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,""); }
  // Para NOMES escolhidos pelo utilizador: contas, grupos, categorias. Aqui os ALGARISMOS têm
  // de ficar — «Conta 1» e «Conta 2», ou «Férias 2026» e «Férias 2027», são coisas diferentes,
  // e a norma das palavras-chave transformava-as todas no mesmo texto. Continua a ignorar
  // maiúsculas, acentos e espaços a mais, que é o que se quer ao casar nomes escritos à mão.
  function normNome(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
  function parseCSVDate(s){
    s=String(s==null?"":s).trim(); if(!s) return null;
    var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
    m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
    return null;
  }
  function parseCSV(text, defaultAccountId){
    text=String(text).replace(/^﻿/,"");
    var lines=text.split(/\r?\n/).filter(function(l){ return l.trim()!==""; });
    if(!lines.length) return { rows:[], skipped:0, error:"O ficheiro está vazio." };
    var head=lines[0];
    var cand=[";",",","\t"], d=";", best=-1;
    cand.forEach(function(c){ var n=head.split(c).length-1; if(n>best){ best=n; d=c; } });
    var cols=splitCSVLine(head,d).map(normKey), idx={};
    function set(key,names){ if(key in idx) return; for(var i=0;i<cols.length;i++) if(names.indexOf(cols[i])>=0){ idx[key]=i; return; } }
    set("data",["data","date","datamov","datavalor","dataoperacao","datamovimento"]);
    set("conta",["conta","account"]);
    set("payee",["beneficiario","descricao","payee","description","descritivo","designacao"]);
    set("categoria",["categoria","category"]);
    set("nota",["nota","notas","memo","observacoes","obs"]);
    set("saida",["saida","debito","outflow","despesa","levantamento"]);
    set("entrada",["entrada","credito","inflow","receita","deposito"]);
    set("valor",["valor","montante","amount","importancia"]);
    set("cleared",["confirmada","cleared","reconciliada"]);
    if(!("data" in idx) || (!("saida" in idx) && !("entrada" in idx) && !("valor" in idx)))
      return { rows:[], skipped:0, error:"Cabeçalho não reconhecido. É necessária uma coluna «Data» e uma coluna «Valor» (ou «Saída»/«Entrada»)." };
    var accByName={}, catByName={};
    state.accounts.forEach(function(a){ accByName[normNome(a.name)]=a.id; });
    state.categories.forEach(function(c){ if(!c.cardId) catByName[normNome(c.name)]=c.id; });
    // Contagem do que já existe, por conta+data+valor. Contando (em vez de só marcar) fica
    // certo o caso de haver mesmo duas compras iguais no mesmo dia: só as que já lá estão
    // é que são assinaladas como repetidas.
    var jaExiste={};
    for(var e=0;e<state.transactions.length;e++){
      var te=state.transactions[e];
      var ke=te.accountId+"|"+te.date+"|"+round2(te.outflow||0).toFixed(2)+"|"+round2(te.inflow||0).toFixed(2);
      jaExiste[ke]=(jaExiste[ke]||0)+1;
    }
    var rows=[], skipped=0, semCat=0, dups=0, cortado=0;
    for(var i=1;i<lines.length;i++){
      var f=splitCSVLine(lines[i],d);
      var date=parseCSVDate(f[idx.data]);
      var out=0, inf=0, v;
      if("valor" in idx){ v=parseAmount(f[idx.valor]); if(!isNaN(v)){ if(v<0) out=Math.abs(v); else if(v>0) inf=v; } }
      if("saida" in idx){ v=parseAmount(f[idx.saida]); if(!isNaN(v)&&Math.abs(v)>0.0001) out=Math.abs(v); }
      if("entrada" in idx){ v=parseAmount(f[idx.entrada]); if(!isNaN(v)&&Math.abs(v)>0.0001) inf=Math.abs(v); }
      if(!date || (out<0.005 && inf<0.005)){ skipped++; continue; }
      var accId=defaultAccountId;
      if("conta" in idx){ var an=accByName[normNome(f[idx.conta])]; if(an) accId=an; }
      var catId=null;
      var accObj=lkAcc(accId), ehTrack=!!(accObj && accObj.type==="tracking");   // acompanhamento não leva categoria
      if(!ehTrack && "categoria" in idx){ var cn=normNome(f[idx.categoria]); if(cn==="rendimento"||cn==="income") catId=INCOME; else if(catByName[cn]) catId=catByName[cn]; }
      // Conta TODAS as linhas que ficariam por classificar (saídas e entradas), com a mesma regra
      // do resto da aplicação. Importar é em lote, por isso não se bloqueia — mas diz-se quantas
      // ficam por corrigir, e o aviso do ecrã do Orçamento continua a lembrá-lo depois.
      if(!catId && precisaCategoria(accObj)) semCat++;
      var cl=true;
      if("cleared" in idx){ var cv=normKey(f[idx.cleared]); if(cv==="nao"||cv==="n"||cv==="false"||cv==="0") cl=false; }
      var kr=accId+"|"+date+"|"+round2(out).toFixed(2)+"|"+round2(inf).toFixed(2);
      var repetida=false;
      if(jaExiste[kr]>0){ repetida=true; jaExiste[kr]--; dups++; }
      rows.push({ date:date, accountId:accId, payee:corta(f[idx.payee]||"", LIM_PAYEE), categoryId:catId,
        memo:("nota" in idx ? corta(f[idx.nota]||"", LIM_NOTA) : ""), outflow:round2(out), inflow:round2(inf), cleared:cl, dup:repetida });
      if(rows.length>=MAX_LINHAS_CSV){ cortado=(lines.length-1)-i; break; }
    }
    return { rows:rows, skipped:skipped, semCat:semCat, dups:dups, cortado:cortado, error:null };
  }

  // ---------- Importar a configuração dos alvos ----------
  // Lê o MESMO ficheiro que a exportação produz e reconstrói grupos, categorias, alvos,
  // prioridades e notas.
  //
  // Regra central: NUNCA apaga nem substitui. Uma categoria é identificada pelo par
  // «grupo + nome», e o que existe é ATUALIZADO no lugar, mantendo o identificador — porque é
  // o identificador que liga a categoria às transações já registadas e ao dinheiro que lá está.
  // Recriar categorias do zero deixaria todo o histórico por classificar e o dinheiro perdido,
  // que é precisamente o tipo de estrago que não se desfaz.
  //
  // O par «grupo + nome» também responde à pergunta dos nomes repetidos: «Luz» em «Casa» e
  // «Luz» em «Escritório» são duas categorias diferentes, e é assim que a aplicação já as trata.
  var _cfg = null;   // plano da importação, à espera de confirmação
  function planearConfig(raw){
    try {
      var linhas = String(raw||"").replace(/^\uFEFF/, "").split(/\r?\n/);
      var d = (linhas[0]||"").indexOf(";")>=0 ? ";" : ",";
      // Encontra o cabeçalho: o ficheiro traz um título e uma linha em branco antes dele.
      var iCab = -1;
      for (var i=0;i<linhas.length && i<20;i++){
        var c = splitCSVLine(linhas[i], d).map(normKey);
        if (c.indexOf("grupo")>=0 && c.indexOf("categoria")>=0) { iCab=i; break; }
      }
      if (iCab<0) return { erro:"Não encontrei as colunas «Grupo» e «Categoria». Este ficheiro parece ser de outro tipo — o certo é o que sai em «Configuração dos alvos»." };
      var cab = splitCSVLine(linhas[iCab], d).map(normKey);
      function col(n){ return cab.indexOf(n); }
      var iG=col("grupo"), iC=col("categoria"), iP=col("prioridade"),
          iT=col("tipodealvo"), iM=col("metodo"), iV=col("valordoalvo"), iD=col("detalhe"), iN=col("nota");

      var TIPOS = { mensal:"monthly", semanal:"weekly", trimestral:"quarterly",
                    semestral:"semiannual", anual:"yearly", ateumadata:"byDate" };
      var PRIOS = { alta:"alta", normal:"normal", baixa:"baixa" };
      var WDAYS = ["domingo","segundafeira","tercafeira","quartafeira","quintafeira","sextafeira","sabado"];

      // O que já existe, pela mesma chave que vamos usar a seguir.
      function chave(g,c){ return normNome(g)+"\u0000"+normNome(c); }
      var jaTenho = {}, gruposTenho = {};
      for (var gi=0; gi<state.groups.length; gi++){
        var grp = state.groups[gi];
        gruposTenho[normNome(grp.name)] = grp;
        var cs = categoriesOfGroup(grp.id);
        for (var ci=0; ci<cs.length; ci++) jaTenho[chave(grp.name, cs[ci].name)] = cs[ci];
      }

      var plano=[], gruposNovos={}, vistos={}, avisos=[], ignoradas=0;
      for (var L=iCab+1; L<linhas.length; L++){
        if (!linhas[L].trim()) continue;
        var f = splitCSVLine(linhas[L], d);
        var gN = (f[iG]||"").trim(), cN = (f[iC]||"").trim();
        if (!gN || !cN) { ignoradas++; continue; }
        var k = chave(gN,cN);
        // Duas linhas para a mesma categoria: fica a primeira. Aplicar as duas daria um
        // resultado dependente da ordem de leitura, que ninguém consegue prever.
        if (vistos[k]) { avisos.push("«"+cN+"» aparece mais do que uma vez em «"+gN+"» — fica a primeira."); continue; }
        vistos[k]=1;

        var tipoTxt = normKey(f[iT]||"");
        var existente = jaTenho[k] || null;
        // A categoria de pagamento de cartão é gerada pela aplicação a partir da conta do
        // cartão. Importar uma criaria uma categoria solta, com ar de cartão e sem cartão
        // nenhum por trás.
        if (tipoTxt.indexOf("pagamentodecartao")>=0){
          if (!existente) avisos.push("«"+cN+"» é uma categoria de cartão — essas nascem com a conta do cartão e não se importam.");
          continue;
        }
        if (existente && existente.cardId){
          avisos.push("«"+cN+"» já existe como categoria de cartão — não lhe toco.");
          continue;
        }

        var alvo = null;
        if (tipoTxt && tipoTxt!=="semalvo"){
          var tipo = TIPOS[tipoTxt] || null;
          if (!tipo) { avisos.push("«"+cN+"»: não reconheço o alvo «"+(f[iT]||"").trim()+"» — fica sem alvo."); }
          else {
            var valor = parseAmount(f[iV]||"");
            if (!(valor>0)) { avisos.push("«"+cN+"»: alvo «"+(f[iT]||"").trim()+"» sem valor — fica sem alvo."); }
            else {
              alvo = { type:tipo, amount:round2(valor) };
              // «Reservar» acumula sem teto; nos alvos semanais não existe, e é a própria
              // exportação que escreve sempre «Repor» nesse caso.
              if (normKey(f[iM]||"")==="reservar" && tipo!=="weekly") alvo.fund="setAside";
              var det = String(f[iD]||"").trim();
              if (tipo==="weekly"){
                var w = WDAYS.indexOf(normKey(det.replace(/^por/i,"")));
                alvo.weekday = w<0 ? 1 : w;
                if (w<0 && det) avisos.push("«"+cN+"»: não percebi o dia «"+det+"» — fica à segunda-feira.");
              } else if (tipo==="byDate"){
                var mm = mesDeTexto(det.replace(/^at\u00e9\s*/i,""));
                if (mm) alvo.date = mm;
                else { avisos.push("«"+cN+"»: não percebi a data «"+det+"» — o alvo passa a mensal."); alvo.type="monthly"; }
              } else if (alvo.fund!=="setAside" && /m\u00eas da despesa/i.test(det)){
                var md = mesDeTexto(det.replace(/^.*?:\s*/,""));
                if (md) alvo.due = md;
              }
            }
          }
        }
        var prio = PRIOS[normKey(f[iP]||"")] || "normal";
        var nota = iN>=0 ? String(f[iN]||"").trim() : "";
        plano.push({ grupo:gN, cat:cN, alvo:alvo, prio:prio, nota:nota,
                     existente:existente, grupoExiste: !!gruposTenho[normNome(gN)] });
        if (!gruposTenho[normNome(gN)]) gruposNovos[normNome(gN)] = gN;
      }

      // Categorias que a aplicação tem e o ficheiro não traz. Não se apagam — apagar levaria
      // atrás o histórico e o dinheiro. Listam-se, para o utilizador decidir depois.
      var deFora = [];
      for (var kk in jaTenho) if (Object.prototype.hasOwnProperty.call(jaTenho,kk) && !vistos[kk] && !jaTenho[kk].cardId)
        deFora.push(jaTenho[kk].name);

      var novas = plano.filter(function(x){ return !x.existente; }).length;
      return { plano:plano, novas:novas, atualiza:plano.length-novas,
               gruposNovos:Object.keys(gruposNovos).map(function(k){return gruposNovos[k];}),
               deFora:deFora, avisos:avisos, ignoradas:ignoradas };
    } catch(e){ return { erro:"Não consegui ler este ficheiro." }; }
  }
  // «Agosto 2026» / «08/2026» / «2026-08» → «2026-08»
  function mesDeTexto(t){
    t = String(t||"").trim(); if(!t) return null;
    var m = t.match(/(\d{4})-(\d{2})/);            if (m) return m[1]+"-"+m[2];
    m = t.match(/^(\d{1,2})[\/\-](\d{4})$/);       if (m) return m[2]+"-"+("0"+m[1]).slice(-2);
    var MESES=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
    m = t.match(/^([a-z\u00e0-\u00fc]+)\s+(\d{4})$/i);
    if (m){ var i=MESES.indexOf(normKey(m[1])); if(i>=0) return m[2]+"-"+("0"+(i+1)).slice(-2); }
    return null;
  }

  function importConfigModal(){

      if (!_cfg.plano.length){
        corpo = '<div class="hint" style="color:var(--warning);font-weight:600;">O ficheiro não tem nenhuma categoria que eu possa importar.</div>';
      } else {
        function linha(t){ return '<div style="padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;">'+t+'</div>'; }
        var amostraNovas = _cfg.plano.filter(function(x){return !x.existente;}).slice(0,5)
          .map(function(x){ return linha('<b>'+esc(x.cat)+'</b> <span class="muted">em '+esc(x.grupo)+'</span> <span class="pill" style="font-size:10.5px;">nova</span>'); }).join("");
        var amostraMud = _cfg.plano.filter(function(x){return !!x.existente;}).slice(0,5)
          .map(function(x){ return linha('<b>'+esc(x.cat)+'</b> <span class="muted">em '+esc(x.grupo)+'</span> <span class="tag" style="font-size:10.5px;">alvo atualizado</span>'); }).join("");
        corpo =
          '<div class="field"><label>O que vai acontecer</label>'+
            '<div class="hint" style="margin-bottom:8px;">Nada é apagado. As categorias que já tem <b>mantêm as transações e o dinheiro</b> — só lhes muda o alvo, a prioridade e a nota.</div>'+
            (_cfg.novas ? '<div style="font-size:12.5px;margin-bottom:4px;">➕ <b>'+_cfg.novas+'</b> '+(_cfg.novas===1?'categoria nova':'categorias novas')+
              (_cfg.gruposNovos.length?' · <b>'+_cfg.gruposNovos.length+'</b> '+(_cfg.gruposNovos.length===1?'grupo novo':'grupos novos'):'')+'</div>' : '')+
            (_cfg.atualiza ? '<div style="font-size:12.5px;margin-bottom:4px;">✎ <b>'+_cfg.atualiza+'</b> '+(_cfg.atualiza===1?'categoria já existente fica com o alvo do ficheiro':'categorias já existentes ficam com o alvo do ficheiro')+'</div>' : '')+
            (_cfg.deFora.length ? '<div style="font-size:12.5px;margin-bottom:4px;">🔒 <b>'+_cfg.deFora.length+'</b> '+(_cfg.deFora.length===1?'categoria sua não vem no ficheiro e fica como está':'categorias suas não vêm no ficheiro e ficam como estão')+
              ' <span class="muted">('+esc(_cfg.deFora.slice(0,3).join(", "))+(_cfg.deFora.length>3?"…":"")+')</span></div>' : '')+
            (amostraNovas||amostraMud ? '<div style="margin-top:10px;">'+amostraNovas+amostraMud+'</div>' : '')+
            (_cfg.plano.length>10 ? '<div class="muted" style="font-size:12px;padding-top:6px;">… e mais '+(_cfg.plano.length-10)+'.</div>' : '')+
            (_cfg.ignoradas ? '<div class="hint" style="margin-top:6px;"><b>'+_cfg.ignoradas+'</b> linhas ignoradas (sem grupo ou sem categoria).</div>' : '')+
          '</div>'+
          (_cfg.avisos.length ? '<div class="field"><label>A rever</label><div class="hint" style="color:var(--warning);">'+
             _cfg.avisos.slice(0,6).map(function(a){return '• '+esc(a);}).join('<br>')+
             (_cfg.avisos.length>6?'<br>… e mais '+(_cfg.avisos.length-6)+'.':'')+'</div></div>' : '');

    } else {
      corpo = '<div class="hint">Escolha o ficheiro <b>alvos-….csv</b> que saiu de <b>Exportar para folha de cálculo → Configuração dos alvos</b> — deste orçamento ou de outro.</div>';
    }
    openModal('<div class="modal-head"><h2>Importar configuração dos alvos</h2><button class="x" data-action="close" aria-label="Fechar">✕</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label for="cfgFile">Ficheiro (.csv)</label><input type="file" id="cfgFile" accept=".csv,text/csv"></div>'+
        corpo+
      '</div>'+
      '<div class="modal-foot"><span></span><span><button class="btn" data-action="close">Cancelar</button> '+rodape+'</span></div>');
    el("cfgFile").addEventListener("change", function(e){

      rd.readAsText(file);
    });
  }
  // Aplica o plano. Já foi todo decidido e mostrado: aqui só se escreve.
  function aplicarConfig(){
    if(!_cfg || !_cfg.plano || !_cfg.plano.length) return;
    pushUndo("Configuração importada.");
    var gruposPorNome = {};
    for (var g=0; g<state.groups.length; g++) gruposPorNome[normNome(state.groups[g].name)] = state.groups[g];
    var nNovas=0, nMud=0;
    for (var i=0;i<_cfg.plano.length;i++){
      var it=_cfg.plano[i], gk=normNome(it.grupo), grp=gruposPorNome[gk];
      if (!grp){ grp={ id:uid(), name:it.grupo }; state.groups.push(grp); gruposPorNome[gk]=grp; }
      var cat = it.existente;
      if (!cat){ cat={ id:uid(), name:it.cat, groupId:grp.id }; state.categories.push(cat); nNovas++; }
      else nMud++;
      // Um alvo em branco no ficheiro TIRA o alvo: o ficheiro é a planta, e uma categoria
      // marcada «Sem alvo» tem mesmo de ficar sem alvo, senão importar duas vezes dava
      // resultados diferentes.
      if (it.alvo) cat.target = it.alvo; else delete cat.target;
      cat.priority = it.prio;
      if (it.nota) cat.note = it.nota; else delete cat.note;
    }
    _cfg=null; closeModal(); save(); render();
    toast("Configuração importada — "+nNovas+" novas, "+nMud+" atualizadas. O ↩ desfaz tudo.");
  }

  function importJSON(file) {
    if (!file) return;
    if (file.size > MAX_FICH_JSON) { toast("Essa cópia tem "+mb(file.size)+" — o limite é "+mb(MAX_FICH_JSON)+". Não parece um ficheiro desta aplicação."); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var obj = JSON.parse(e.target.result), qtd;
        if (obj && obj.budgets && obj.budgets.length) {          // pacote com vários orçamentos
          if(!confirm("Isto substitui TODOS os orçamentos deste aparelho pelos "+obj.budgets.length+" do ficheiro. Continuar?")) return;
          pontoDeSeguranca("antes de importar uma cópia");
          // Validar e preparar TUDO antes de escrever seja o que for: se o armazenamento enchesse
          // a meio do ciclo, ficavam alguns orçamentos já substituídos e outros não, com o índice
          // por atualizar — uma mistura das duas cópias, e a mensagem só dizia «Ficheiro inválido».
          var lista=[], porEscrever=[];
          for (var i=0;i<obj.budgets.length;i++){ var b=obj.budgets[i];
            if(!b || !b.id || !b.data || !b.data.accounts || !b.data.transactions) throw new Error("formato");
            porEscrever.push({ chave: budKey(b.id), texto: JSON.stringify(b.data) });
            lista.push({id:b.id,name:b.name});
          }
          try { for (var w=0;w<porEscrever.length;w++) localStorage.setItem(porEscrever[w].chave, porEscrever[w].texto); }
          catch(err){ toast("Não há espaço para importar tudo — nada foi alterado. Apague dados antigos e tente de novo."); return; }
          var act = obj.active && lista.some(function(x){return x.id===obj.active;}) ? obj.active : lista[0].id;
          _bindex = { active:act, list:lista }; saveIndex(_bindex);
          state = loadBudgetRaw(act); qtd = lista.length;
        } else if (obj && obj.accounts && obj.transactions) {    // UM só orçamento (ficheiro antigo, ou um ponto do histórico)
          // Este caminho substitui o orçamento aberto e não tinha pergunta nenhuma: bastava
          // escolher o ficheiro para os dados irem embora em silêncio. É o caminho por onde
          // entra um ficheiro «historico-…», que é fácil de descarregar — logo, fácil de
          // importar por engano.
          if(!confirm("Isto substitui o orçamento aberto («"+(budgetName(_bindex.active)||"")+"») pelo conteúdo deste ficheiro.\nOs outros orçamentos não são tocados.\n\nContinuar?")) return;
          pontoDeSeguranca("antes de importar um ficheiro");
          // Normalização completa, igual à do loadBudgetRaw. Faltavam campos (sobretudo o
          // `recurring`): criar ou apagar uma regra recorrente logo a seguir a importar um
          // ficheiro antigo rebentava em silêncio — o botão simplesmente não fazia nada.
          obj.settings = obj.settings || {locale:"pt-PT",currency:"EUR"};
          obj.collapsed = obj.collapsed || {}; obj.assignments = obj.assignments || {};
          obj.snooze = obj.snooze || {}; obj.recurring = obj.recurring || [];
          obj.groups = obj.groups || []; obj.categories = obj.categories || [];
          obj.backup = obj.backup || { at:null, sig:null, autoDay:null, pend:0 };
          obj.ui = { view:"budget", month: nowMonthKey() };
          state = obj; qtd = 1;
        } else throw new Error("formato");
        limparHistorico(); hideUndo(); _idx=null; _payees=null; save(); closeModal(); render();
        toast(qtd>1 ? ("Importados "+qtd+" orçamentos.") : "Cópia de segurança importada com sucesso.");
      } catch(err){ toast("Ficheiro inválido."); }
    };
    reader.readAsText(file);
  }

  // ---------- Dados de exemplo ----------
  // Orçamento de demonstração. Não é só para "ter dados": é para mostrar, de uma vez, o que a
  // aplicação sabe fazer — os quatro tipos de alvo, prioridades, uma categoria adiada, outra
  // excedida (para se ver o 🩹 Cobrir), transação dividida, transferências dentro e fora do
  // orçamento, cartão de crédito com fatura por pagar, conta de acompanhamento e recorrentes.
  // Quem carrega isto está a experimentar: convém que encontre as coisas montadas, e a bater certo.
  function loadSample() {
    var s = JSON.parse(JSON.stringify(DEFAULT_STATE));

    s.ui.month = m;

  // Guarda uma fotografia do estado ANTES de uma alteração. Chamado por eliminações E edições

    // «Ver quais» para o Refazer se apagar sem nada ter mudado nos dados.
    // Aqui é o sítio certo: todas as alterações reais passam por aqui (é o que as torna
    // anuláveis), e as navegações no histórico (anular/refazer) não passam.
    _redo = [];
    _undo.push({ desc:desc, json:JSON.stringify(state) });
    if(_undo.length>UNDO_MAX) _undo.shift();
    if(state.backup) state.backup.pend=(state.backup.pend||0)+1;
  }

  function aplicarEstado(obj){

    // dados. Sem isto, anular apagava da lista a própria linha «Anulou…» que se acabou de

    var ui = state.ui, mv = state.moves;

  // ================= Mini-teclado de cálculo (campo "Atribuído") =================
  // Reducer PURO da calculadora — sem DOM, para poder ser testado à parte. Estado:
  //   { acc, op, entry, fresh }  →  o valor mostrado é dado por calcDisplay().
  // "fresh" = o valor mostrado é o original (ou um resultado): o próximo dígito substitui-o.
  // É isto que dá o comportamento pedido: tocar e escrever por cima (útil no iPhone), mas também
  // "somar ao que já lá está" tocando primeiro num operador.
  function calcInit(existing){ existing = round2(existing||0); return { acc:existing, op:null, entry:"", fresh:true }; }
  function _kpNum(entry){ if(entry===""||entry==="."||entry==="-"||entry==="-.") return 0; return parseFloat(entry.replace(",",".")); }
  function _kpApply(a,op,b){ return op==="+" ? round2(a+b) : round2(a-b); }
  function calcDigit(s, d){
    var e = s.fresh ? "" : s.entry;
    // Ao substituir o valor de partida/resultado (fresh), a base antiga deixa de contar — senão
    // apagar o dígito recém-escrito faria o valor original "ressuscitar". (fresh só ocorre com op=null.)
    var acc = s.fresh ? 0 : s.acc;
    if (d==="," || d==="."){ d="."; if (e.indexOf(".")>=0) return s; if (e===""||e==="-") e = e+"0"; }
    if (e.replace(/[^0-9]/g,"").length >= 11) return s;   // trava de comprimento
    return { acc:acc, op:s.op, entry:e+d, fresh:false };
  }
  function calcOp(s, op){
    var acc = s.acc;
    if (s.entry!==""){ acc = s.op ? _kpApply(s.acc, s.op, _kpNum(s.entry)) : _kpNum(s.entry); }
    return { acc:acc, op:op, entry:"", fresh:false };
  }
  function calcEq(s){
    if (s.op){
      // Operador pendente SEM 2.º valor (ex.: "100 +" e =): não duplica — mantém a base.
      var b = s.entry!=="" ? _kpNum(s.entry) : null;
      return { acc: b===null ? s.acc : _kpApply(s.acc, s.op, b), op:null, entry:"", fresh:true };
    }
    return { acc: s.entry!=="" ? _kpNum(s.entry) : s.acc, op:null, entry:"", fresh:true };
  }
  function calcBack(s){
    if (s.entry!==""){ return { acc:s.acc, op:s.op, entry:s.entry.slice(0,-1), fresh:false }; }
    if (s.op){ return { acc:s.acc, op:null, entry:"", fresh:false }; }   // apaga o operador pendente
    if (s.fresh){
      // Ainda a mostrar o valor de partida: apagar dígito a dígito (materializa acc em entry),
      // em vez de limpar tudo de uma vez. Ex.: 250 → 25 → 2 → (vazio).
      var str = String(s.acc);
      if (str==="0" || str==="") return { acc:0, op:null, entry:"", fresh:false };
      return { acc:0, op:null, entry:str.slice(0,-1), fresh:false };
    }
    return { acc:0, op:null, entry:"", fresh:false };
  }
  function calcValue(s){ return round2(calcEq(s).acc); }              // valor final ao confirmar
  function _kpSign(op){ return op==="+" ? "+" : "−"; }
  // Visor do teclado — MOSTRA o operador pendente, para se ver que o + / − foi registado.
  function calcDisplayText(s){
    var atual = s.entry!=="" ? s.entry.replace(".",",") : (amtStr(s.acc) || "0");
    if (s.op){
      var base = amtStr(s.acc) || "0";
      return s.entry!=="" ? (base+" "+_kpSign(s.op)+" "+atual) : (base+" "+_kpSign(s.op));
    }
    return atual;
  }

  function reporTopo(){
    try {
      // Com uma janela aberta, quem desliza é o fundo escuro dela e a página fica quieta por

    if (el("modal").contains(document.activeElement)===false) { e.preventDefault(); primeiro.focus(); return; }
    if (e.shiftKey && document.activeElement===primeiro) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement===ultimo) { e.preventDefault(); primeiro.focus(); }
  });

  // Edição do valor atribuído na própria linha
  document.addEventListener("change", function(e){
    var inp = e.target.closest("[data-assign]");
    if (inp) { applyAssign(inp.getAttribute("data-assign"), parseAmount(inp.value)); return; }
    // Mexer num filtro dá outra lista: ficar a meio da altura da lista anterior costuma deixar
    // o ecrã em branco (a nova é mais curta) ou a olhar para o meio de uma coisa nova.
    if (/^txFilter(Acc|Cat|From|To|Per)$/.test(e.target.id||"")) setTimeout(aoTopo, 0);
    if (e.target.id==="txFilterAcc"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.account=e.target.value||null; render(); }
    if (e.target.id==="txFilterCat"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.category=e.target.value||null; render(); }
    if (e.target.id==="txFilterFrom"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.from=ptParaIso(e.target.value)||null; render(); }
    if (e.target.id==="txFilterTo"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.to=ptParaIso(e.target.value)||null; render(); }
    if (e.target.id==="txFilterPer"){ state.ui.txFilter=state.ui.txFilter||{}; var pv=e.target.value; state.ui.txFilter.per=pv||null; if(pv!=="custom"){ state.ui.txFilter.from=null; state.ui.txFilter.to=null; } render(); }
    if (e.target.id==="repFrom"){ state.ui.reportFrom=e.target.value||null; if(state.ui.reportFrom&&!state.ui.reportTo) state.ui.reportTo=state.ui.month; render(); }
    if (e.target.id==="repTo"){ state.ui.reportTo=e.target.value||null; if(state.ui.reportTo&&!state.ui.reportFrom) state.ui.reportFrom=shiftMonth(state.ui.reportTo,-5); render(); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key==="Enter" && e.target.closest("[data-assign]")) { e.target.blur(); }
  });
  document.addEventListener("input", function(e){
    var _id=e.target.id;

    // ---- Campos de valor: só dígitos e um separador decimal ----
    var alvo = e.target;
    if (alvo.classList && alvo.classList.contains("money")) {
      var par = alvo.getAttribute("data-par");
      var bruto = alvo.value;
      // Num par Saída/Entrada, um "-" À CABEÇA não é um sinal: passa o valor para o outro lado.
      // (Só à cabeça: depois de dígitos o "-" é uma subtração — "50-12,50" vale 37,50.)
      if (par && bruto.indexOf("-") === 0) {
        var outro = el(par), limpo = limpaValor(bruto.replace(/-/g, ""), false);
        alvo.value = "";
        if (outro) { outro.value = limpo; try { outro.focus(); outro.setSelectionRange(limpo.length, limpo.length); } catch(err){} }
        toast(/In$/.test(par) ? "Passou para Entrada." : "Passou para Saída.");
        return;
      }
      // O campo do orçamento tem teclado próprio (o visor dele já mostra a conta); os restantes
      // aceitam a conta escrita no próprio campo.
      var ehAssign = alvo.classList.contains("assign-input");
      var limpo2 = ehAssign ? limpaValor(bruto, alvo.hasAttribute("data-neg"))
                            : limpaExpr(bruto, alvo.hasAttribute("data-neg"));
      if (limpo2 !== bruto) {
        var pos = alvo.selectionStart, delta = bruto.length - limpo2.length;
        alvo.value = limpo2;
        try { var np = Math.max(0, Math.min(limpo2.length, (pos==null?limpo2.length:pos) - delta)); alvo.setSelectionRange(np, np); } catch(err){}
      }
      if (par && alvo.value) { var op = el(par); if (op) op.value = ""; }   // só um dos dois lados
      pintaConta(alvo);
    }

    if (_id && _id.indexOf("spAmt")===0){ var _els=document.querySelectorAll("[id^='spAmt']"), _tot=0; for(var _qi=0;_qi<_els.length;_qi++){ var _vv=parseAmount(_els[_qi].value); if(!isNaN(_vv)) _tot+=_vv; } var _h=el("splitTotal"); if(_h) _h.textContent=fmt(_tot); }
    if (e.target.id==="txSearch"){
      state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.q=e.target.value;
      var v=e.target.value;
      clearTimeout(_searchTimer);   // temporizador próprio — antes limpava o do toast, que ficava preso no ecrã
      _searchTimer=setTimeout(function(){
        if(el("txSearch")&&el("txSearch").value===v){ renderTransactions(); var s=el("txSearch"); if(s){ s.focus(); s.setSelectionRange(v.length,v.length); } }
      },250);
    }
  });

  // ---------- Arrastar para reordenar (categorias e grupos) ----------
  var _dragOver=null;
  function clearDragOver(){ if(_dragOver && _dragOver.classList) _dragOver.classList.remove("drag-over"); _dragOver=null; }
  document.addEventListener("dragstart", function(e){
    var r=e.target.closest && e.target.closest("[data-drag]"); if(!r) return;
    _drag={ type:r.getAttribute("data-drag"), id:r.getAttribute("data-drag-id") };
    if(e.dataTransfer){ e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",_drag.id); }catch(err){} }
  });
  document.addEventListener("dragover", function(e){
    if(!_drag) return;
    var r=e.target.closest && e.target.closest("[data-drag]"); if(!r) return;
    if(r.getAttribute("data-drag")!==_drag.type) return;
    e.preventDefault();
    if(_dragOver!==r){ clearDragOver(); _dragOver=r; if(r.classList) r.classList.add("drag-over"); }
  });
  document.addEventListener("drop", function(e){
    if(!_drag) return;
    var r=e.target.closest && e.target.closest("[data-drag]");
    clearDragOver();
    if(r && r.getAttribute("data-drag")===_drag.type){
      e.preventDefault();
      var dstId=r.getAttribute("data-drag-id"), moved=false;
      if(_drag.type==="cat") moved=dropCategory(_drag.id,dstId); else if(_drag.type==="grp") moved=dropGroup(_drag.id,dstId); else if(_drag.type==="acc") moved=dropAccount(_drag.id,dstId);
      if(moved){ save(); render(); }
    }
    _drag=null;
  });
  document.addEventListener("dragend", function(){ clearDragOver(); _drag=null; });

  // ---------- Tooltips do gráfico (rato) + valor ao tocar (telemóvel) + redimensionar ----------
  function positionTip(x, y){
    var tip=el("chartTip"); if(!tip) return;
    var w=tip.offsetWidth||140, h=tip.offsetHeight||30, m=8;
    var vw=window.innerWidth||document.documentElement.clientWidth||360;
    var vh=window.innerHeight||document.documentElement.clientHeight||640;
    var left=x+14; if(left+w+m>vw) left=x-14-w; if(left<m) left=m;
    var top=y-h-12; if(top<m) top=y+18; if(top+h+m>vh) top=vh-h-m;
    tip.style.left=left+"px"; tip.style.top=top+"px";
  }
  document.addEventListener("mouseover", function(e){ var pt=e.target.closest && e.target.closest(".evo-pt"); if(pt){ var tip=el("chartTip"); tip.textContent=pt.getAttribute("data-tip"); tip.classList.add("show"); positionTip(e.clientX, e.clientY); } });
  document.addEventListener("mousemove", function(e){ var tip=el("chartTip"); if(tip && tip.classList.contains("show")) positionTip(e.clientX, e.clientY); });
  document.addEventListener("mouseout", function(e){ if(e.target.closest && e.target.closest(".evo-pt")) el("chartTip").classList.remove("show"); });
  document.addEventListener("click", function(e){ var pt=e.target.closest && e.target.closest(".evo-pt"); if(pt) toast(pt.getAttribute("data-tip")); });
  var _rzT; window.addEventListener("resize", function(){ clearTimeout(_rzT); _rzT=setTimeout(function(){ if(state.ui.view==="reports") render(); }, 200); });

  // ---------- Auto-diagnóstico da invariante ----------
  // Confirma a regra de base-zero (Pronto a atribuir + Σ Disponível = contas de orçamento) em
  // TODOS os orçamentos, não só no ativo — é nos outros que uma sincronização ou reposição
  // estragada passaria despercebida até lá voltar. Reutiliza integrityDelta (a mesma conta da
  // barra de integridade), pelo que não duplica lógica. É só leitura: troca o estado global,
  // reconstrói o índice desse orçamento e repõe tudo no fim (try/finally) — nada é alterado.
  function invarianteDe(st, m){
    var sState=state, sIdx=_idx, sLookup=_lookup;
    try { state=st; buildIndex(m); return integrityDelta(m); }
    finally { state=sState; _idx=sIdx; _lookup=sLookup; }
  }
  function autoDiagnostico(){
    try {
      var m=nowMonthKey(), maus=[];
      for (var i=0;i<_bindex.list.length;i++){
        var b=_bindex.list[i];
        var st=(b.id===_bindex.active)?state:loadBudgetRaw(b.id);
        if (Math.abs(invarianteDe(st, m))>=0.005) maus.push(b.name);
      }
      if (!maus.length) return;
      if (maus.length===1)
        toast("⚠️ «"+maus[0]+"» não está a bater certo. Abra o separador Orçamento e veja «Ver porquê».");
      else
        toast("⚠️ "+maus.length+" orçamentos não batem certo ("+maus.join(", ")+"). Veja «Ver porquê» em cada um.");
    } catch(e){}
  }

  // ---------- Arranque ----------
  // Abre SEMPRE no Orçamento do mês corrente. A vista e o mês ficam gravados enquanto se usa a
  // aplicação (o render() grava o state inteiro), pelo que sem isto a app reabria onde se tivesse
  // saído — no separador Transações, ou pior, num mês futuro que se andou a espreitar, com o risco
  // de se atribuir dinheiro ao mês errado. É o mesmo que já acontece ao clicar em "Orçamento".
  reporVistaInicial();
  state.recurring = state.recurring || [];
  state.backup = state.backup || { at:null, sig:null, autoDay:null };
  var _posted = processRecurring();
  render();
  if (_posted > 0) toast("Foram lançadas " + _posted + " transações recorrentes.");
  setTimeout(autoDiagnostico, 2600);   // depois dos avisos de recorrentes/cópia, para não os tapar

  // Instantâneo diário DENTRO da aplicação (últimos 5 dias) — sem transferir ficheiros,
  // por isso funciona igual no iPhone e no PC. A exportação para ficheiro é manual.
  (function(){
    try { migrarHistorico(); } catch(e){}     // passa as cópias antigas para o armazém grande
    if (state.settings.autoBackup !== false) { try { takeDailySnapshot(); } catch(e){} }
    setTimeout(maybeShowBackupReminder, 1200);
  })();

  // ...e também ao SAIR (mudar de separador, fechar, ir para outra app no telemóvel).
  // Só com a abertura, o trabalho da última sessão de cada dia ficava por guardar até
  // à abertura seguinte — que podia nunca chegar, se o navegador limpasse o armazenamento.
  // O takeDailySnapshot() substitui a entrada do próprio dia, por isso continua a ser
  // um ponto por dia; o que muda é ser o estado mais recente desse dia, e não o inicial.
  function snapshotAoSair(){
    if (!state || state.settings.autoBackup === false) return;
    try { takeDailySnapshot(); } catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") snapshotAoSair();   // o que funciona no iOS
  });
  window.addEventListener("pagehide", snapshotAoSair);

  // Sincronização na nuvem ao abrir (se estiver ligada e automática).
  if (_sync.auto && syncReady()) setTimeout(function(){ syncNow({silent:true}); }, 1500);
})();
</script>
