          '<button class="grp-add" data-action="add-category" data-id="'+grp.id+'">+ categoria</button>' +
          '<button class="grp-add" data-action="edit-group" data-id="'+grp.id+'" title="Editar grupo" aria-label="Editar o grupo '+esc(grp.name)+'">✎</button>') + '</div></td>' +
        '<td class="grp-total">'+fmt(gAssigned)+'</td>' +
        '<td class="grp-total">'+fmt(gActivity)+'</td>' +
        '<td class="grp-total">'+fmt(gAvail)+'</td></tr>';
      if (collapsed) continue;
      if (!cats.length && !grp.system && !filtering) {
        rows += '<tr class="cat-row"><td colspan="4" style="padding:9px 18px;"><button class="btn ghost sm" data-action="add-category" data-id="'+grp.id+'">+ Adicionar categoria a este grupo</button></td></tr>';
      }
      for (var c2=0;c2<cats.length;c2++) {
        var cat = cats[c2];
        var assigned = assignedFor(cat.id, m);
        var activity = activityFor(cat.id, m);
        var avail = availableFor(cat.id, m);
        var pillCls = avail > 0.005 ? "pos" : (avail < -0.005 ? "neg" : "zero");
        if (cat.cardId) {
          // Mesma regra do catStatus: a dívida é a que existe até ao mês em vista.
          var debt = round2(-accountBalanceUpto(cat.cardId, m));
          var pnote = debt<=0.005 ? "Sem dívida a pagar" : (avail>=debt-0.005 ? ("✅ Dívida coberta ("+fmt(debt)+")") : ("Falta "+fmt(round2(debt-avail))+" para cobrir a dívida de "+fmt(debt)));
          if (debt>0.005 && avail<debt-0.005 && pillCls==="pos") pillCls="warn";
          var cstatP = catStatus(cat, m);
          var barP = cstatP==="neg" ? 100 : Math.max(0,Math.min(1, avail/debt))*100;
          var barClsP = cstatP==="neg" ? "neg" : (cstatP==="ok" ? "full" : "warn");
          rows += '<tr class="cat-row" data-id="'+cat.id+'"><td>' +
            '<div class="cat-name-cell"><span class="cat-name">'+esc(cat.name)+'</span>' +
            (debt>0.005 ? ' <button class="btn ghost sm" data-action="pay-card" data-id="'+cat.cardId+'" title="Pagar / abater o cartão">💳 Pagar</button>' : '') +
            '</div>' +
            // Sem dívida não há nada para cobrir: a barra desaparece (fica só a nota "Sem dívida a pagar").
            (debt>0.005 ? '<div class="target-bar"><span class="'+barClsP+'" style="width:'+barP+'%"></span></div>' : '') +
            '<div class="target-note">'+pnote+'</div></td>' +
            '<td class="num"><input class="assign-input money" data-neg="1" maxlength="13" type="text" inputmode="none" data-assign="'+cat.id+'" value="'+amtStr(assigned)+'" placeholder="0,00"></td>' +
            '<td class="num activity-cell">'+fmt(activity)+'</td>' +
            '<td class="num"><span class="avail-pill '+pillCls+'">'+fmt(avail)+'</span></td></tr>';
          continue;
        }
        var targetHtml = "";
        var ti = targetInfo(cat, m);
        var cstat = catStatus(cat, m);
        if (ti) {
          var okMes = (ti.doMes!=null ? ti.doMes : ti.met);
          if (!okMes && pillCls === "pos") pillCls = "warn";
          var barCls = cstat==="neg" ? "neg" : (ti.snoozed ? "snoozed" : (ti.met ? "full" : (okMes ? "ok" : "warn")));
          var barW = cstat==="neg" ? 100 : ti.progress*100;
          targetHtml = '<div class="target-bar"><span class="'+barCls+'" style="width:'+barW+'%"></span></div>' +
            '<div class="target-note">' + ti.label + '</div>';
        } else if (cstat==="neg") {
          targetHtml = '<div class="target-bar"><span class="neg" style="width:100%"></span></div>' +
            '<div class="target-note">Excesso de '+fmt(Math.abs(avail))+' — atribua mais a esta categoria</div>';
        }
        var prio = cat.priority||"normal";
        var prioBtn = '<button class="prio-btn p-'+prio+'" data-action="cycle-prio" data-id="'+cat.id+'"'+
          ' title="Prioridade '+PRIO_LABEL[prio].toLowerCase()+' — clique para mudar"'+
          ' aria-label="Prioridade de '+esc(cat.name)+': '+PRIO_LABEL[prio]+'. Clique para mudar.">'+PRIO_ICON[prio]+'</button>';
        rows += '<tr class="cat-row" data-id="'+cat.id+'" draggable="true" data-drag="cat" data-drag-id="'+cat.id+'"><td>' +
          '<div class="cat-name-cell">' + prioBtn + '<span class="cat-name">'+esc(cat.name)+'</span>' +
          '<span class="cat-actions">' +
            '<button data-action="move-money" data-id="'+cat.id+'" title="Mover dinheiro" aria-label="Mover dinheiro de ou para '+esc(cat.name)+'">↔</button>' +
            '<button data-action="edit-category" data-id="'+cat.id+'" title="Editar / alvo" aria-label="Editar a categoria '+esc(cat.name)+'">✎</button>' +
            // Ordem deliberada: primeiro o que TAPA O BURACO (🩹, traz a zero), só depois o que
            // LEVA AO ALVO (🎯). É a sequência lógica de quem estourou numa categoria — e os dois
            // aparecem juntos sempre que a categoria ficou negativa e ainda está abaixo do alvo.
            (avail < -0.005 ? '<button data-action="cover-overspend" data-id="'+cat.id+'" title="Cobrir o excesso — trazer a zero, tirando de outras categorias" aria-label="Cobrir o excesso de '+esc(cat.name)+'">🩹</button>' : '') +
            (ti && ti.need>0 ? '<button data-action="fund-one" data-id="'+cat.id+'" title="Financiar o alvo — juntar o que falta, do Pronto a atribuir" aria-label="Financiar o alvo de '+esc(cat.name)+'">🎯</button>' : '') +
            (ti && ti.snoozed ? '<button data-action="unsnooze-cat" data-id="'+cat.id+'" title="Reativar o alvo este mês" aria-label="Reativar o alvo de '+esc(cat.name)+' este mês">☀️</button>'
              : (ti && ti.need>0 ? '<button data-action="snooze-cat" data-id="'+cat.id+'" title="Adiar o alvo este mês — não pedir agora" aria-label="Adiar o alvo de '+esc(cat.name)+' este mês">😴</button>' : '')) +
          '</span></div>' + (cat.note?'<div class="tag" style="margin-top:3px;">📝 '+esc(cat.note)+'</div>':'') + targetHtml +
          (upc[cat.id] ? '<div class="target-note">📅 Ainda por sair este mês: '+fmt(upc[cat.id])+
            (avail < upc[cat.id]-0.005 ? ' <b style="color:var(--warning)">— faltam '+fmt(round2(upc[cat.id]-avail))+'</b>' : '')+'</div>' : '') + '</td>' +
          '<td class="num"><input class="assign-input money" data-neg="1" maxlength="13" type="text" inputmode="none" data-assign="'+cat.id+'" value="'+amtStr(assigned)+'" placeholder="0,00"></td>' +
          '<td class="num activity-cell"><button class="btn ghost sm" data-action="cat-activity" data-id="'+cat.id+'" style="font-variant-numeric:tabular-nums;">'+fmt(activity)+'</button></td>' +
          '<td class="num"><span class="avail-pill '+pillCls+'">'+fmt(avail)+'</span></td></tr>';
      }
    }
    // Com dois grupos de filtros combinados é fácil chegar a zero resultados — dizê-lo.
    if (filtering && !nShown) rows =
      '<tr><td colspan="4" class="empty" style="padding:34px 20px;">'+
        '<div class="big" style="font-size:30px;">🔍</div>'+
        '<h3>Nada corresponde aos filtros</h3>'+
        '<p style="max-width:360px;margin:0 auto;">Está a pedir categorias que sejam ao mesmo tempo de um dos estados <b>e</b> de uma das prioridades escolhidas. Desligue algum filtro<span class="hide-phone">, ou use <b>Limpar</b></span>.</p>'+
      '</td></tr>';

    // No telemóvel o rótulo esconde-se e fica só o símbolo, para os seis filtros
    // caberem numa linha só em vez de partirem a meio do grupo.
    function fBtn(cls, accao, id, ativo, icone, rotulo, dica){
      return '<button class="btn sm f-filtro '+cls+(ativo?' active':'')+'" data-action="'+accao+'" data-id="'+id+
        '" title="'+dica+'" aria-label="'+dica+'" aria-pressed="'+(ativo?'true':'false')+'">'+
        icone+'<span class="rot"> '+rotulo+'</span></button>';
    }
    var tot = budgetTotals(m);
    el("content").innerHTML =
      // A barra é feita de dois BLOCOS. Cada um mantém-se inteiro; se a janela não chegar para
      // os dois, é entre eles que a linha parte — nunca a meio de um grupo de filtros.
      '<div class="toolbar">' +
        '<div class="tb-bloco">' +
        // O «+ Grupo» leva um ícone próprio: sem texto, dois botões a começar por «+» ficavam
        // indistinguíveis um do outro.
        '<button class="btn primary hide-phone tb-acao" data-action="add-tx" title="Nova transação">➕<span class="rot"> Nova transação</span></button>' +
        '<button class="btn tb-acao" data-action="add-group" title="Novo grupo de categorias">🗂<span class="rot"> Grupo</span></button>' +
        '<span class="muted hide-phone tb-etiq" style="font-size:12.5px;margin-inline-start:6px;">Mostrar:</span>' +
        fBtn('f-estado f-over','budget-filter','over',bf.over,'🔵','Com excedente','Só as categorias com mais do que o alvo pede') +
        fBtn('f-estado f-ok','budget-filter','ok',bf.ok,'🟢','Alvo cumprido','Só as categorias com o alvo cumprido') +
        fBtn('f-estado f-warn','budget-filter','warn',bf.warn,'🟡','Abaixo do alvo','Só as categorias com o alvo por cumprir') +
        fBtn('f-estado f-neg','budget-filter','neg',bf.neg,'🔴','Excedido','Só as categorias que gastaram mais do que tinham') +
        fBtn('f-estado f-money','budget-filter','money',bf.money,'💰','Com saldo','Só as categorias com dinheiro disponível') +
        // As adiadas não são «abaixo do alvo» nem «cumpridas» — são um estado à parte. Sem este
        // botão ficavam invisíveis a TODOS os filtros de estado, e só se encontravam a percorrer
        // a lista inteira: um ponto cego sobre decisões que a pessoa tomou de propósito.
        fBtn('f-estado f-snoozed','budget-filter','snoozed',bf.snoozed,'😴','Adiadas','Só as categorias adiadas este mês') +
        '</div>' +
        '<div class="tb-bloco tb-fim">' +
        '<span class="sep"></span>' +
        '<span class="muted hide-phone tb-etiq" style="font-size:12.5px;">Prioridade:</span>' +
        fBtn('f-prio f-alta','prio-filter','alta',bp.alta,'▲','Alta','Só as de prioridade alta') +
        fBtn('f-prio f-normal','prio-filter','normal',bp.normal,'●','Normal','Só as de prioridade normal') +
        fBtn('f-prio f-baixa','prio-filter','baixa',bp.baixa,'▼','Baixa','Só as de prioridade baixa') +
        (filtering ? '<span class="sep"></span><button class="btn sm btn-limpar" data-action="budget-filter-clear">✕<span class="rot"> Limpar</span></button>' : '') +
        '<div class="spacer"></div>' +
        // A contagem está SEMPRE lá, encostada à direita — não aparece e desaparece conforme
        // se filtra, que era o que fazia a barra saltar a cada clique.
        '<span class="muted" style="font-size:12.5px;white-space:nowrap;">' +
          // Diz sempre quantas categorias ESTÃO À VISTA: sem filtros é o total, com filtros é o
          // que sobrou. O «N de M» ocupava o dobro do espaço e era o que, no telemóvel, empurrava
          // a barra para uma segunda linha.
          (nShown+(nShown===1?' categoria':' categorias')) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="budget-card"><table class="budget"><thead><tr>' +
        '<th class="first">Categoria'+
          '<button class="btn ghost sm" data-action="expand-all" title="Abrir todos os grupos" aria-label="Abrir todos os grupos" style="padding:1px 5px;margin-inline-start:8px;">⊕</button>'+
          '<button class="btn ghost sm" data-action="collapse-all" title="Fechar todos os grupos" aria-label="Fechar todos os grupos" style="padding:1px 5px;">⊖</button>'+
        '</th><th>Atribuído</th><th>Atividade</th><th>Disponível</th>' +
      '</tr><tr class="tot-row">' +
        '<td class="first">Total do mês'+(tot.cartoes!==0
          ? ' <span class="tag" title="A atividade da categoria de pagamento é o espelho positivo do que se gastou com o cartão: somá-la daria zero. Os totais do cartão estão na linha do grupo dele.">sem cartões de crédito</span>'
          : '')+'</td>' +
        '<td>'+fmt(tot.assigned)+'</td>' +
        '<td class="'+(tot.activity<-0.005?"neg":"")+'">'+fmt(tot.activity)+'</td>' +
        '<td class="'+(tot.avail<-0.005?"neg":(tot.avail>0.005?"pos":""))+'">'+fmt(tot.avail)+'</td>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderAccounts() {
    var content = el("content");
    var visible = state.accounts.filter(function(a){return !a.hidden;});
    if (!visible.length) {
      content.innerHTML = emptyState("🏦","Ainda não há contas","Adicione as suas contas bancárias, dinheiro, cartões de crédito ou investimentos.",
        '<button class="btn primary" data-action="add-account">+ Adicionar conta</button>');
      return;
    }
    var budgetAccs = visible.filter(function(a){return a.type==="budget";});
    var trackAccs = visible.filter(function(a){return a.type!=="budget";});
    // Na tabela das contas de orçamento a coluna Tipo diz «Orçamento» em todas as linhas — é
    // exatamente o que o título da secção já diz. No telemóvel esconde-se, e o espaço ganho
    // paga com folga o pontinho de estado.
    function accTable(list, title, soOrcamento) {
      if (!list.length) return "";
      var rows = list.map(function(a){
        var bal = accountBalance(a.id), cl = accountBalance(a.id, true);
        return '<tr class="hoverable" draggable="true" data-drag="acc" data-drag-id="'+a.id+'"><td><button class="btn ghost" data-action="open-account" data-id="'+a.id+'" style="font-weight:700;padding:2px 4px;">'+esc(a.name)+'</button>'+
          (a.note?'<div class="tag">'+esc(a.note)+'</div>':'')+'</td>'+
          '<td class="col-tipo"><span class="pill '+(a.type==="budget"?"budget":(a.type==="credit"?"credit":"tracking"))+'">'+
            '<span class="t-longo">'+(a.type==="budget"?"Orçamento":(a.type==="credit"?"Cartão de crédito":"Acompanhamento"))+'</span>'+
            '<span class="t-curto">'+(a.type==="budget"?"Orç.":(a.type==="credit"?"Cartão":"Acomp."))+'</span></span></td>'+
          '<td class="num muted">'+pontoConta(a.id)+fmt(cl)+'</td>'+
          '<td class="num" style="font-weight:700;'+(bal<0?"color:var(--negative)":"")+'">'+fmt(bal)+'</td>'+
          '<td class="row-actions">'+
          (a.type!=="budget" && bal<-0.005 ? '<button data-action="pay-card" data-id="'+a.id+'" title="Pagar / abater">💳</button>' : '')+
          '<button data-action="edit-account" data-id="'+a.id+'" title="Editar">✎</button>'+
          '<button data-action="delete-account" data-id="'+a.id+'" title="Eliminar">🗑</button></td></tr>';
      }).join("");
      return '<h3 style="margin:18px 2px 10px;font-size:14px;">'+title+'</h3>'+
        '<div class="data-card'+(soOrcamento?' sem-tipo':'')+'"><table class="data"><thead><tr><th>Conta</th><th class="col-tipo">Tipo</th><th class="num">Confirmado</th><th class="num">Saldo</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    content.innerHTML =
      // O «Transferir» mexe em transações, e transações criam-se aqui — faltava o par dele.
      // Sem o «Nova transação», este ecrã oferecia o caso raro (mover dinheiro entre contas) e
      // escondia o caso de todos os dias.
      '<div class="toolbar"><button class="btn primary" data-action="add-account">+ Adicionar conta</button>'+
      '<button class="btn" data-action="add-tx">➕ Nova transação</button>'+
      '<button class="btn" data-action="transfer">↔ Transferir</button>'+
      '<div class="spacer"></div>'+
      '<span class="muted" style="font-size:12.5px;">Património líquido: <b>'+fmt(netWorth())+'</b></span></div>'+
      accTable(budgetAccs, "🏦 Contas de orçamento", true) + accTable(trackAccs, "💳 Cartões e outras contas");
  }

  function txRow(t, runBal, withAccount) {
    var catName = t.transfer ? ('<span class="pill tracking">↔ Transferência</span>' +
                    (t.categoryId ? ' <span class="tag">'+esc((lkCat(t.categoryId)||{name:"(apagada)"}).name)+'</span>' : '')) :
                  (t.categoryId === INCOME ? '<span class="pill budget">Rendimento</span>' :
                  (t.categoryId ? esc((lkCat(t.categoryId)||{name:"(apagada)"}).name) : '<span class="muted">—</span>'));
    var balCell = (runBal===undefined) ? '' : '<td class="num" style="font-variant-numeric:tabular-nums;font-weight:600;'+(runBal<-0.005?"color:var(--negative)":"")+'">'+fmt(runBal)+'</td>';
    var accCell = "";
    if (withAccount) { var a=lkAcc(t.accountId); accCell = '<td class="tag" style="white-space:nowrap;">'+esc(a?a.name:"—")+'</td>'; }
    return '<tr class="hoverable" data-action="edit-tx" data-id="'+t.id+'" style="cursor:pointer;">'+
      '<td class="muted" style="white-space:nowrap;"><label class="tx-selcell" title="Selecionar (só para somar)"><input type="checkbox" class="tx-sel" data-id="'+t.id+'"'+(_txSel[t.id]?" checked":"")+'></label>'+fmtDate(t.date)+'</td>'+
      accCell +
      '<td style="font-weight:600;">'+esc(t.payee||"")+(t.split?' <span class="tag" title="Transação dividida">🔗</span>':'')+'</td>'+
      '<td>'+catName+'</td>'+
      // A nota pode ir até 300 caracteres. Sem limite de largura, uma nota comprida esmagava
      // todas as outras colunas. Corta-se com «…» e o texto todo fica na dica do rato — para
      // ler à vontade, abre-se a transação.
      '<td class="tag col-nota"'+(t.memo?' title="'+esc(t.memo)+'"':'')+'>'+esc(t.memo||"")+'</td>'+
      // Sai a vermelho com −, entra a verde com +. O sinal faz o trabalho principal; a cor
      // é reforço, não é a única pista.
      '<td class="num">'+(t.outflow ? '<span class="tx-amt out">−'+fmt(t.outflow)+'</span>'
                        : (t.inflow ? '<span class="tx-amt in">+'+fmt(t.inflow)+'</span>' : ''))+'</td>'+
      balCell +
      '<td style="text-align:center;"><span class="cleared-dot '+(t.cleared?"on":"")+'" data-action="toggle-clear" data-id="'+t.id+'" role="button" tabindex="0"'+
        ' title="'+(t.cleared?"Confirmada no banco":"Por confirmar no banco")+'" aria-label="'+(t.cleared?"Confirmada":"Por confirmar")+' — '+esc(t.payee||"sem beneficiário")+'">✓</span></td>'+
      '<td class="row-actions">'+
        '<button data-action="duplicate-tx" data-id="'+t.id+'" title="Duplicar" aria-label="Duplicar a transação de '+esc(t.payee||"sem beneficiário")+'">⧉</button>'+
        '<button data-action="delete-tx" data-id="'+t.id+'" title="Eliminar" aria-label="Eliminar a transação de '+esc(t.payee||"sem beneficiário")+'">🗑</button></td></tr>';
  }

  // ---------- Seleção temporária de transações (apenas visual) ----------
  // Guardada só em memória e limpa a cada render (mudar de página desfaz), como pedido. Nada é
  // gravado nem sofre qualquer ação — serve só para ver um somatório "na hora".
  var _txSel = {};
  // Caixa "selecionar todas", no cabeçalho da coluna Data. Fica na mesma célula das caixas das
  // linhas, por isso alinha por baixo umas das outras sem acrescentar coluna nenhuma — importante
  // no telemóvel, onde não há espaço para mais uma. Seleciona as linhas VISÍVEIS (as que a
  // paginação e os filtros deixaram no ecrã), que é o que o utilizador tem à frente.
  function thSelTodas(){
    return '<label class="tx-selcell" title="Selecionar todas as que estão à vista (só para somar)">'+
      '<input type="checkbox" class="tx-sel-all" aria-label="Selecionar todas"></label>';
  }
  // Acerta o estado da caixa do cabeçalho com o que está mesmo selecionado no ecrã.
  function syncSelTodas(){
    var all=document.querySelectorAll(".tx-sel-all"); if(!all.length) return;
    var boxes=document.querySelectorAll(".tx-sel");
    var n=0; for(var i=0;i<boxes.length;i++) if(boxes[i].checked) n++;
    for(var k=0;k<all.length;k++){
      all[k].checked = (boxes.length>0 && n===boxes.length);
      all[k].indeterminate = (n>0 && n<boxes.length);   // "algumas" — o traço a meio
    }
  }
  function txSelBar(){
    var b = document.getElementById("txSelBar");
    if(!b){
      b = document.createElement("div"); b.id="txSelBar"; b.className="tx-sel-bar";
      b.innerHTML = '<span class="txsel-info"></span><button type="button" class="txsel-clear">Limpar seleção</button>';
      document.body.appendChild(b);
      b.querySelector(".txsel-clear").addEventListener("click", function(){
        _txSel = {};
        var boxes=document.querySelectorAll(".tx-sel"); for(var i=0;i<boxes.length;i++) boxes[i].checked=false;
        syncSelTodas(); renderTxSelBar();
      });
    }
    return b;
  }
  function renderTxSelBar(){
    var out=0, inf=0, n=0;
    for(var i=0;i<state.transactions.length;i++){ var t=state.transactions[i];
      if(_txSel[t.id]){ n++; out=round2(out+(t.outflow||0)); inf=round2(inf+(t.inflow||0)); } }
    var b = txSelBar();
    if(!n){ b.classList.remove("show"); return; }
    var net = round2(inf-out);
    b.querySelector(".txsel-info").innerHTML =
      '<b>'+n+'</b> selecionada'+(n===1?'':'s')+
      ' &nbsp;·&nbsp; Saídas <b>'+fmt(out)+'</b>'+
      ' &nbsp;·&nbsp; Entradas <b>'+fmt(inf)+'</b>'+
      ' &nbsp;·&nbsp; Líquido <b style="color:'+(net<0?'var(--negative)':'var(--positive)')+'">'+fmt(net)+'</b>';
    b.classList.add("show");
  }

  // Períodos prontos, para não ser preciso andar a escolher datas à mão no dia a dia.
  var PERIODOS = [["","Sempre"],["mes","Este mês"],["mesant","Mês passado"],["m3","Últimos 3 meses"],
                  ["m12","Últimos 12 meses"],["ano","Este ano"],["custom","Intervalo à escolha…"]];
  function periodoDatas(per){
    var hoje=todayISO(), mAtual=nowMonthKey();
    if (per==="mes")    return { from:mAtual+"-01", to:hoje };
    if (per==="mesant") { var a=shiftMonth(mAtual,-1), p=a.split("-"); return { from:a+"-01", to:a+"-"+pad(new Date(+p[0], +p[1], 0).getDate()) }; }
    if (per==="m3")     return { from:shiftMonth(mAtual,-2)+"-01", to:hoje };
    if (per==="m12")    return { from:shiftMonth(mAtual,-11)+"-01", to:hoje };
    if (per==="ano")    return { from:mAtual.slice(0,4)+"-01-01", to:hoje };
    return null;
  }
  // A lista de transações TAL COMO ESTÁ À VISTA: mesma ordem, mesmos filtros. Vive fora do
  // render para que o «Exportar o que vejo» possa exportar exatamente o que se está a ver —
  // se as duas coisas tivessem cópias separadas desta regra, um dia deixavam de bater certo.
  function txFiltradas() {
    var f = state.ui.txFilter || {};
    // Mesma data: a última transação adicionada aparece primeiro (desempate por ordem de criação).
    var list = state.transactions.map(function(t,i){ return [t,i]; }).sort(function(a,b){
      if (a[0].date !== b[0].date) return a[0].date < b[0].date ? 1 : -1;
      return b[1] - a[1];
    }).map(function(p){ return p[0]; });
    var jan = (f.per && f.per!=="custom") ? periodoDatas(f.per) : null;
    var de = jan ? jan.from : f.from, ate = jan ? jan.to : f.to;
    if (f.account) list = list.filter(function(t){return t.accountId===f.account;});
    if (f.category) list = list.filter(function(t){return t.categoryId===f.category;});
    if (de) list = list.filter(function(t){return t.date>=de;});
    if (ate) list = list.filter(function(t){return t.date<=ate;});
    if (f.q) { var q=f.q.toLowerCase(); list = list.filter(function(t){ return (t.payee||"").toLowerCase().indexOf(q)>=0 || (t.memo||"").toLowerCase().indexOf(q)>=0; }); }
    // Filtro por beneficiário EXATO (vindo do 🏷 Beneficiários). Diferente da procura por texto:
    // ali "Continente" apanharia também "Continente Bom Dia"; aqui é só aquele beneficiário.
    if (f.payee) list = list.filter(function(t){ return payeeKey(t.payee||"")===f.payee; });
    return list;
  }

  function renderTransactions() {
    var f = state.ui.txFilter || {};
    var list = txFiltradas();

    var perOpts = PERIODOS.map(function(p){ return '<option value="'+p[0]+'"'+((f.per||"")===p[0]?" selected":"")+'>'+p[1]+'</option>'; }).join("");
    var accOpts = '<option value="">Todas as contas</option>' + state.accounts.map(function(a){return '<option value="'+a.id+'"'+(f.account===a.id?" selected":"")+'>'+esc(a.name)+'</option>';}).join("");
    var catOpts = '<option value="">Todas as categorias</option><option value="'+INCOME+'"'+(f.category===INCOME?" selected":"")+'>Rendimento</option>' +
      state.categories.filter(function(c){return !c.cardId;}).map(function(c){return '<option value="'+c.id+'"'+(f.category===c.id?" selected":"")+'>'+esc(c.name)+'</option>';}).join("");

    // Chega-se aqui filtrado a partir da atividade de uma categoria — sem isto não há
    // forma óbvia de voltar a ver tudo.
    // A CONTA não é mais um filtro: quando se entra por Contas → uma conta, ela é o sítio onde
    // se está. Por isso o «Limpar filtros» não lhe toca — limpava tudo e atirava a pessoa
    // para fora da conta que estava a ver, o que ninguém pede ao escrever no campo de procura.
    // Para sair da conta há dois caminhos óbvios e mesmo à vista: o «‹ Contas» e a própria
    // caixa da conta, em «Todas as contas».
    var temFiltroAlemDaConta = !!(f.category || f.per || f.from || f.to || f.payee || (f.q||"").trim());
    var soConta = !!(f.account && !f.category && !f.per && !f.from && !f.to && !f.payee && !(f.q||"").trim());
    // Resumo de um beneficiário: em vez de um ecrã novo, aproveita esta lista já filtrada e
    // acrescenta-lhe uma faixa com os totais. Conta sobre a lista VISÍVEL, por isso cruzar com
    // um período ou uma conta dá logo "quanto gastei aqui este ano".
    var resumoPayee = "";
    if (f.payee && list.length) {
      var rSaida=0, rEntrada=0, porCat={}, primeira=list[list.length-1].date, ultima=list[0].date, nome="";
      for (var rp=0; rp<list.length; rp++){
        var tr=list[rp];
        rSaida = round2(rSaida + (tr.outflow||0));
        rEntrada = round2(rEntrada + (tr.inflow||0));
        if (!nome && tr.payee) nome = tr.payee;
        var ck = tr.categoryId || "";
        porCat[ck] = round2((porCat[ck]||0) + (tr.outflow||0) - (tr.inflow||0));
        if (tr.date < primeira) primeira = tr.date;
        if (tr.date > ultima) ultima = tr.date;
      }
      var liquido = round2(rSaida - rEntrada);
      var media = round2(rSaida / Math.max(1, list.length));
      // As três categorias onde mais gastou com este beneficiário.
      var cats=[]; for (var ck2 in porCat) if (porCat.hasOwnProperty(ck2) && porCat[ck2] > 0.005) cats.push([ck2, porCat[ck2]]);
      cats.sort(function(a,b){ return b[1]-a[1]; });
      var catsTxt = cats.slice(0,3).map(function(p){
        var nomeC = p[0]===INCOME ? "Rendimento" : (p[0] ? ((lkCat(p[0])||{name:"(apagada)"}).name) : "sem categoria");
        return esc(nomeC)+' <b>'+fmt(p[1])+'</b>';
      }).join(' &nbsp;·&nbsp; ');
      function bloco(rot, val, cor){
        return '<div style="min-width:110px;"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);font-weight:700;">'+rot+'</div>'+
               '<div style="font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;'+(cor||'')+'">'+val+'</div></div>';
      }
      resumoPayee =
        '<div class="data-card" style="padding:14px 16px;margin-bottom:12px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;">'+
            '<h3 style="margin:0;font-size:15px;">🏷 '+esc(nome||"Beneficiário")+'</h3>'+
            '<span class="muted" style="font-size:12px;">de '+fmtDate(primeira)+' a '+fmtDate(ultima)+'</span></div>'+
          '<div style="display:flex;gap:18px 26px;flex-wrap:wrap;">'+
            bloco("Gasto", fmt(rSaida))+
            (rEntrada>0.005 ? bloco("Recebido/devolvido", fmt(rEntrada)) : "")+
            (rEntrada>0.005 ? bloco("Líquido", fmt(liquido), liquido<0?'color:var(--positive);':'') : "")+
            bloco("Transações", String(list.length))+
            bloco("Média por vez", fmt(media))+
          '</div>'+
          (catsTxt ? '<div class="hint" style="margin-top:10px;">Onde entrou: '+catsTxt+'</div>' : '')+
        '</div>';
    }
    // O ecrã tem três andares, do mais fixo para o mais volátil:
    //   1. QUEM  — só dentro de uma conta: de que conta se trata e quanto tem.
    //   2. FAZER — as ações. Botões de tamanho normal, com o «Nova transação» na cor da
    //              aplicação, igual ao do Orçamento: é a mesma ação, deve ter o mesmo aspeto.
    //   3. VER   — os filtros e as contagens, em letra pequena: são um ajuste, não uma ação.
    // Antes estava tudo numa barra só, o que obrigava a encolher as ações até ao tamanho dos
    // filtros — e uma ação encolhida ao pé de uma caixa de seleção deixa de se ler como ação.
    var accA = f.account ? accountById(f.account) : null;

    var andarConta = "";
    if (accA) {
      andarConta =
        '<div class="toolbar acc-head">'+
          '<button class="btn sm" data-action="back-accounts" title="Voltar à lista de contas">‹ Contas</button>'+
          '<h3>'+esc(accA.name)+' <span class="pill '+(accA.type==="budget"?"budget":(accA.type==="credit"?"credit":"tracking"))+'">'+
            (accA.type==="budget"?"Orçamento":(accA.type==="credit"?"Cartão de crédito":"Acompanhamento"))+'</span></h3>'+
        '</div>';
    }

    // Dentro de uma conta o «Nova transação» já leva a conta preenchida — é por isso que não há
    // dois botões: é o mesmo, apenas mais bem informado.
    var andarAcoes =
      '<div class="toolbar acc-acoes'+(accA?' tem-conta':'')+'">'+
        // Dentro de uma conta este botão aparece TAMBÉM no telemóvel: o ➕ do cabeçalho abre uma
        // transação em branco, e a graça de estar dentro de uma conta é ela vir já preenchida.
        '<button class="btn primary'+(accA?'':' hide-phone')+'" data-action="add-tx"'+(accA?' data-account="'+f.account+'"':'')+'>➕ Nova transação</button>'+
        (accA ? '<button class="btn" data-action="transfer">↔ Transferir</button>' : '')+
        (accA && accA.type!=="budget" && accountBalance(f.account)<-0.005
          ? '<button class="btn" data-action="pay-card" data-id="'+f.account+'">💳 Pagar cartão</button>' : '')+
        // Um só botão de exportar. Dentro de uma conta sem mais filtros, «o que vejo» É a conta
        // inteira — dois botões lado a lado a produzir o mesmo ficheiro era só confusão.
        '<button class="btn hide-phone" data-action="export-view-csv" title="Guardar num .csv exatamente as transações que estão à vista, com os filtros aplicados">⬇ Exportar o que vejo</button>'+
      '</div>';

    var head = andarConta + andarAcoes + '<div class="toolbar tx-filtros">'+
      '<span class="muted hide-phone tb-etiq" style="font-size:12.5px;">Mostrar:</span>'+
      // O que a procura varre está escrito no próprio campo E na dica: sem isso, a única forma
      // de saber que NÃO varre categorias nem valores era ir experimentar e concluir mal.
      // O ✕ de dentro da caixa apaga SÓ o texto e deixa tudo o resto como estava — é o gesto
      // que se espera de uma caixa de procura, e evita ter de usar o «Limpar filtros» (que é
      // outra coisa) só para apagar uma palavra. Só aparece quando há texto lá dentro.
      '<span class="search-wrap">'+
        '<input class="search" id="txSearch" placeholder="Procurar no beneficiário e na nota…" '+
          'title="Procura no beneficiário e na nota. Para categorias use o filtro de categoria, ao lado. Esc apaga." '+
          'aria-label="Procurar no beneficiário e na nota" value="'+esc(f.q||"")+'">'+
        ((f.q||"").trim() ? '<button class="search-x" data-action="tx-search-clear" title="Apagar o texto da procura" aria-label="Apagar o texto da procura">✕</button>' : '')+
      '</span>'+
      '<select class="filter" id="txFilterAcc" title="Conta" aria-label="Filtrar por conta">'+accOpts+'</select>'+
      '<select class="filter" id="txFilterCat" title="Categoria" aria-label="Filtrar por categoria">'+catOpts+'</select>'+
      '<select class="filter" id="txFilterPer" title="Período" aria-label="Filtrar por período">'+perOpts+'</select>'+
      (f.per==="custom" ? dateField("txFilterFrom", f.from||"", 'class="date-txt filter" title="De"')+
                          dateField("txFilterTo", f.to||"", 'class="date-txt filter" title="Até"') : '')+
      // Aqui o «Limpar» FICA no telemóvel (ao contrário do orçamento): estes filtros são caixas
      // de seleção e um campo de texto — desfazê-los à mão dava quatro gestos. Perde só o rótulo.
      (temFiltroAlemDaConta ? '<button class="btn sm" data-action="tx-filter-clear" title="'+
        (f.account ? "Limpar os filtros, mantendo esta conta" : "Ver todas as transações")+
        '" aria-label="Limpar filtros">✕<span class="rot"> Limpar filtros</span></button>' : '')+
      '</div>'+
      // LINHA DE RESUMO, mesmo por cima da lista: junta os números que descrevem o que se está
      // a ver. Estavam em três sítios — os saldos no chapéu da conta, o «por confirmar» e a
      // contagem no fim da barra de filtros — e cada um gastava uma linha por sua conta.
      // À esquerda ficam os três números que falam do DINHEIRO, seguidos, porque se leem em
      // conjunto: o confirmado, o saldo, e a diferença entre os dois (o que falta o banco
      // processar). À direita fica a contagem de linhas, que é outra conversa — fala da lista,
      // não do dinheiro.
      (function(){
        var partes = [];
        if (accA) {
          var balA = accountBalance(f.account), clA = accountBalance(f.account, true);
          partes.push('Confirmado: <b>'+fmt(clA)+'</b>');
          partes.push('Saldo: <b style="'+(balA<0?"color:var(--negative)":"")+'">'+fmt(balA)+'</b>');
        }
        var pend = porConfirmar(f.account||null);
        if (Math.abs(pend) > 0.005) {
          // O «nesta conta»/«em todas as contas» só no computador: no telemóvel já se lê no
          // filtro de conta, ali ao lado, e era a peça mais comprida da linha.
          partes.push('<b class="pend" title="Registado mas ainda não confirmado no banco">Por confirmar: '+fmt(pend)+'</b>'+
            '<span class="hide-phone"> '+(f.account ? "nesta conta" : "em todas as contas")+'</span>');
        }
        var esq = (accA ? pontoConta(f.account) : "") + partes.join('&nbsp; · &nbsp;');
        // Diz sempre quantas transações ESTÃO À VISTA — como a contagem de categorias no orçamento.
        var dir = list.length+(list.length===1?' transação':' transações');
        return '<div class="tx-resumo muted"><span>'+esq+'</span><span>'+dir+'</span></div>';
      })();

    if (!state.transactions.length) {
      el("content").innerHTML = head + emptyState("🧾","Sem transações","Registe as suas entradas e saídas para ver a atividade no orçamento.",
        '<button class="btn primary" data-action="add-tx">➕ Nova transação</button>');
      return;
    }
    var LIM = state.ui.txLimit || PAGINA;
    var visiveis = list.slice(0, LIM);
    // Só faz sentido mostrar saldo acumulado quando se está a ver UMA conta e nada mais:
    // com outros filtros faltariam movimentos pelo meio e o saldo mentiria.
    var balOf = null;
    if (soConta) {
      var asc = state.transactions.filter(function(t){ return t.accountId===f.account; })
        .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
      balOf = {}; var run = 0;
      for (var bi=0; bi<asc.length; bi++){ run = round2(run + (asc[bi].inflow||0) - (asc[bi].outflow||0)); balOf[asc[bi].id] = run; }
    }
    // A coluna CONTA depende de haver ou não uma conta escolhida — e só disso. Com uma conta
    // escolhida, todas as linhas são dela: repetir o nome em cada uma é gastar a coluna mais
    // larga da tabela a dizer o que o chapéu já diz em cima. (Antes dependia do soConta, por
    // isso bastava juntar um período ou uma categoria para o nome da conta voltar a aparecer
    // em todas as linhas.)
    // A coluna SALDO é outra história e continua presa ao soConta: um saldo acumulado com
    // movimentos escondidos pelo meio não é um saldo, é um número errado.
    var mostraConta = !f.account;
    var nCols = 7 + (mostraConta?1:0) + (soConta?1:0);
    // Separadores de mês, como na lista de recorrentes: dizem de relance onde acaba um mês e
    // começa o outro, sem obrigar a ler as datas uma a uma. Só aparecem se a lista à vista
    // atravessar mais do que um mês — num filtro de «este mês» seriam um título a separar
    // coisa nenhuma.
    var mesesNaVista = {}; for (var vm=0; vm<visiveis.length; vm++) mesesNaVista[monthOf(visiveis[vm].date)] = 1;
    var separaMeses = Object.keys(mesesNaVista).length > 1;
    var mesAnterior = null;
    var body = list.length ? visiveis.map(function(t){
                               var sep = "";
                               if (separaMeses) {
                                 var mm = monthOf(t.date);
                                 if (mm !== mesAnterior) { mesAnterior = mm;
                                   sep = '<tr class="mes-sep"><td colspan="'+nCols+'">'+monthLabel(mm)+'</td></tr>'; }
                               }
                               return sep + txRow(t, balOf?balOf[t.id]:undefined, mostraConta);
                             }).join("")
                           : ('<tr><td colspan="'+nCols+'" class="empty">'+(soConta ? 'Esta conta ainda não tem transações.' : 'Nada corresponde ao filtro.')+'</td></tr>');
    if (list.length > LIM) body += '<tr><td colspan="'+nCols+'" style="text-align:center;padding:14px;">'+
      '<button class="btn" data-action="show-more-tx">Mostrar mais '+PAGINA+' (a ver '+LIM+' de '+list.length+')</button></td></tr>';

    el("content").innerHTML = head + resumoPayee +
      '<div class="data-card"><table class="data"><thead><tr>'+
      '<th>'+thSelTodas()+'Data</th>'+(mostraConta?'<th>Conta</th>':'')+'<th>Beneficiário</th><th>Categoria</th><th class="col-nota">Nota</th>'+
      '<th class="num">Valor</th>'+(soConta?'<th class="num">Saldo</th>':'')+
      '<th style="text-align:center;">✓</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  function niceMax(v){ if(!(v>0)) return 1; var pow=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)); var f=v/pow; var nf=f<=1?1:(f<=2?2:(f<=2.5?2.5:(f<=5?5:10))); return nf*pow; }

  // Gráfico de linhas em SVG (autónomo). W = largura em píxeis medida, para o texto ficar fixo (não amplia).
  function lineChartSVG(series, months, W){
    W = Math.max(320, W||720);
    var H=300, pl=54, pr=16, pTop=16, pb=30, fs=12;
    var iw=W-pl-pr, ih=H-pTop-pb, n=months.length;
    // Aceita valores negativos (o património líquido pode sê-lo): a escala arranca
    // no mínimo em vez de arrancar sempre em zero.
    var maxRaw=0, minRaw=0;
    series.forEach(function(s){ s.values.forEach(function(v){ if(v>maxRaw) maxRaw=v; if(v<minRaw) minRaw=v; }); });
    var maxV = maxRaw>0 ? niceMax(maxRaw) : 0;
    var minV = minRaw<0 ? -niceMax(-minRaw) : 0;
    if (maxV===minV) maxV = minV + 1;
    function xat(i){ return n<=1 ? pl+iw/2 : pl + iw*(i/(n-1)); }
    function yat(v){ return pTop + ih*(1 - (v-minV)/(maxV-minV)); }
    function sfmt(v){ v=Math.round(Math.abs(v)); return v>=1000 ? (Math.round(v/100)/10)+"k" : ""+v; }
    function etiqueta(v){ return (v<-0.5?"-":"") + currencySym() + sfmt(v); }   // «-€1,2k», não «€-1,2k»
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico de evolução">';
    for(var g=0; g<=4; g++){ var gy=pTop+ih*(g/4), gv=maxV-(maxV-minV)*(g/4);
      s+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--border)" stroke-width="1"/>';
      s+='<text x="'+(pl-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="'+fs+'" style="fill:var(--text-muted)">'+etiqueta(gv)+'</text>'; }
    if (minV<0) { var zy=yat(0).toFixed(1);   // linha do zero, para se ver onde começa a dívida
      s+='<line x1="'+pl+'" y1="'+zy+'" x2="'+(W-pr)+'" y2="'+zy+'" style="stroke:var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>'; }
    var step = n>18?4:(n>12?3:(n>6?2:1));
    for(var i=0;i<n;i++){ if(i%step!==0 && i!==n-1) continue; var p=months[i].split("-"); var lab=MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
      s+='<text x="'+xat(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="'+fs+'" style="fill:var(--text-muted)">'+lab+'</text>'; }
    series.forEach(function(se){
      var pts=se.values.map(function(v,i){ return xat(i).toFixed(1)+","+yat(v).toFixed(1); }).join(" ");
      s+='<polyline points="'+pts+'" fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      se.values.forEach(function(v,i){ var cx=xat(i).toFixed(1), cy=yat(v).toFixed(1), p=months[i].split("-"), ml=MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="transparent" class="evo-pt" data-tip="'+esc(se.name+' · '+ml+': '+fmt(v))+'"/>';
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="'+se.color+'" style="pointer-events:none"/>'; });
    });
    return s+'</svg>';
  }

  // Mede a largura disponível e desenha o gráfico com essa largura (texto de tamanho fixo, ocupa o ecrã todo).
  function drawInto(hostId, series, months, vazio){
    var host=el(hostId); if(!host) return;
    if(!series.length){ host.innerHTML='<div class="muted" style="padding:30px 0;text-align:center;">'+vazio+'</div>'; return; }
    host.innerHTML=lineChartSVG(series, months, Math.floor(host.clientWidth||720));
  }
  function drawEvo(series, months){
    drawInto("evoHost", series, months, "Escolha uma ou mais categorias abaixo para ver a evolução.");
  }
  // Património líquido no fim de cada mês: soma de tudo o que aconteceu até lá,
  // em todas as contas (incluindo as de acompanhamento e os cartões).
  function netWorthSeries(months){
    var porMes={};
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i], mm=monthOf(t.date);
      porMes[mm]=(porMes[mm]||0)+((t.inflow||0)-(t.outflow||0));
    }
    var chaves=Object.keys(porMes).sort();
    var vals=[], acumulado=0, ci=0;
    for(var j=0;j<months.length;j++){
      while(ci<chaves.length && chaves[ci]<=months[j]){ acumulado+=porMes[chaves[ci]]; ci++; }
      vals.push(round2(acumulado));
    }
    return vals;
  }

  function renderReports() {
    var m = state.ui.month;

    // ---------- Período: comanda TODOS os blocos deste ecrã ----------
    var nMonths = state.ui.reportMonths || 6;
    var customPer = !!(state.ui.reportFrom && state.ui.reportTo && state.ui.reportFrom<=state.ui.reportTo);
    var meses = [];
    if (customPer) { var cur=state.ui.reportFrom, g=0; while(cur<=state.ui.reportTo && g<60){ meses.push(cur); cur=shiftMonth(cur,1); g++; } }
    else { for (var em=nMonths-1; em>=0; em--) meses.push(shiftMonth(m,-em)); }
    if (!meses.length) meses = [m];
    var noPeriodo = {}; meses.forEach(function(k){ noPeriodo[k]=true; });
    var etiqueta = meses.length===1 ? monthLabel(meses[0]) : (monthLabel(meses[0])+" a "+monthLabel(meses[meses.length-1]));

    // ---------- Uma passagem pelas transações do período ----------
    var totalIn=0, totalOut=0, spend={}, porMes={};
    meses.forEach(function(k){ porMes[k]={inc:0,out:0}; });
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i], mm = monthOf(t.date);
      if (!noPeriodo[mm]) continue;
      if (t.transfer && !t.categoryId) continue;          // transferência interna não é despesa nem receita
      if (isOpening(t)) continue;                          // saldo inicial não é receita/despesa real
      if (t.categoryId === INCOME) { totalIn += (t.inflow||0); porMes[mm].inc += (t.inflow||0); continue; }
      // Uma entrada numa categoria de DESPESA é uma devolução ou um reembolso: abate ao que se
      // gastou nessa categoria, não é rendimento novo. Sem isto, quem devolvesse metade de uma
      // compra continuava a ver a despesa inteira no relatório.
      var gasto = round2((t.outflow||0) - (t.inflow||0));
      if (Math.abs(gasto) > 0.005) {
        var nome = t.categoryId ? ((lkCat(t.categoryId)||{name:"(apagada)"}).name) : "Sem categoria";
        spend[nome] = round2((spend[nome]||0) + gasto);
        totalOut = round2(totalOut + gasto); porMes[mm].out = round2(porMes[mm].out + gasto);
      }
    }
    var net = round2(totalIn - totalOut);

    var repPer = [1,3,6,12,24].map(function(nn){
      return '<button data-action="report-months" data-id="'+nn+'" class="'+((!customPer&&nMonths===nn)?'active':'')+'">'+nn+'<span class="rot"> '+(nn===1?'mês':'meses')+'</span><span class="so-fone">m</span></button>';
    }).join("");
    var blocoPeriodo = '<div class="report-block" style="padding:14px 18px;margin-bottom:18px;">'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">'+
        '<span style="font-weight:700;font-size:13px;">Período</span>'+
        '<div class="seg" style="flex:1;min-width:220px;max-width:340px;">'+repPer+'</div>'+
        '<span class="muted hide-phone" style="font-size:12.5px;">ou</span>'+
        '<input class="filter hide-phone" id="repFrom" type="month" value="'+esc(state.ui.reportFrom||"")+'">'+
        '<span class="muted hide-phone" style="font-size:12.5px;">até</span>'+
        '<input class="filter hide-phone" id="repTo" type="month" value="'+esc(state.ui.reportTo||"")+'">'+
        (customPer?'<button class="btn sm" data-action="report-clear-range">Limpar</button>':'')+
      '</div>'+
      // O período em texto fica em linha própria: na barra dos botões encavalitava-se neles.
      '<div class="hint" style="margin-top:10px;"><b style="color:var(--text);font-size:13px;">'+etiqueta+'</b>'+
        ' — é este o período usado nos totais, na despesa por categoria e nos gráficos.</div>'+
    '</div>';

    // ---------- Despesa por categoria ----------
    var arr = Object.keys(spend).map(function(k){return {name:k,val:spend[k]};}).sort(function(a,b){return b.val-a.val;});
    var maxV = arr.length ? arr[0].val : 1;
    var bars = arr.length ? arr.map(function(x){
      return '<div class="bar-row"><div class="b-name" title="'+esc(x.name)+'">'+esc(x.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,(x.val/maxV)*100)+'%"></div></div>'+
        '<div class="bar-val">'+fmt(x.val)+'</div></div>';
    }).join("") : '<div class="muted" style="padding:8px 0;">Sem despesas registadas neste período.</div>';

    // ---------- Rendimento vs Despesa, mês a mês, com os valores nas barras ----------
    var maxBar = 1;
    meses.forEach(function(k){ maxBar = Math.max(maxBar, porMes[k].inc, porMes[k].out); });
    var trend = meses.map(function(k){
      var d = porMes[k], p = k.split("-");
      var lab = MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
      return '<div class="bar-row" style="grid-template-columns:74px 1fr 1fr;">'+
        '<div class="b-name">'+lab+'</div>'+
        '<div class="bar-track" title="Rendimento"><div class="bar-fill" style="width:'+(d.inc/maxBar*100)+'%;background:linear-gradient(90deg,var(--positive),#4ade80);"></div>'+
          (d.inc>0.005?'<span class="bar-num">'+fmt(d.inc)+'</span>':'')+'</div>'+
        '<div class="bar-track" title="Despesa"><div class="bar-fill" style="width:'+(d.out/maxBar*100)+'%;background:linear-gradient(90deg,#dc2626,#f87171);"></div>'+
          (d.out>0.005?'<span class="bar-num">'+fmt(d.out)+'</span>':'')+'</div>'+
        '</div>';
    }).join("");

    // ---------- Evolução por categoria ----------
    if (state.ui.reportCats === undefined) {
      var _tot={}; for (var _i=0;_i<state.transactions.length;_i++){ var _t=state.transactions[_i]; if(_t.outflow&&_t.categoryId){ _tot[_t.categoryId]=(_tot[_t.categoryId]||0)+_t.outflow; } }
      state.ui.reportCats = Object.keys(_tot).filter(function(id){var c=categoryById(id); return c&&!c.cardId;}).sort(function(a,b){return _tot[b]-_tot[a];}).slice(0,2);
    }
    var mode = state.ui.reportMode || "gasto";
    var monthIdx={}; meses.forEach(function(mm2,ix){ monthIdx[mm2]=ix; });
    var selCats = (state.ui.reportCats||[]).filter(function(id){ var c=categoryById(id); return c && !c.cardId; });
    var valById={}; selCats.forEach(function(id){ valById[id]=meses.map(function(mm2){ return mode==="atribuido" ? assignedFor(id, mm2) : 0; }); });
    if (mode !== "atribuido") {
      for (var si=0; si<state.transactions.length; si++){ var stx=state.transactions[si]; if(!stx.outflow||!stx.categoryId) continue; if(valById[stx.categoryId]===undefined) continue; var ix=monthIdx[monthOf(stx.date)]; if(ix===undefined) continue; valById[stx.categoryId][ix]+=stx.outflow; }
    }
    var evoSeries = selCats.map(function(id,ix){ return {catId:id, name:(categoryById(id)||{name:""}).name, color:REPORT_COLORS[ix%REPORT_COLORS.length], values:valById[id].map(function(v){return round2(v);})}; });
    var allRepCats = state.categories.filter(function(c){ return !c.cardId && !c.hidden; });
    var repChips = allRepCats.map(function(c){ var sIx=selCats.indexOf(c.id); var act=sIx>=0; var col=act?REPORT_COLORS[sIx%REPORT_COLORS.length]:null; return '<button class="rep-chip'+(act?' active':'')+'" data-action="report-toggle-cat" data-id="'+c.id+'"'+(act?' style="background:'+col+';border-color:'+col+';color:#fff"':'')+'>'+esc(c.name)+'</button>'; }).join("");
    var repMode = '<button data-action="report-mode" data-id="gasto" class="'+(mode!=="atribuido"?'active':'')+'">Gasto</button><button data-action="report-mode" data-id="atribuido" class="'+(mode==="atribuido"?'active':'')+'">Atribuído</button>';
    var evoBlock = '<div class="report-block"><h3>📈 Evolução por categoria</h3>'+
      '<div class="seg" style="max-width:260px;margin-bottom:12px;">'+repMode+'</div>'+
      '<div id="evoHost" class="evo-host"></div>'+
      (allRepCats.length ? '<div class="rep-chips" style="margin-top:16px;">'+repChips+'</div>' : '<div class="muted" style="margin-top:12px;">Ainda não há categorias.</div>')+
    '</div>';

    // ---------- Património líquido ----------
    var pnVals = netWorthSeries(meses);
    var pnDelta = round2(pnVals[pnVals.length-1] - pnVals[0]);
    var pnBlock = '<div class="report-block"><h3>💰 Evolução do património líquido</h3>'+
      '<div class="hint" style="margin:-8px 0 12px;">Tudo o que tem, menos tudo o que deve, no fim de cada mês.'+
      (meses.length>1 ? (' Variação no período: <b class="'+(pnDelta>=0?"tx-amt in":"tx-amt out")+'">'+(pnDelta>=0?"+":"")+fmt(pnDelta)+'</b>.') : '')+'</div>'+
      '<div id="pnHost" class="evo-host"></div></div>';

    el("content").innerHTML =
      blocoPeriodo +
      '<div class="kpi-grid">'+
        '<div class="kpi"><div class="k-label">Rendimento</div><div class="k-value pos">'+fmt(totalIn)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Despesa</div><div class="k-value neg">'+fmt(totalOut)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Resultado</div><div class="k-value '+(net>=0?"pos":"neg")+'">'+fmt(net)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Património no fim</div><div class="k-value">'+fmt(pnVals[pnVals.length-1])+'</div></div>'+
      '</div>'+
      '<div class="report-block"><h3>Despesa por categoria</h3>'+bars+'</div>'+
      '<div class="report-block"><h3>Rendimento (verde) vs Despesa (vermelho)</h3>'+trend+'</div>'+
      evoBlock + pnBlock;
    drawEvo(evoSeries, meses);
    drawInto("pnHost", [{ name:"Património líquido", color:REPORT_COLORS[0], values:pnVals }], meses, "Sem dados no período escolhido.");
  }

  function renderRecurring(){
    var list=(state.recurring||[]).slice().sort(function(a,b){return a.nextDate<b.nextDate?-1:(a.nextDate>b.nextDate?1:0);});
    var head='<div class="toolbar"><button class="btn primary" data-action="add-recurring">➕ Nova recorrente</button>'+
      '<div class="spacer"></div><span class="muted" style="font-size:12.5px;">'+list.length+' regras · lançadas automaticamente na data</span></div>';
    if(!list.length){
      el("content").innerHTML=head+emptyState("📅","Sem transações recorrentes",
        "Crie regras para lançar automaticamente o que se repete — renda, salário, subscrições. Aparecem sozinhas na data marcada.",
        '<button class="btn primary" data-action="add-recurring">➕ Nova recorrente</button>');
      return;
    }
    // Separador de mês. A lista já vem por ordem de data, por isso basta reparar quando o mês
    // muda. É só uma linha a mais na tabela: não mexe em contas, em ordens nem em filtros.
    var mesAnterior = null;
    var rows=list.map(function(r){
      var sep = "";
      var mesDesta = monthOf(r.nextDate);
      if (mesDesta !== mesAnterior) {
        mesAnterior = mesDesta;
        sep = '<tr class="mes-sep"><td colspan="8">'+monthLabel(mesDesta)+'</td></tr>';
      }
      var acc=accountById(r.accountId);
      var ehTr=!!r.toAccountId, dest=ehTr?accountById(r.toAccountId):null;
      var cat=ehTr
        ? ('<span class="pill tracking">↔ Transferência</span>'+(r.categoryId?' <span class="tag">'+esc((lkCat(r.categoryId)||{name:"(apagada)"}).name)+'</span>':''))
        : (r.categoryId===INCOME?'<span class="pill budget">Rendimento</span>':(r.categoryId?esc((categoryById(r.categoryId)||{name:"(apagada)"}).name):'<span class="muted">—</span>'));
      // Mesmo sinal e mesma cor da lista de transações: duas listas de dinheiro que se leem

  // Toda a página volta ao topo. Usa-se quando o que está no ecrã passa a ser OUTRA coisa —
  // outra lista, outro ecrã — e não faz sentido aterrar a meio de conteúdo que já não é o mesmo.
  function aoTopo(){
    try { window.scrollTo(0,0); } catch(e){}
    // No telemóvel quem desliza é o cartão da tabela, não a página: sem isto, «voltar ao topo»
    // deixava a lista na mesma altura onde estava.
    try {
      var cs = document.querySelectorAll(".data-card");
      for (var i=0;i<cs.length;i++) cs[i].scrollTop = 0;
    } catch(e){}
  }
  // Ajusta a barra de filtros do orçamento à largura que há. Mede a largura REAL que ela
  // precisaria numa só linha e, enquanto não couber, tira o texto a um grupo de botões de cada
  // vez. Cada degrau é medido outra vez: só se avança se o anterior não tiver chegado.
  function ajustarBarra(){
    try {
      var tb = document.querySelector(".content .toolbar, #content .toolbar");
      if (!tb || !tb.querySelector(".tb-bloco")) return;      // só a barra do orçamento tem blocos
      var degraus = ["enc1","enc2","enc3","enc4","enc5"];
      for (var i=0;i<degraus.length;i++) tb.classList.remove(degraus[i]);
      tb.classList.add("medindo");
      for (var d=0; d<=degraus.length; d++){
        if (tb.scrollWidth <= tb.clientWidth + 1) break;      // já cabe: pára aqui
        if (d < degraus.length) tb.classList.add(degraus[d]);
      }
      tb.classList.remove("medindo");
    } catch(e){}
  }
  // A barra de cima está colada ao topo e muda de altura (no telemóvel dobra para duas linhas).
  // O cabeçalho das tabelas tem de parar exatamente por baixo dela, por isso mede-se.
  function medirTopo(){
    try {
      var raiz = document.documentElement;
      var tb = document.querySelector(".topbar");
      if (tb) raiz.style.setProperty("--topo", Math.round(tb.getBoundingClientRect().height)+"px");
      // No telemóvel, a altura que a lista pode ocupar não pode ser um palpite: mede-se onde a
      // tabela começa e quanto ocupa a barra de baixo, senão as últimas linhas ficavam
      // escondidas por trás dela — e como quem desliza é o cartão, nunca se lá chegava.
      var card = document.querySelector(".data-card");
      if (card) {
        var acima = card.getBoundingClientRect().top + (window.pageYOffset||0);
        var barra = document.querySelector(".sidebar");
        var hb = (barra && getComputedStyle(barra).position === "fixed") ? barra.getBoundingClientRect().height : 0;
        raiz.style.setProperty("--carta", Math.round(acima + hb + 18) + "px");
      }
    } catch(e){}
  }

  // Autocomplete próprio dos beneficiários: filtra à medida que se escreve, sugere a categoria
  // habitual ao lado, e deixa criar um novo (é só usar o texto escrito — os beneficiários nascem
  // das transações). Feito à mão porque o <datalist> nativo não aparece no Safari do iPhone.
  function wirePayeeAutocomplete(input){
    if(!input) return;
    var wrap = input.parentNode, box = null, items = [], active = -1;
    function close(){ if(box && box.parentNode) box.parentNode.removeChild(box); box=null; items=[]; active=-1; }
    function catName(catId){ if(!catId) return ""; if(catId===INCOME) return "Rendimento"; var c=lkCat(catId); return c?c.name:""; }
    function build(q){
      var idx = payeeIndex(), arr=[], qk = payeeKey(q);
      for(var k in idx){ if(!idx.hasOwnProperty(k)) continue; var e=idx[k];
        if(qk && payeeKey(e.name).indexOf(qk)<0) continue;
        arr.push(e);
      }
      arr.sort(function(a,b){
        var as = payeeKey(a.name).indexOf(qk)===0?0:1, bs = payeeKey(b.name).indexOf(qk)===0?0:1;
        return as-bs || b.count-a.count || (a.name<b.name?-1:1);   // começa-por primeiro, depois mais usados
      });
      return arr.slice(0,8);
    }
    function render(){
      var q = input.value.trim();
      var arr = build(q), exact = q && payeeIndex()[payeeKey(q)];
      items = arr.map(function(e){ return { name:e.name, cat:e.cat }; });
      if(q && !exact) items.push({ name:q, isNew:true });
      if(!items.length){ close(); return; }
      if(!box){ box=document.createElement("div"); box.className="ac-list"; wrap.appendChild(box); }
      active = -1;
      box.innerHTML = items.map(function(it,i){
        if(it.isNew) return '<div class="ac-item ac-new" data-i="'+i+'">➕ Usar «'+esc(it.name)+'» (novo)</div>';
        var cn = catName(it.cat);
        return '<div class="ac-item" data-i="'+i+'"><span>'+esc(it.name)+'</span>'+(cn?'<span class="ac-cat">'+esc(cn)+'</span>':'')+'</div>';
      }).join("");
    }
    function highlight(){
      if(!box) return; var nodes=box.querySelectorAll(".ac-item");
      for(var i=0;i<nodes.length;i++) nodes[i].classList.toggle("active", i===active);
      if(active>=0 && nodes[active]) nodes[active].scrollIntoView({block:"nearest"});
    }
    function pick(i){
      var it=items[i]; if(!it) return;
      input.value = it.name; close();
      var ev; try{ ev=new Event("change"); }catch(e){ ev=document.createEvent("Event"); ev.initEvent("change",true,true); }
      input.dispatchEvent(ev);   // dispara a sugestão de categoria e os avisos
      input.focus();
    }
    input.addEventListener("input", render);
    input.addEventListener("focus", render);
    input.addEventListener("keydown", function(e){
      if(!box) return;
      if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(items.length-1, active+1); highlight(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0, active-1); highlight(); }
      else if(e.key==="Enter"){ if(active>=0){ e.preventDefault(); e.stopPropagation(); pick(active); } }
      else if(e.key==="Escape"){ e.stopPropagation(); close(); }
    });
    // mousedown (não click) para escolher antes de o campo perder o foco; preventDefault mantém o foco.
    wrap.addEventListener("mousedown", function(e){
      var it = e.target.closest && e.target.closest(".ac-item");
      if(it){ e.preventDefault(); pick(+it.getAttribute("data-i")); }
    });
    input.addEventListener("blur", function(){ setTimeout(close, 150); });
  }

  function categoryModal(cat, presetGroup) {

    var tg = cat.target || {};

        (editing ? '<div class="field"><label>Ordem no orçamento</label>'+
          '<div style="display:flex;gap:8px;">'+

        '<div class="field"><label>Nota (opcional)</label><input id="catNote" maxlength="300" value="'+esc(cat.note||"")+'" placeholder="Ex.: rever no fim do mês"></div>'+
        '<div class="field"><label>Prioridade</label><select id="catPrio">'+

          opt("weekly","Semanal — valor por semana (× nº de semanas)")+
          opt("monthly","Mensal — ter/reservar todos os meses")+
          opt("quarterly","Trimestral — dividir por 3 meses")+
          opt("semiannual","Semestral — dividir por 6 meses")+
          opt("yearly","Anual — dividir por 12 meses")+

        '<div class="grid-2">'+

        '<div class="field hidden" id="catFundField"><label>Método</label><select id="catFund">'+

          '<div class="hint"><b>Arquivar</b> esconde-a do orçamento mas guarda o histórico — pode repô-la em <b>Dados e cópias</b>. <b>Eliminar</b> apaga-a e as transações ficam sem categoria.</div></div>':'')+
      '</div>'+

    var sel = el("catTType");
    function syncTargetUI(){
      var v = sel.value;
      el("catAmtField").classList.toggle("hidden", v==="none");
      el("catDateField").classList.toggle("hidden", v!=="byDate");
      el("catWeekdayField").classList.toggle("hidden", v!=="weekly");
      var perio = (v==="quarterly"||v==="semiannual"||v==="yearly");
      // O Método (Repor/Reservar) aparece no mensal, nos periódicos E no "até uma data". Os textos
      // das duas opções mudam consoante o tipo — a mesma ideia, com as palavras adequadas a cada um.
      el("catFundField").classList.toggle("hidden", !(v==="monthly" || perio || v==="byDate"));
      var fundV = el("catFund").value;
      if (v==="monthly") {
        el("catFundRefill").textContent = "Repor até este valor — acrescenta só o que falta";
        el("catFundSetAside").textContent = "Reservar este valor todos os meses — mesmo que já o tenha";
        el("catFundHint").textContent = "";
      } else if (perio) {
        var cad = v==="quarterly"?"trimestre":(v==="semiannual"?"semestre":"ano");
        var div = v==="quarterly"?"3":(v==="semiannual"?"6":"12");
        el("catFundRefill").textContent = "Repor — chegar ao total até à data; se gastar a meio, pede mais para compensar";
        el("catFundSetAside").textContent = "Reservar — o mesmo todos os meses (total ÷ "+div+"); gaste à vontade";
        el("catFundHint").textContent = fundV==="setAside"
          ? "Reserva sempre "+(div==="3"?"1/3":div==="6"?"1/6":"1/12")+" do total por mês, aconteça o que acontecer. Ideal para gastos que faz ao longo do "+cad+"."
          : "Junta até ter o total. Se gastar a meio, pede mais nos meses seguintes para na mesma chegar lá.";
      } else if (v==="byDate") {
        el("catFundRefill").textContent = "Repor — chegar ao total na data; se gastar a meio, pede mais para compensar";
        el("catFundSetAside").textContent = "Reservar — mensalidade fixa até à data; gaste à vontade";
        el("catFundHint").textContent = fundV==="setAside"
          ? "Congela agora a mensalidade (o que falta ÷ meses até à data) e pede-a fixa até lá, aconteça o que acontecer. Se um dia ficar para trás, reabra e guarde para recalcular. Não garante o total pousado na data — para isso, escolha Repor."
          : "Reparte o que falta pelos meses até à data. Se gastar a meio, sobe a mensalidade para na mesma chegar ao total na data.";
      }
      // O "mês da despesa" só faz sentido no modo Repor (é aí que reparte o que falta até lá).
      // No modo Reservar o valor é fixo, por isso escondemo-lo para não sugerir que muda a conta.
      el("catDueField").classList.toggle("hidden", !(perio && fundV!=="setAside"));
      if (perio && fundV!=="setAside") el("catDueHint").textContent =
          v==="quarterly" ? "Ex.: o mês em que paga o seguro trimestral. Indicando-o, a aplicação reparte o que ainda falta pelos meses até lá e avança sozinha para o trimestre seguinte. Em branco, reserva 1/3 por mês."
        : v==="semiannual" ? "Ex.: o mês em que paga o seguro semestral. Indicando-o, a aplicação reparte o que ainda falta pelos meses até lá e avança sozinha para o semestre seguinte. Em branco, reserva 1/6 por mês."
        : "Ex.: o mês em que paga o IUC. Indicando-o, a aplicação reparte o que ainda falta pelos meses até lá e avança sozinha para o ano seguinte. Em branco, reserva 1/12 por mês.";
      var hints = { none:"Sem alvo — a categoria não mostra progresso.",
        monthly:"Quer ter este valor disponível todos os meses (ex.: renda, supermercado).",
        weekly:"Valor por semana. O total do mês = valor × nº desse dia da semana no mês (4 ou 5).",
        quarterly:"Total gasto a cada 3 meses (ex.: seguro trimestral). Deixa de pedir dinheiro assim que tiver o total juntado.",
        semiannual:"Total gasto a cada 6 meses (ex.: seguro semestral). Deixa de pedir dinheiro assim que tiver o total juntado.",
        yearly:"Total gasto uma vez por ano (ex.: IUC, seguro anual). Deixa de pedir dinheiro assim que tiver o total juntado.",
        byDate:"Junta o valor total até ao mês indicado (ex.: férias, entrada de carro)." };
      el("catTargetHint").textContent = hints[v]||"";
      el("catAmtLabel").textContent = v==="monthly" ? "Valor por mês" : (v==="weekly" ? "Valor por semana" : (v==="byDate" ? "Total a juntar" : "Valor total do período"));
    }
    sel.addEventListener("change", syncTargetUI);
    var fundSel = el("catFund"); if (fundSel) fundSel.addEventListener("change", syncTargetUI);
    syncTargetUI();
  }

  function dataModal() {
    // O ecrã está organizado em TRÊS blocos, cada um com um propósito:
    //   A · ONDE VIVEM OS DADOS — os três lugares possíveis, do mais frágil ao mais seguro

    //   C · MANUTENÇÃO          — o que se mexe uma vez por ano
    // Os números 1/2/3 nomeiam LUGARES (navegador, ficheiro, nuvem) e não aparelhos concretos:
    // quem hoje tem um PC e um telemóvel pode amanhã ter outra coisa qualquer.
    function caixa(titulo, corpo){
      return '<div class="field" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;">'+
        '<div style="font-weight:700;font-size:13px;">'+titulo+'</div>'+corpo+'</div>';
    }
    function acao(html){ return '<div class="field">'+html+'</div>'; }
    function seccao(t, sub){
      return '<div style="margin:22px 0 10px;"><div style="font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);">'+t+'</div>'+
        (sub?'<div class="hint" style="margin-top:3px;">'+sub+'</div>':'')+'</div>';
    }
    openModal(
      '<div class="modal-head"><h2>💾 Dados e cópias</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+

        seccao("Onde vivem os seus dados",
          "O seu orçamento está guardado <b>dentro do navegador deste aparelho</b> — não há servidor nenhum com os seus dados. Só o <b>2</b> e o <b>3</b> os põem noutro sítio.")+

        // ---- 1 · No navegador ----
        caixa("1 · No navegador &nbsp;<span class=\"muted\" style=\"font-weight:600;font-size:11.5px;\">neste aparelho</span>",
          '<label class="opcao" style="margin-top:8px;">'+
            '<input type="checkbox" data-action="toggle-autobackup" '+(state.settings.autoBackup!==false?"checked":"")+' style="width:auto;"> Guardar um ponto de histórico por dia</label>'+
          '<div class="hint" style="margin-top:4px;">Os <b>'+SNAP_MAX+' dias</b> mais recentes, mais os <b>'+SEG_MAX+'</b> últimos pontos <b>🛟</b> — guardados antes de cada ação que não se pode anular. Servem para <b>corrigir enganos</b>, mas desaparecem com o aparelho: se o perder, se o trocar, ou se limpar os dados do navegador.</div>'+
          // A lista pode ter até 8 pontos e empurrava o resto do ecrã para baixo. Fechada por
          // omissão, com a contagem à vista para se saber o que lá está sem ter de abrir.
          (function(){
            var sn = loadSnaps(), nd = 0, ns = 0;
            for (var i=0;i<sn.length;i++){ if(sn[i].motivo) ns++; else nd++; }
            if (!sn.length) return '<div class="hint" style="margin-top:8px;">Ainda não há histórico guardado — aparece da próxima vez que abrir a aplicação.</div>';
            var resumo = nd + (nd===1?" dia":" dias") + (ns ? (" · "+ns+" ponto"+(ns===1?"":"s")+" 🛟") : "");
            return '<details style="margin-top:10px;">'+
              '<summary style="cursor:pointer;font-weight:600;font-size:12.5px;">🕘 Ver o histórico <span class="muted" style="font-weight:500;">('+resumo+')</span></summary>'+
              snapshotsHtml()+'</details>';
          })())+

        // ---- 2 · Em ficheiro ----
        caixa("2 · Em ficheiro &nbsp;<span class=\"muted\" style=\"font-weight:600;font-size:11.5px;\">fora da aplicação</span>",
          '<div style="font-size:12.5px;font-weight:600;margin-top:8px;">'+
            (state.backup && state.backup.at
              ? ('Última: '+fmtDateTime(state.backup.at)+((daysSinceBackup()||0)>0?(' · há '+daysSinceBackup()+' dia'+((daysSinceBackup()===1)?'':'s')):' · hoje'))
              : 'Ainda não guardou nenhuma cópia em ficheiro.')+
          '</div>'+
          // Onde foi feita. O carimbo da cópia viaja na sincronização, por isso a última cópia pode
          // ter sido feita no outro aparelho — e o ficheiro está lá, não aqui.
          (function(){
            var b=state.backup||{};
            if(!b.at || !b.dev) return "";
            if(b.dev===_deviceId) return '<div class="hint" style="margin-top:2px;">Feita <b>neste '+esc(nomeDesteAparelho())+'</b>.</div>';
            return '<div class="hint" style="margin-top:2px;">⚠️ Feita <b>noutro aparelho</b>'+
              (b.devNome?(' (o '+esc(b.devNome)+')'):'')+' — o ficheiro está lá, não aqui.</div>';
          })()+
          '<div class="hint" style="margin-top:4px;">'+textoEstadoCopia()+'</div>'+
          '<div class="hint" style="margin-top:6px;">É a <b>única</b> cópia que sobrevive a perder o aparelho — <b>guarde-a fora daqui</b> (OneDrive, e-mail, pen).'+
          (usaPartilha()?' Abre a partilha do iPhone.':'')+'</div>'+
          '<button class="btn primary" data-action="export-json" style="width:100%;justify-content:center;margin-top:10px;">⬇ Guardar cópia (.json)</button>'+
          '<div class="hint" style="margin-top:4px;">Guarda <b>todos</b> os orçamentos, completos e fiéis.</div>'+
          '<label style="display:block;margin-top:12px;font-size:12.5px;font-weight:600;">Repor a partir de um ficheiro</label>'+
          '<input id="importFile" type="file" accept="application/json,.json" style="margin-top:5px;">'+
          '<div class="hint">Substitui os dados atuais pelos do ficheiro.</div>')+

        // ---- 3 · Na nuvem ----
        caixa("3 · Na nuvem &nbsp;<span class=\"muted\" style=\"font-weight:600;font-size:11.5px;\">entre os seus aparelhos</span>",
          '<div style="font-size:12.5px;font-weight:600;margin-top:8px;">'+
            (syncReady() ? ('Ligada — '+esc(_syncStatus||"pronta")) : 'Desligada neste aparelho.')+'</div>'+
          (_sync.lastSyncAt ? '<div class="hint" style="margin-top:4px;">Última sincronização: <b>'+esc(fmtDateTime(_sync.lastSyncAt))+'</b></div>' : '')+
          '<div class="hint" style="margin-top:4px;">Mantém os seus aparelhos com os mesmos dados — <b>todos os orçamentos</b> — numa cópia cifrada guardada num gist privado do GitHub.</div>'+
          '<button class="btn" data-action="open-sync" style="width:100%;justify-content:center;margin-top:10px;">☁️ '+(syncReady()?"Gerir sincronização":"Ligar sincronização")+'</button>')+

        seccao("Trazer e levar", "Para trabalhar com os dados <b>fora</b> da aplicação. Não substituem a cópia do <b>2</b>.")+

        // Duas gavetas simétricas, uma para cada sentido: o que ENTRA e o que SAI. Antes o que

        // depois o que a preenche.
        '<details class="field">'+
          '<summary style="cursor:pointer;font-weight:600;font-size:13px;">⬇ Importar de folha de cálculo (.csv)</summary>'+
          '<div style="padding-inline-start:4px;border-inline-start:2px solid var(--border);margin-top:8px;padding-top:2px;">'+
          '<div class="hint" style="margin:0 0 10px 8px;">Traz dados para <b>o orçamento aberto</b> («'+esc(budgetName(_bindex.active)||"")+'»). Mostram sempre o que vão fazer <b>antes</b> de mexer, e o <b>↩</b> desfaz.</div>'+
          '<button class="btn" data-action="import-config" style="width:100%;justify-content:center;">Configuração dos alvos</button>'+
          '<div class="hint" style="margin:4px 0 8px;">A «planta»: grupos, categorias, alvos e prioridades. <b>Não apaga nada</b> — o que já existe fica com o alvo do ficheiro e mantém as transações, o que falta é criado.</div>'+
          '<button class="btn" data-action="import-csv" style="width:100%;justify-content:center;">Transações do banco</button>'+
          '<div class="hint" style="margin-top:4px;">Acrescenta às existentes. As linhas que já tem são detetadas e saltadas.</div>'+
          '</div>'+
        '</details>'+

        '<details class="field">'+
          '<summary style="cursor:pointer;font-weight:600;font-size:13px;">⬆ Exportar para folha de cálculo (.csv)</summary>'+
          '<div style="padding-inline-start:4px;border-inline-start:2px solid var(--border);margin-top:8px;padding-top:2px;">'+
          '<div class="hint" style="margin:0 0 10px 8px;">Para abrir no Excel ou no Sheets e analisar à sua maneira. Exportam <b>só o orçamento aberto</b> («'+esc(budgetName(_bindex.active)||"")+'») e <b>não</b> repõem nada — para isso é a cópia <b>.json</b>.</div>'+
          '<button class="btn" data-action="export-config-csv" style="width:100%;justify-content:center;">Configuração dos alvos</button>'+
          '<div class="hint" style="margin:4px 0 8px;">A «planta» do orçamento: que alvo tem cada categoria, e de que tipo. É este o ficheiro que a importação ao lado lê.</div>'+
          '<button class="btn" data-action="export-csv" style="width:100%;justify-content:center;">Transações</button>'+
          '<div class="hint" style="margin:4px 0 8px;">Todas as transações do orçamento aberto, de todas as contas, uma por linha — sem filtros aplicados.</div>'+
          '<button class="btn" data-action="export-budget-csv" style="width:100%;justify-content:center;">Orçamento do mês em vista</button>'+
          '<div class="hint" style="margin-top:4px;">Os montantes de <b>'+monthLabel(state.ui.month)+'</b>, categoria a categoria.</div>'+
          '</div>'+
        '</details>'+

        // «Manutenção» era um saco para o que sobrava. Cada uma destas coisas é de natureza

        seccao("Definições")+
        // Cor e moeda lado a lado: são as duas preferências do orçamento, e nenhuma precisa da

        '<div class="grid-2 grid-def">'+
          '<div class="field"><label>Cor da aplicação</label>'+
            '<div class="cores">'+
              TEMAS.map(function(t){
                var sel = (temaAtual()===t.id);
                return '<button class="cor-bola'+(sel?' sel':'')+'" data-action="set-theme" data-id="'+t.id+'"'+

              }).join("")+
            '</div><div class="hint" id="corNome">'+esc((function(){
                for (var i=0;i<TEMAS.length;i++) if (TEMAS[i].id===temaAtual()) return TEMAS[i].nome;
                return "";
              })())+'</div></div>'+
          '<div class="field"><label>Moeda</label><select id="curSel">'+

        acao('<button class="btn danger" data-action="reset-data" style="width:100%;justify-content:center;">🗑 Apagar todos os dados</button>'+

        (function(){ var e=espacoApp(); if(!e) return "";

            '<span id="zonaExtra" class="muted">a verificar o resto…</span></div>'; })()+
      '</div>'+
      '<div class="modal-foot"><span class="muted" style="font-size:12px;">Orçamento base-zero · <a href="#" data-action="changelog" style="color:var(--primary);cursor:pointer;">Versão '+APP_VERSION+' — novidades</a></span><button class="btn" data-action="close">Fechar</button></div>');
    // Estado real do armazenamento — as duas coisas que não se veem de outra forma: se os

    (function(){

      try {
        if (navigator.storage && navigator.storage.estimate) {
          navigator.storage.estimate().then(function(q){
            if (q && q.quota) partes.unshift("Histórico e restantes cópias: <b>"+mb(q.usage||0)+"</b> de <b>"+
              (q.quota>1073741824 ? (q.quota/1073741824).toFixed(1).replace(".",",")+" GB" : mb(q.quota))+"</b> disponíveis");
            mostrar();
          })["catch"](fim);
        }
        if (navigator.storage && navigator.storage.persisted) {
          navigator.storage.persisted().then(function(ok){
            partes.push(ok ? "🔒 Protegido: o navegador não apaga estes dados sozinho"
                           : "⚠️ Ainda não protegido — o navegador pode apagar os dados se não usar a aplicação durante uns dias");
            mostrar();
          })["catch"](fim);
        } else {
          partes.push("Este navegador não diz se protege os dados.");
          mostrar();
        }
      } catch(e){ alvo.textContent = ""; }
    })();
    el("importFile").addEventListener("change", function(e){ importJSON(e.target.files[0]); });
    el("curSel").addEventListener("change", function(){ state.settings.currency=el("curSel").value; save(); render(); dataModal(); });
  }

  function payeesModal(){
    var idx = payeeIndex(), arr = [];
    for (var k in idx) if (idx.hasOwnProperty(k)) arr.push({ k:k, e:idx[k] });
    // Ordem à escolha, guardada entre visitas. Em qualquer delas o nome desempata, para a lista
    // não dançar entre beneficiários com a mesma contagem ou a mesma data.
    var ordem = state.ui.payeeSort || "usados";
    var porNome = function(a,b){ return a.e.name.localeCompare(b.e.name, "pt", {sensitivity:"base"}); };
    arr.sort(ordem==="recentes" ? function(a,b){ return (a.e.lastDate<b.e.lastDate?1:(a.e.lastDate>b.e.lastDate?-1:0)) || porNome(a,b); }
           : ordem==="nome"     ? porNome
           :                      function(a,b){ return b.e.count-a.e.count || porNome(a,b); });

    var corpo;
    if (!arr.length) {
      corpo = '<div class="muted" style="text-align:center;padding:20px 0;">Ainda não há beneficiários — aparecem aqui à medida que for registando transações.</div>';
    } else {
      corpo = '<div class="ac-wrap" style="margin-bottom:8px;"><input id="pyFilter" class="search" autocomplete="off" placeholder="Filtrar beneficiários…" style="width:100%;padding-inline-end:34px;">'+
        '<button type="button" class="date-btn" data-action="py-filter-clear" style="pointer-events:auto;cursor:pointer;color:var(--text-muted);" title="Limpar filtro" aria-label="Limpar filtro">✕</button></div>'+

          '<option value="nome"'+(ordem==="nome"?" selected":"")+'>Por ordem alfabética</option>'+
        '</select></div>'+
        '<div id="pyEmpty" class="muted hidden" style="text-align:center;padding:16px 0;">Nenhum beneficiário corresponde.</div>'+
        '<div id="pyList" style="max-height:340px;overflow:auto;">' + arr.map(function(x){
        // Os dois botões vão na MESMA célula da grelha (a .int-row tem 3 colunas: 1fr auto auto).
        // Postos como dois filhos separados, o segundo caía para a linha de baixo.
        return '<div class="int-row" data-pk="'+esc(payeeKey(x.e.name))+'"><span class="who"><b>'+esc(x.e.name)+'</b>'+
          // Sem a categoria: um nome comprido voltava a cortar a linha, e a informação era pouco
          // fiável (era só a ÚLTIMA usada, não a habitual) — quem quiser vê-as todas no 📊.

          // «última em» é que se abrevia, para caber num iPhone pequeno.
          '<span class="tag">'+x.e.count+' transaç'+(x.e.count===1?'ão':'ões')+
            '<span class="rot"> · última em </span><span class="so-fone"> · </span>'+
            fmtDate(x.e.lastDate)+'</span></span>'+
          '<span></span>'+
          // Só os ícones: com o rótulo por extenso os dois botões comiam 163px dos 432 úteis da
          // janela, e a descrição (que precisa de ~290px) era cortada com "…". Assim sobram 356px
          // e cabe inteira. O que fazem fica no title (rato) e no aria-label (leitor de ecrã).
          '<span class="py-acoes">'+
            '<button class="btn sm py-ico" data-action="payee-report" data-id="'+x.k+'" title="Ver as transações e o total deste beneficiário" aria-label="Ver transações e totais de '+esc(x.e.name)+'">📊</button>'+
